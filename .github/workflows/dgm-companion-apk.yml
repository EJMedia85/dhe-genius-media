name: Build DGM Companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'dgm-companion/**'
      - '.github/workflows/dgm-companion-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: dgm-companion
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f dgm-companion/app/build/outputs/apk/debug/app-debug.apk
          file dgm-companion/app/build/outputs/apk/debug/app-debug.apk
          unzip -t dgm-companion/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          echo "APK verified"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dgm-companion-apk
          path: dgm-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
