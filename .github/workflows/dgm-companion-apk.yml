name: Build DGM Companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/dgm-companion-apk.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"
      - name: Clean build
        run: gradle clean --no-daemon --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
      - name: Verify APK archive
        shell: bash
        run: |
          APK="${{ steps.apk.outputs.path }}"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "resources.arsc"
          test "$(unzip -p "$APK" resources.arsc | wc -c)" -gt 0
      - name: Verify APK package metadata
        shell: bash
        run: |
          APK="${{ steps.apk.outputs.path }}"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/dgm-badging.txt
          grep -q "com.dhegeniusmedia.sms" /tmp/dgm-badging.txt
      - name: Verify APK signature
        shell: bash
        run: |
          APK="${{ steps.apk.outputs.path }}"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/dgm-signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/dgm-signature.txt
      - name: Verify APK alignment
        shell: bash
        run: |
          APK="${{ steps.apk.outputs.path }}"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 4 -v 4 "$APK"
      - name: Verify manifest
        shell: bash
        run: |
          APK="${{ steps.apk.outputs.path }}"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/dgm-manifest.txt
          grep -q "com.dhegeniusmedia.sms" /tmp/dgm-manifest.txt
      - name: Publish verified APK
        uses: actions/upload-artifact@v4
        with:
          name: DGM-Companion-APK-Verified
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
