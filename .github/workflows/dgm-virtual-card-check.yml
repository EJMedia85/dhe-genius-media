name: DGM Virtual Card Development Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/dgm-virtual-card-preview]

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run repository syntax checks
        run: npm test
