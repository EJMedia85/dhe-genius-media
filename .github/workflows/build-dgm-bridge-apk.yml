name: Build DGM Bridge APK
on:
  push:
    paths:
      - 'dgm-bridge-android/**'
      - '.github/workflows/build-dgm-bridge-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: dgm-bridge-android
        run: gradle assembleDebug --no-daemon
      - name: Verify APK
        run: test -f dgm-bridge-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dgm-bridge-v1.0.0-debug
          path: dgm-bridge-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
