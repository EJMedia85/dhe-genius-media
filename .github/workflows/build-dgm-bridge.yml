name: Build DGM Bridge APK

on:
  workflow_dispatch:
  push:
    paths:
      - "dgm-bridge/**"
      - ".github/workflows/build-dgm-bridge.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dgm-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dgm-bridge-debug-apk
          path: dgm-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
