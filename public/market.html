<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050b0b"><title>DGM Market | DHE GENIUS MEDIA</title>
<style>
:root{--bg:#050b0b;--card:#0b1515;--card2:#102020;--text:#f7fffb;--muted:#829b93;--green:#25d366;--border:rgba(255,255,255,.08);--red:#ff6670}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -5%,rgba(37,211,102,.14),transparent 30%),linear-gradient(180deg,#050b0b,#071010 55%,#050909);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(5,11,11,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}.bar{max-width:1250px;margin:auto;padding:13px 16px;display:flex;gap:12px;align-items:center}.brand{display:flex;align-items:center;gap:9px;min-width:170px}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#35f47c,#0b9f4a);display:grid;place-items:center;font-weight:900;font-size:12px}.brand b{font-size:13px}.brand small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.search{flex:1;display:flex;gap:8px}.search input{width:100%;background:#0b1717;border:1px solid var(--border);color:#fff;border-radius:12px;padding:11px 13px;outline:none}.cart{border:1px solid rgba(37,211,102,.2);background:rgba(37,211,102,.08);color:#fff;border-radius:12px;padding:11px 14px;font-weight:800}.wrap{max-width:1250px;margin:auto;padding:20px 16px 100px}.hero{border:1px solid var(--border);border-radius:22px;padding:22px;background:linear-gradient(135deg,rgba(37,211,102,.15),rgba(7,18,18,.92));margin-bottom:18px}.hero h1{margin:0;font-size:29px}.hero p{color:var(--muted);margin:7px 0 0}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 15px}.chip{white-space:nowrap;border:1px solid var(--border);background:var(--card);color:#c7d8d2;border-radius:999px;padding:9px 13px;cursor:pointer}.chip.active{background:rgba(37,211,102,.13);color:#fff;border-color:rgba(37,211,102,.35)}.tools{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:5px 0 14px}.tools select{background:#0b1717;color:#fff;border:1px solid var(--border);border-radius:10px;padding:9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:linear-gradient(180deg,#0d1c1c,#081313);border:1px solid var(--border);border-radius:18px;overflow:hidden}.pic{aspect-ratio:1/1;background:#101d1d;position:relative}.pic img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;left:8px;top:8px;background:#25d366;color:#04120a;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900}.info{padding:12px}.info h3{font-size:13px;margin:0 0 6px;line-height:1.35}.muted{color:var(--muted);font-size:10px}.price{font-size:17px;font-weight:900;margin:8px 0}.old{text-decoration:line-through;color:#6e817b;font-size:10px;margin-left:5px;font-weight:500}.add{width:100%;border:0;background:var(--green);color:#04120a;border-radius:10px;padding:10px;font-weight:900}.empty{text-align:center;color:var(--muted);padding:45px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:100%;max-width:620px;background:#091414;border:1px solid var(--border);border-radius:22px 22px 0 0;padding:18px;max-height:88vh;overflow:auto}.sheet h2{margin:0 0 12px}.cartrow{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}.cartrow img{width:60px;height:60px;object-fit:cover;border-radius:10px}.grow{flex:1}.qty{display:flex;gap:6px;align-items:center}.qty button{border:1px solid var(--border);background:#101f1f;color:#fff;border-radius:7px;width:28px;height:28px}.field{display:block;margin-top:10px}.field span{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.field input,.field textarea{width:100%;background:#0d1b1b;border:1px solid var(--border);color:#fff;border-radius:10px;padding:11px;outline:none}.checkout{width:100%;border:0;background:var(--green);color:#04120a;border-radius:11px;padding:12px;font-weight:900;margin-top:12px}.secondary{width:100%;border:1px solid var(--border);background:#101c1c;color:#fff;border-radius:11px;padding:11px;font-weight:700;margin-top:8px}.total{display:flex;justify-content:space-between;padding-top:13px;font-weight:900}.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#132222;border:1px solid rgba(37,211,102,.25);padding:10px 14px;border-radius:999px;font-size:11px;display:none;z-index:80}.toast.show{display:block}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.modal{align-items:center}.sheet{border-radius:22px}.hero h1{font-size:36px}}
</style></head><body>
<header class="top"><div class="bar"><a class="brand" href="/dashboard.html"><div class="logo">DGM</div><div><b>DGM MARKET</b><small>Stay Connected. Stay Genius.</small></div></a><div class="search"><input id="q" placeholder="Search products, phones, electronics..." onkeydown="if(event.key==='Enter')loadProducts()"></div><button class="cart" onclick="openCart()">🛒 <span id="cartCount">0</span></button></div></header>
<main class="wrap"><section class="hero"><h1>Shop DGM Market</h1><p>Discover products, deals and everyday essentials — powered by DHE GENIUS MEDIA.</p></section><div id="chips" class="chips"></div><div class="tools"><strong id="resultText">Market</strong><select id="sort" onchange="loadProducts()"><option value="newest">Newest</option><option value="popular">Popular</option><option value="price_asc">Price: Low to High</option><option value="price_desc">Price: High to Low</option></select></div><section id="grid" class="grid"><div class="empty">Loading DGM Market...</div></section></main>
<div id="modal" class="modal" onclick="if(event.target===this)closeCart()"><div class="sheet"><h2>🛒 Your Cart</h2><div id="cartItems"></div><div class="total"><span>Total</span><span id="cartTotal">GH₵0.00</span></div><div id="checkoutFields"></div><button class="checkout" onclick="checkout()">Checkout with DGM Wallet</button><button class="secondary" onclick="closeCart()">Continue Shopping</button></div></div><div id="toast" class="toast"></div>
<script>
let products=[],cart=JSON.parse(localStorage.getItem("dgm_market_cart")||"[]");
const money=n=>"GH₵"+Number(n||0).toFixed(2);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function save(){localStorage.setItem("dgm_market_cart",JSON.stringify(cart));document.getElementById("cartCount").textContent=cart.reduce((s,x)=>s+x.quantity,0)}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
async function api(url,opt){const r=await fetch(url,{credentials:"include",headers:{"Accept":"application/json","Content-Type":"application/json"},...opt});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.message||"Request failed");return j}
async function loadCategories(){try{const j=await api("/api/market/categories");document.getElementById("chips").innerHTML='<button class="chip active" onclick="selectCategory(\"\",this)">All</button>'+j.categories.map(c=>'<button class="chip" onclick="selectCategory(\''+esc(c.slug)+'\',this)">'+esc(c.icon)+' '+esc(c.name)+'</button>').join("")}catch(e){console.error(e)}}
let selectedCategory="";
function selectCategory(c,el){selectedCategory=c;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));el.classList.add("active");loadProducts()}
async function loadProducts(){const grid=document.getElementById("grid");grid.innerHTML='<div class="empty">Loading products...</div>';try{const p=new URLSearchParams({limit:"48",sort:document.getElementById("sort").value});if(selectedCategory)p.set("category",selectedCategory);if(document.getElementById("q").value.trim())p.set("q",document.getElementById("q").value.trim());const j=await api("/api/market/products?"+p.toString());products=j.products||[];document.getElementById("resultText").textContent=j.total+" products";if(!products.length){grid.innerHTML='<div class="empty">No products found yet.</div>';return}grid.innerHTML=products.map(p=>{const price=p.sale_price??p.price;return '<article class="product"><a href="/market-product.html?id='+p.id+'"><div class="pic">'+(p.image_url?'<img loading="lazy" src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'">':'<div class="empty">🛍️</div>')+(p.sale_price!=null?'<span class="badge">DEAL</span>':"")+'</div></a><div class="info"><h3><a href="/market-product.html?id='+p.id+'">'+esc(p.name)+'</a></h3><div class="muted">'+esc(p.brand||p.category||"DGM Market")+' • ★ '+Number(p.rating||0).toFixed(1)+' ('+Number(p.review_count||0)+')</div><div class="price">'+money(price)+(p.sale_price!=null?'<span class="old">'+money(p.price)+'</span>':"")+'</div><div style="display:flex;gap:7px"><button class="add" style="flex:1" onclick="add('+p.id+')">Add to Cart</button><button class="add" style="width:44px;background:#102020;color:#fff" onclick="wishlist('+p.id+',event)">♡</button></div></div></article>'}).join("")}catch(e){grid.innerHTML='<div class="empty">Could not load the market. Please refresh.</div>';console.error(e)}}
async function wishlist(id,e){if(e)e.preventDefault();try{const j=await api("/api/market/wishlist/"+id,{method:"POST"});toast(j.saved?"Saved to wishlist":"Removed from wishlist")}catch(err){if(/login|session|admin/i.test(err.message))location.href="/login.html";else toast(err.message)}}
function add(id){const p=products.find(x=>x.id===id);if(!p)return;const x=cart.find(x=>x.product_id===id);if(x)x.quantity++;else cart.push({product_id:id,name:p.name,price:p.sale_price??p.price,image_url:p.image_url,quantity:1});save();toast("Added to cart");}
function openCart(){renderCart();document.getElementById("modal").classList.add("show")}
function closeCart(){document.getElementById("modal").classList.remove("show")}
function change(i,d){cart[i].quantity+=d;if(cart[i].quantity<1)cart.splice(i,1);save();renderCart()}
function renderCart(){const box=document.getElementById("cartItems");if(!cart.length){box.innerHTML='<div class="empty">Your cart is empty.</div>';document.getElementById("cartTotal").textContent=money(0);document.getElementById("checkoutFields").innerHTML="";return}let total=0;box.innerHTML=cart.map((x,i)=>{total+=Number(x.price)*x.quantity;return '<div class="cartrow"><img src="'+esc(x.image_url||"")+'"><div class="grow"><strong>'+esc(x.name)+'</strong><div class="muted">'+money(x.price)+'</div><div class="qty"><button onclick="change('+i+',-1)">−</button><span>'+x.quantity+'</span><button onclick="change('+i+',1)">+</button></div></div></div>'}).join("");document.getElementById("cartTotal").textContent=money(total);document.getElementById("checkoutFields").innerHTML='<label class="field"><span>Delivery name</span><input id="dName" placeholder="Full name"></label><label class="field"><span>Phone</span><input id="dPhone" placeholder="024XXXXXXX"></label><label class="field"><span>Delivery address</span><textarea id="dAddress" rows="2" placeholder="House, area, city"></textarea></label><label class="field"><span>Order note (optional)</span><input id="dNote" placeholder="Optional note"></label>'}
async function checkout(){if(!cart.length)return toast("Your cart is empty");const name=document.getElementById("dName")?.value.trim(),phone=document.getElementById("dPhone")?.value.trim(),address=document.getElementById("dAddress")?.value.trim();if(!name||!phone||!address)return toast("Enter your delivery details");try{const j=await api("/api/market/checkout",{method:"POST",body:JSON.stringify({items:cart.map(x=>({product_id:x.product_id,quantity:x.quantity,variant:x.variant||{}})),delivery:{name,phone,address,notes:document.getElementById("dNote")?.value||""}})});cart=[];save();closeCart();toast("Order "+j.order.order_ref+" placed successfully");setTimeout(()=>location.href="/market-orders.html",700)}catch(e){if(/login/i.test(e.message))location.href="/login.html";else toast(e.message)}}
save();loadCategories();loadProducts();
</script></body></html>
