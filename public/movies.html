<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>DGM Movies • DHE GENIUS MEDIA</title>
<style>
*{box-sizing:border-box}
:root{--bg:#050505;--panel:#111;--panel2:#181818;--text:#fff;--muted:#a8a8a8;--green:#25d366;--red:#e50914}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
header{position:fixed;top:0;left:0;right:0;z-index:30;background:linear-gradient(#050505f2,#050505b8,transparent);padding:15px 18px}
.nav{max-width:1250px;margin:auto;display:flex;align-items:center;gap:18px}
.back{color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.logo{font-weight:900;letter-spacing:.5px}
.logo b{color:var(--green)}
.navLinks{display:flex;gap:16px;margin-left:10px}
.navLinks a{color:#ddd;text-decoration:none;font-size:13px}
.navLinks a:hover{color:#fff}
.navSearch{margin-left:auto;display:flex;align-items:center}
.navSearch input{width:0;opacity:0;padding:10px 0;border:1px solid transparent;background:#000b;color:#fff;border-radius:8px;transition:.2s}
.navSearch.open input{width:210px;opacity:1;padding:10px 12px;border-color:#ffffff30}
.iconBtn{border:0;background:#ffffff12;color:#fff;border-radius:9px;padding:10px 12px}
main{max-width:1250px;margin:auto;padding:0 18px 80px}
.hero{min-height:650px;margin:0 -18px 28px;position:relative;overflow:hidden;background:#111}
.heroBg{position:absolute;inset:0;background-size:cover;background-position:center top;opacity:.72}
.heroShade{position:absolute;inset:0;background:linear-gradient(90deg,#050505 0%,#050505dd 30%,#05050565 58%,#050505 100%),linear-gradient(0deg,#050505 0%,transparent 45%)}
.heroContent{position:relative;z-index:2;max-width:560px;padding:230px 25px 60px}
.eyebrow{font-size:12px;font-weight:900;color:var(--green);letter-spacing:1.5px;margin-bottom:10px}
.hero h1{font-size:clamp(34px,6vw,64px);line-height:.98;margin:0 0 15px}
.hero p{color:#ddd;line-height:1.55;font-size:14px;max-width:540px}
.meta{font-size:12px;color:#bbb}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:6px;padding:11px 17px;font-weight:800}
.btn.primary{background:#fff;color:#050505}
.btn.secondary{background:#ffffff20;color:#fff}
.btn.green{background:var(--green);color:#06110b}
.status{color:var(--muted);font-size:12px;margin:12px 0 18px}
.toolbar{display:flex;gap:9px;overflow:auto;padding:3px 0 8px;margin-bottom:12px}
.chip{white-space:nowrap;border:1px solid #ffffff1c;background:#141414;color:#ddd;border-radius:999px;padding:9px 13px;font-size:12px}
.chip.active{background:#fff;color:#000;border-color:#fff}
.section{margin:30px 0}
.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section h2{font-size:20px;margin:0}
.sectionHead button{border:0;background:transparent;color:#bbb;font-size:12px}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:145px;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 1px 10px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{scroll-snap-align:start;min-width:0;cursor:pointer;position:relative}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;border-radius:8px;background:#181818;transition:.2s}
.card:hover .poster{transform:scale(1.035)}
.rank{position:absolute;left:-2px;bottom:0;font-size:58px;line-height:.8;font-weight:900;color:#000;text-shadow:-1px -1px 0 #aaa,1px -1px 0 #aaa,-1px 1px 0 #aaa,1px 1px 0 #aaa;z-index:2}
.cardTitle{font-size:12px;font-weight:700;line-height:1.25;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rating{font-size:11px;color:#f3d26a;margin-top:4px}
.empty{padding:30px;text-align:center;color:var(--muted);background:#111;border-radius:12px}
.searchPanel{display:none;margin-top:12px}
.searchPanel.show{display:block}
.searchGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}
.gridCard{cursor:pointer}
.gridCard .poster{border-radius:8px}
.loadMore{display:block;margin:18px auto 0;background:#ffffff14;color:#fff;border:1px solid #ffffff20;padding:10px 16px;border-radius:8px}
.modal{position:fixed;inset:0;z-index:60;background:#000e;display:none;overflow:auto;padding:15px}
.modal.show{display:block}
.modalBox{max-width:980px;margin:25px auto;background:#111;border:1px solid #ffffff18;border-radius:12px;overflow:hidden}
.detailHero{position:relative;min-height:380px;background:#181818}
.detailHero img{width:100%;height:380px;object-fit:cover;opacity:.65}
.detailShade{position:absolute;inset:0;background:linear-gradient(0deg,#111 0%,transparent 70%)}
.close{position:absolute;right:15px;top:15px;z-index:3;border:0;border-radius:50%;width:38px;height:38px;background:#fff;color:#000;font-size:18px}
.detailInfo{padding:0 25px 30px}
.detailPoster{width:160px;border-radius:9px;float:left;margin:-75px 20px 12px 0;position:relative;z-index:4}
.detailInfo h2{font-size:30px;margin:0 0 7px}
.detailInfo p{color:#c4c4c4;line-height:1.6;font-size:14px}
.genreList{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.genre{font-size:11px;background:#222;padding:7px 9px;border-radius:999px;color:#ddd}
.trailerPlayer{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin:12px 0}
.trailerPlayer iframe{width:100%;height:100%;border:0}
.trailer{display:inline-block;margin:5px 5px 5px 0;padding:10px 12px;background:#222;color:#fff;border:1px solid #ffffff14;border-radius:7px;font-size:12px}
.watchBox{margin-top:18px;padding:16px;background:#171717;border-radius:10px}
.watchNote{font-size:12px;color:#999;line-height:1.5}
.watchLink{display:inline-block;margin:5px 5px 0 0;padding:10px 12px;border-radius:7px;background:#fff;color:#000;text-decoration:none;font-size:12px;font-weight:800}
.provider{display:inline-block;margin:4px 4px 0 0;background:#222;color:#ddd;border-radius:6px;padding:8px 10px;font-size:11px}
.cast{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;clear:both;margin-top:15px}
.person{background:#171717;border-radius:8px;overflow:hidden}
.person img{width:100%;aspect-ratio:1/1.25;object-fit:cover}
.person div{padding:8px;font-size:11px}
.reco{clear:both;margin-top:25px}
@media(max-width:900px){.searchGrid{grid-template-columns:repeat(5,1fr)}.cast{grid-template-columns:repeat(5,1fr)}}
@media(max-width:700px){.navLinks{display:none}.hero{min-height:570px}.heroContent{padding-top:220px}.row{grid-auto-columns:125px}.searchGrid{grid-template-columns:repeat(3,1fr)}.cast{grid-template-columns:repeat(4,1fr)}.detailHero,.detailHero img{min-height:260px;height:260px}.detailPoster{width:120px;margin-top:-55px}.detailInfo h2{font-size:23px}}
@media(max-width:430px){header{padding:12px}.nav{gap:10px}.logo{font-size:13px}.navSearch.open input{width:145px}.hero{min-height:530px}.heroContent{padding:210px 20px 35px}.row{grid-auto-columns:115px}.searchGrid{grid-template-columns:repeat(2,1fr)}.cast{grid-template-columns:repeat(3,1fr)}.detailInfo{padding:0 15px 25px}.detailPoster{width:105px}.detailHero,.detailHero img{height:220px;min-height:220px}}
</style>
</head>
<body>
<header>
<div class="nav">
<a class="back" href="/entertainment.html">‹</a>
<div class="logo">DGM <b>MOVIES</b></div>
<nav class="navLinks"><a href="#home">Home</a><a href="#trending">Trending</a><a href="#popular">Popular</a><a href="#genres">Genres</a></nav>
<div class="navSearch" id="navSearch"><input id="query" placeholder="Titles, people..." autocomplete="off"><button class="iconBtn" onclick="toggleSearch()">⌕</button></div>
</div>
</header>
<main id="home">
<section id="hero"></section>
<div id="status" class="status">Loading DGM Movies…</div>
<div id="genres" class="toolbar"></div>
<div id="searchPanel" class="searchPanel"></div>
<div id="sections"></div>
</main>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalBox"><div id="detail"></div></div></div>
<script>
const state={home:null,genres:[],genrePage:1,genreTotal:1,genreId:"",genreSort:"popularity.desc",searchPage:1,searchTotal:1,query:""};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"}[c]));
function img(path){return path||"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='500' height='750'><rect width='100%' height='100%' fill='#181818'/><text x='50%' y='50%' fill='#888' text-anchor='middle' font-size='24'>DGM MOVIES</text></svg>")}
function card(m,rank=false){return '<article class="card" onclick="openMovie('+m.id+')">'+(rank?'<span class="rank">'+m.rank+'</span>':'')+'<img class="poster" loading="lazy" src="'+img(m.poster_url)+'" alt="'+esc(m.title)+'"><div class="cardTitle">'+esc(m.title)+'</div><div class="rating">★ '+Number(m.rating||0).toFixed(1)+'</div></article>'}
function row(title,items,id){const arr=(items||[]).slice(0,20);return '<section class="section" id="'+(id||"")+'"><div class="sectionHead"><h2>'+title+'</h2><button onclick="scrollRow(this)">See all ›</button></div><div class="row">'+arr.map((m,i)=>card({...m,rank:i+1},title.includes("Trending"))).join("")+'</div></section>'}
function scrollRow(btn){const row=btn.parentElement.nextElementSibling;row.scrollBy({left:Math.min(row.clientWidth*0.85,600),behavior:"smooth"})}
function toggleSearch(){document.getElementById("navSearch").classList.toggle("open");if(document.getElementById("navSearch").classList.contains("open"))document.getElementById("query").focus()}
function renderGenres(){document.getElementById("genres").innerHTML='<button class="chip '+(!state.genreId?'active':'')+'" onclick="selectGenre(\"\")">All</button>'+state.genres.map(g=>'<button class="chip '+(state.genreId==g.id?'active':'')+'" onclick="selectGenre('+g.id+')">'+esc(g.name)+'</button>').join("")}
async function loadGenres(){try{const r=await fetch("/api/movies/genres");const d=await r.json();if(d.success){state.genres=d.genres||[];renderGenres()}}catch{}}
async function loadHome(){
 try{
  const r=await fetch("/api/movies/home");const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Movie service unavailable");
  state.home=d.sections;const f=d.sections.trending?.[0];
  if(f)document.getElementById("hero").innerHTML='<div class="hero"><div class="heroBg" style="background-image:url('+JSON.stringify(img(f.backdrop_url||f.poster_url))+')"></div><div class="heroShade"></div><div class="heroContent"><div class="eyebrow">DGM MOVIES • FEATURED</div><h1>'+esc(f.title)+'</h1><div class="meta">★ '+Number(f.rating||0).toFixed(1)+' · '+esc((f.release_date||"").slice(0,4))+' · Movie</div><p>'+esc(f.overview||"Discover movies, trailers and official viewing options with DGM Movies.")+'</p><div class="actions"><button class="btn primary" onclick="openMovie('+f.id+')">▶ View Details</button><button class="btn secondary" onclick="openMovie('+f.id+')">ⓘ More Info</button></div></div></div>';
  document.getElementById("sections").innerHTML=row("🔥 Trending",d.sections.trending,"trending")+row("⭐ Popular",d.sections.popular,"popular")+row("🎬 Now Playing",d.sections.now_playing)+row("📅 Coming Soon",d.sections.upcoming);
  document.getElementById("status").textContent="Discover movies with DGM Movies.";
 }catch(e){document.getElementById("status").textContent=e.message;document.getElementById("sections").innerHTML='<div class="empty">Movie discovery is currently unavailable.</div>'}
}
async function selectGenre(id){state.genreId=String(id||"");state.genrePage=1;state.genreTotal=1;renderGenres();if(!id){loadHome();return}await loadDiscover(true)}
async function loadDiscover(reset=true){
 const box=document.getElementById("searchPanel");box.classList.add("show");if(reset)box.innerHTML='<div class="empty">Loading genre…</div>';
 try{
  const r=await fetch("/api/movies/discover?genre="+encodeURIComponent(state.genreId)+"&page="+state.genrePage+"&sort="+encodeURIComponent(state.genreSort));const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Could not load genre");
  state.genreTotal=d.total_pages||1;const title=(state.genres.find(g=>String(g.id)===state.genreId)||{}).name||"Genre";
  const html='<section class="section"><div class="sectionHead"><h2>Movies · '+esc(title)+'</h2><button onclick="clearGenre()">Clear</button></div><div class="searchGrid">'+(d.results||[]).map(m=>'<article class="gridCard" onclick="openMovie('+m.id+')"><img class="poster" loading="lazy" src="'+img(m.poster_url)+'" alt="'+esc(m.title)+'"><div class="cardTitle">'+esc(m.title)+'</div><div class="rating">★ '+Number(m.rating||0).toFixed(1)+'</div></article>').join("")+'</div>'+(state.genrePage<state.genreTotal?'<button class="loadMore" onclick="state.genrePage++;loadDiscover(false)">Load more</button>':'')+'</section>';
  box.innerHTML=html;box.scrollIntoView({behavior:"smooth",block:"start"});
 }catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
function clearGenre(){state.genreId="";state.genrePage=1;document.getElementById("searchPanel").classList.remove("show");renderGenres()}
async function searchMovies(){
 const q=document.getElementById("query").value.trim();if(q.length<2)return;
 state.query=q;state.searchPage=1;state.searchTotal=1;await doSearch(true)
}
async function doSearch(reset=true){
 const box=document.getElementById("searchPanel");box.classList.add("show");if(reset)box.innerHTML='<div class="empty">Searching…</div>';
 try{
  const r=await fetch("/api/movies/search?query="+encodeURIComponent(state.query)+"&page="+state.searchPage);const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Search failed");
  state.searchTotal=d.total_pages||1;
  const html='<section class="section"><div class="sectionHead"><h2>Results for “'+esc(state.query)+'”</h2><button onclick="clearSearch()">Clear</button></div><div class="searchGrid">'+(d.results||[]).map(m=>'<article class="gridCard" onclick="openMovie('+m.id+')"><img class="poster" loading="lazy" src="'+img(m.poster_url)+'" alt="'+esc(m.title)+'"><div class="cardTitle">'+esc(m.title)+'</div><div class="rating">★ '+Number(m.rating||0).toFixed(1)+'</div></article>').join("")+'</div>'+(state.searchPage<state.searchTotal?'<button class="loadMore" onclick="state.searchPage++;doSearch(false)">Load more</button>':'')+'</section>';
  box.innerHTML=html;box.scrollIntoView({behavior:"smooth",block:"start"});
 }catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
function clearSearch(){state.query="";document.getElementById("query").value="";document.getElementById("searchPanel").classList.remove("show")}
async function openMovie(id){
 document.getElementById("modal").classList.add("show");document.getElementById("detail").innerHTML='<div class="empty">Loading movie details…</div>';
 try{
  const [r,rr]=await Promise.all([fetch("/api/movies/"+id+"?country=GH"),fetch("/api/movies/recommendations/"+id)]);
  const d=await r.json();const rec=await rr.json();if(!r.ok||!d.success)throw new Error(d.message||"Could not load movie");
  const m=d.movie;const genres=(m.genres||[]).map(g=>'<span class="genre">'+esc(g.name)+'</span>').join("");
  const cast=(d.cast||[]).map(p=>'<div class="person">'+(p.profile_url?'<img loading="lazy" src="'+p.profile_url+'" alt="'+esc(p.name)+'">':'<div style="height:120px"></div>')+'<div><strong>'+esc(p.name)+'</strong><br><span class="meta">'+esc(p.character)+'</span></div></div>').join("");
  const trailers=(d.trailers||[]).map((t,i)=>'<button class="trailer" onclick="playTrailer('+i+',\''+esc(t.youtube_embed_url||t.url)+'\',\''+esc(t.name)+'\')">▶ '+esc(t.name)+'</button>').join("");
  const p=[...(d.watch_providers?.flatrate||[]),...(d.watch_providers?.rent||[]),...(d.watch_providers?.buy||[])].filter((v,i,a)=>a.findIndex(x=>x.provider_id===v.provider_id)===i).slice(0,10);
  const providers=p.length?p.map(x=>'<span class="provider">'+esc(x.provider_name)+'</span>').join(""):'<span class="meta">No provider listings returned for this country.</span>';
  const watch='<div class="watchBox"><h3>Watch on DGM</h3><div id="dgmPlayerState" class="watchNote">Checking authorized DGM playback…</div><div id="dgmPlayer"></div></div><div class="watchBox"><h3>Official availability</h3><p class="watchNote">If DGM does not have an authorized playback source for this title, TMDB availability listings are shown below.</p>'+providers+(d.watch_providers?.link?'<br><a class="watchLink" href="'+d.watch_providers.link+'" target="_blank" rel="noopener noreferrer">Open official availability</a>':"")+'</div>';
  const recommendations=(rec.success&&rec.results?.length)?'<div class="reco"><h3>More like this</h3><div class="row">'+rec.results.map(card).join("")+'</div></div>':"";
  document.getElementById("detail").innerHTML='<div class="detailHero"><button class="close" onclick="closeModal()">×</button><img src="'+img(m.backdrop_url||m.poster_url)+'" alt=""><div class="detailShade"></div></div><div class="detailInfo"><img class="detailPoster" src="'+img(m.poster_url)+'" alt="'+esc(m.title)+'"><h2>'+esc(m.title)+'</h2><div class="meta">★ '+Number(m.rating||0).toFixed(1)+' · '+esc((m.release_date||"").slice(0,4))+(m.runtime?' · '+m.runtime+' min':'')+'</div><div class="genreList">'+genres+'</div><p>'+esc(m.overview||"No synopsis available.")+'</p>'+(m.tagline?'<p><em>'+esc(m.tagline)+'</em></p>':"")+'<h3>Official trailers</h3><p class="watchNote">Trailer playback stays inside DGM. Full-movie playback is only available through authorized services listed below.</p><div id="trailerPlayer"></div>'+(trailers||'<p class="meta">No trailer returned.</p>')+watch+'<h3>Cast</h3><div class="cast">'+(cast||'<p class="meta">Cast unavailable.</p>')+'</div>'+recommendations+'<div style="clear:both"></div></div>';
  loadPlayback(m.id);
 }catch(e){document.getElementById("detail").innerHTML='<div class="empty">'+esc(e.message)+'<br><br><button class="btn green" onclick="closeModal()">Close</button></div>'}
}
async function loadPlayback(id){
 const stateBox=document.getElementById("dgmPlayerState");
 const playerBox=document.getElementById("dgmPlayer");
 if(!stateBox||!playerBox)return;
 try{
  const r=await fetch("/api/movies/playback/"+encodeURIComponent(id));
  const d=await r.json();
  if(!r.ok||!d.success||!d.available){
   stateBox.textContent="Full-movie playback is not currently available on DGM for this title.";
   return;
  }
  playerBox.innerHTML='<div class="trailerPlayer"><video id="dgmVideo" controls playsinline preload="metadata" style="width:100%;height:100%;background:#000" controlsList="nodownload"></video></div>';
  const video=document.getElementById("dgmVideo");
  if(d.playback_type==="mp4"){
   video.src=d.playback_url;
   stateBox.textContent="Authorized DGM playback source.";
   return;
  }
  if(d.playback_type==="hls"){
   if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src=d.playback_url;
    stateBox.textContent="Authorized DGM HLS playback.";
    return;
   }
   const script=document.createElement("script");
   script.src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js";
   script.onload=()=>{
    if(window.Hls){
     const hls=new Hls({enableWorker:true});
     hls.loadSource(d.playback_url);
     hls.attachMedia(video);
     stateBox.textContent="Authorized DGM HLS playback.";
    }else stateBox.textContent="This browser cannot initialize HLS playback.";
   };
   script.onerror=()=>stateBox.textContent="HLS player could not be loaded in this browser.";
   document.head.appendChild(script);
   return;
  }
  stateBox.textContent="Unsupported playback format.";
 }catch(e){
  stateBox.textContent="DGM playback is temporarily unavailable.";
 }
}
function playTrailer(index,url,name){const box=document.getElementById("trailerPlayer");if(!box||!url)return;box.innerHTML='<div class="trailerPlayer"><iframe src="'+url+(url.includes("?")?"&":"?")+'autoplay=1&rel=0" title="'+esc(name)+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>';box.scrollIntoView({behavior:"smooth",block:"center"})}
function closeModal(){document.getElementById("modal").classList.remove("show");const box=document.getElementById("trailerPlayer");if(box)box.innerHTML=""}
document.getElementById("query").addEventListener("keydown",e=>{if(e.key==="Enter")searchMovies()});
loadHome();loadGenres();
</script>
</body>
</html>
