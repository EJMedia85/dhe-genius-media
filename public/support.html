<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110d"><title>DGM</title><style>
*{box-sizing:border-box}body{margin:0;background:#050b0b;color:#f7fffb;font-family:Inter,Arial,sans-serif;padding:20px 16px 90px}.wrap{max-width:1000px;margin:auto}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.back{color:#25d366;text-decoration:none;font-size:28px}.brand{font-weight:900}.muted{color:#829b93;font-size:12px}.card{background:#0b1515;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border-bottom:1px solid rgba(255,255,255,.07);padding:14px 0}.row:last-child{border-bottom:0}.amount{font-weight:900}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:rgba(37,211,102,.1);color:#25d366;font-size:10px;font-weight:800}.pill.warn{color:#f4c95d;background:rgba(244,201,93,.1)}.pill.bad{color:#ff6670;background:rgba(255,102,112,.1)}button{background:#25d366;color:#06100b;border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}input,textarea,select{width:100%;background:#07100f;color:#fff;border:1px solid #20352d;border-radius:10px;padding:12px;margin-top:7px}label{display:block;margin:12px 0;font-size:12px;color:#9ab0a8}.empty{text-align:center;color:#829b93;padding:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){body{padding:14px 12px 80px}.row{flex-direction:column}.actions{width:100%}}
</style></head><body><main class="wrap"><div class="top"><a class="back" href="/dashboard.html">‹</a><div><div class="brand">DGM Support</div><div class="muted">Get help with your account, wallet and orders</div></div></div>
<section class="card"><h3>Contact Support</h3><label>Subject<input id="subject" maxlength="160" placeholder="e.g. My data order is delayed"></label><label>Message<textarea id="message" rows="5" maxlength="5000" placeholder="Tell us what happened..."></textarea></label><button onclick="submitTicket()">Send Support Request</button><div id="msg" class="muted"></div></section>
<section class="card"><h3>My Support Requests</h3><div id="tickets"><div class="empty">Loading...</div></div></section>
<script>
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
async function load(){const r=await fetch("/api/support/tickets",{credentials:"include",cache:"no-store"});if(r.status===401){location.href="/login.html";return}const x=await r.json();const b=document.getElementById("tickets");b.innerHTML=x.tickets?.length?x.tickets.map(t=>'<article class="row"><div><b>'+esc(t.subject)+'</b><div class="muted">'+esc(t.message)+'</div><div class="muted">'+new Date(t.created_at).toLocaleString()+'</div>'+(t.admin_reply?'<div style="margin-top:8px"><b>DGM reply:</b> '+esc(t.admin_reply)+'</div>':'')+'</div><div><span class="pill '+(t.status==="Closed"?"":"warn")+'">'+esc(t.status)+'</span></div></article>').join(""):'<div class="empty">No support requests yet.</div>'}
async function submitTicket(){const subject=document.getElementById("subject").value.trim(),message=document.getElementById("message").value.trim(),m=document.getElementById("msg");if(!subject||!message){m.textContent="Enter a subject and message.";return}const r=await fetch("/api/support/tickets",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({subject,message})});const x=await r.json();m.textContent=x.message||"Request sent.";if(r.ok){document.getElementById("subject").value="";document.getElementById("message").value="";load()}}
load();
</script></main></body></html>
