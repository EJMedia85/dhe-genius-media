<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | DHE GENIUS MEDIA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #123b7a 0%, #07111f 42%, #02060c 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 35px 18px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #1d9bf0, #0066ff);
      box-shadow: 0 12px 35px rgba(0, 102, 255, 0.35);
    }

    .brand h1 {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .brand p {
      margin-top: 7px;
      color: #a9bad0;
      font-size: 14px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 30px 24px;
      border-radius: 24px;
      background: rgba(10, 22, 38, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
    }

    .card h2 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a8bf;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .message {
      display: none;
      padding: 12px 14px;
      margin-bottom: 18px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(255, 70, 70, 0.12);
      border: 1px solid rgba(255, 70, 70, 0.3);
      color: #ff9d9d;
    }

    .message.success {
      background: rgba(37, 211, 102, 0.12);
      border: 1px solid rgba(37, 211, 102, 0.3);
      color: #72f0a0;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #dce7f4;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border-radius: 13px;
      border: 1px solid #263a52;
      outline: none;
      background: #081321;
      color: #ffffff;
      font-size: 15px;
      transition: 0.2s ease;
    }

    input::placeholder {
      color: #60738a;
    }

    input:focus {
      border-color: #168cff;
      box-shadow: 0 0 0 3px rgba(22, 140, 255, 0.12);
    }

    .forgot {
      text-align: right;
      margin: -4px 0 20px;
    }

    .forgot a {
      color: #4aa3ff;
      text-decoration: none;
      font-size: 13px;
    }

    .forgot a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      height: 53px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #168cff, #005eea);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(0, 102, 255, 0.25);
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .register {
      text-align: center;
      margin-top: 24px;
      color: #8fa2b8;
      font-size: 14px;
      line-height: 1.6;
    }

    .register a {
      color: #42a5ff;
      text-decoration: none;
      font-weight: 800;
    }

    .register a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #62758b;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding: 25px 14px;
      }

      .brand h1 {
        font-size: 22px;
      }

      .card {
        padding: 26px 19px;
        border-radius: 20px;
      }

      .card h2 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="brand">

    <div class="logo">
      DGM
    </div>

    <h1>
      DHE GENIUS MEDIA
    </h1>

    <p>
      Stay Connected. Stay Genius.
    </p>

  </div>


  <section class="card">

    <h2>
      Welcome back
    </h2>

    <p class="subtitle">
      Login to your DGM customer account.
    </p>


    <div
      id="message"
      class="message"
    ></div>


    <form id="loginForm">

      <div class="field">

        <label for="identifier">
          Phone Number or Email
        </label>

        <input
          type="text"
          id="identifier"
          name="identifier"
          placeholder="0241234567 or you@example.com"
          autocomplete="username"
          required
        >

      </div>


      <div class="field">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

      </div>


      <div class="forgot">

        <a
          href="#"
          onclick="return false;"
        >
          Forgot password?
        </a>

      </div>


      <button
        type="submit"
        id="loginButton"
      >
        Login
      </button>

    </form>


    <div class="register">

      Don't have a DGM account?

      <a href="/register.html">
        Create Account
      </a>

    </div>

  </section>


  <div class="footer">
    © 2026 DHE GENIUS MEDIA • Accra - Spintex
  </div>


  <script>

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type = "error") {

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const identifier =
          document
            .getElementById("identifier")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        if (!identifier || !password) {

          showMessage(
            "Please enter your phone/email and password."
          );

          return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";

        message.className = "message";


        try {

          const response = await fetch(
            "/api/login",
            {
              method: "POST",

              credentials: "include",

              cache: "no-store",

              headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
              },

              body: JSON.stringify({
                identifier: identifier,
                password: password
              })
            }
          );


          const contentType =
            response.headers.get(
              "content-type"
            ) || "";


          let result;


          if (
            contentType.includes(
              "application/json"
            )
          ) {

            result =
              await response.json();

          } else {

            const text =
              await response.text();

            throw new Error(
              text ||
              "The server returned an invalid response."
            );
          }


          if (!response.ok || !result.success) {

            throw new Error(
              result.message ||
              "Login failed. Please check your details."
            );
          }


          showMessage(
            "Login successful. Opening your dashboard...",
            "success"
          );


          loginButton.textContent =
            "Success ✓";


          /*
           * Give the browser a moment to save
           * the session cookie before redirecting.
           */

          setTimeout(
            function() {

              window.location.replace(
                "/dashboard.html"
              );

            },
            500
          );

        } catch (error) {

          console.error(
            "DGM LOGIN ERROR:",
            error
          );


          showMessage(
            error.message ||
            "Unable to login. Please try again."
          );


          loginButton.disabled = false;

          loginButton.textContent =
            "Login";
        }

      }
    );

  </script>

</body>
</html>
