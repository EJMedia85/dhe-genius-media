<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | DHE GENIUS MEDIA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(ellipse at 12% 12%, rgba(37, 211, 102, 0.22), transparent 34%),
        radial-gradient(ellipse at 88% 78%, rgba(18, 140, 126, 0.20), transparent 32%),
        linear-gradient(135deg, #06140f 0%, #07111f 48%, #02060c 100%);
      background-attachment: fixed;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 35px 18px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #25d366, #128c7e);
      box-shadow: 0 12px 35px rgba(37, 211, 102, 0.24);
    }

    .brand h1 {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .brand p {
      margin-top: 7px;
      color: #a9bad0;
      font-size: 14px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 30px 24px;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.035));
      border: 1px solid rgba(255, 255, 255, 0.20);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      -webkit-backdrop-filter: blur(24px) saturate(155%);
      backdrop-filter: blur(24px) saturate(155%);
    }

    .card h2 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a8bf;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .message {
      display: none;
      padding: 12px 14px;
      margin-bottom: 18px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(255, 70, 70, 0.12);
      border: 1px solid rgba(255, 70, 70, 0.3);
      color: #ff9d9d;
    }

    .message.success {
      background: rgba(37, 211, 102, 0.12);
      border: 1px solid rgba(37, 211, 102, 0.3);
      color: #72f0a0;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #dce7f4;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border-radius: 13px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      outline: none;
      background: rgba(3, 12, 19, 0.40);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.16);
      color: #ffffff;
      font-size: 15px;
      transition: 0.2s ease;
    }

    input::placeholder {
      color: #60738a;
    }

    input:focus {
      border-color: rgba(37, 211, 102, 0.85);
      background: rgba(7, 25, 20, 0.58);
      box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.14), 0 0 22px rgba(37, 211, 102, 0.06);
    }

    .forgot {
      text-align: right;
      margin: -4px 0 20px;
    }

    .forgot a {
      color: #25d366;
      text-decoration: none;
      font-size: 13px;
    }

    .forgot a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      height: 53px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(18, 140, 126, 0.25);
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .register {
      text-align: center;
      margin-top: 24px;
      color: #8fa2b8;
      font-size: 14px;
      line-height: 1.6;
    }

    .register a {
      color: #25d366;
      text-decoration: none;
      font-weight: 800;
    }

    .register a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #62758b;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding: 25px 14px;
      }

      .brand h1 {
        font-size: 22px;
      }

      .card {
        padding: 26px 19px;
        border-radius: 20px;
      }

      .card h2 {
        font-size: 24px;
      }
    }

    /* DGM dashboard-aligned responsive login */
    html, body { width:100%; min-height:100%; }
    body {
      min-height:100vh; min-height:100svh; padding:0 !important; margin:0;
      display:flex; align-items:stretch; justify-content:center; overflow-x:hidden;
      color:#eef8f2;
      background:radial-gradient(circle at 85% -5%,rgba(37,211,102,.13),transparent 30%),linear-gradient(180deg,#050b0b,#071010 52%,#050909) !important;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .scene-panel {
      position:relative; isolation:isolate; width:100%; min-height:100vh; min-height:100svh;
      padding:104px 16px 42px; display:flex; align-items:center; justify-content:center;
      overflow:hidden; background:transparent;
    }
    .brand {
      display:flex !important; position:absolute; z-index:3; top:20px; left:20px;
      align-items:center; gap:11px; margin:0; color:#f2fff6;
    }
    .brand .logo {
      width:44px; height:44px; flex:0 0 44px; display:grid; place-items:center;
      border-radius:13px; background:linear-gradient(145deg,#35f47c,#0b9f4a);
      color:#052011; font-size:13px; font-weight:900; box-shadow:0 8px 28px rgba(37,211,102,.22);
    }
    .brand h1 { margin:0; font-size:14px; line-height:1.25; font-weight:900; letter-spacing:-.03em; }
    .brand p { margin:3px 0 0; color:#8ba99b; font-size:10px; }
    .orb { position:absolute; z-index:0; pointer-events:none; border-radius:50%; background:radial-gradient(circle at 35% 28%,rgba(60,255,176,.45),rgba(0,201,130,.15) 48%,rgba(0,133,77,0) 78%); filter:blur(2px); }
    .orb-a { width:180px;height:180px;left:2%;top:12%; }
    .orb-b { width:240px;height:240px;left:12%;bottom:4%; }
    .orb-c { width:220px;height:220px;right:8%;top:18%; }
    .orb-d { width:130px;height:130px;right:4%;bottom:16%; }
    .orb-e { width:150px;height:150px;right:34%;bottom:0; }
    .orb-f { width:170px;height:170px;left:38%;top:3%; }
    .card {
      position:relative; z-index:2; width:100%; max-width:430px; min-width:0; height:auto;
      margin:0 auto; padding:30px 24px 26px; border-radius:22px;
      background:linear-gradient(155deg,rgba(14,31,28,.94),rgba(4,12,12,.90));
      border:1px solid rgba(37,211,102,.19);
      box-shadow:0 22px 60px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter:blur(24px) saturate(145%); -webkit-backdrop-filter:blur(24px) saturate(145%);
    }
    .card h2 { text-align:left; font-size:25px; line-height:1.2; font-weight:850; margin:0 0 8px; letter-spacing:-.04em; }
    .subtitle { display:block; margin:0 0 22px; color:#8ba99b; font-size:12px; line-height:1.5; }
    .message { padding:10px 12px; margin-bottom:12px; font-size:12px; border-radius:10px; }
    .field { margin-bottom:16px; }
    label { display:block; margin-bottom:7px; font-size:12px; font-weight:700; color:#b9d4c6; }
    input { display:block; width:100%; min-width:0; height:46px; padding:0 13px; border-radius:12px; border:1px solid rgba(255,255,255,.10); background:rgba(1,10,9,.4); color:#f2fff6; box-shadow:none; font-size:14px; }
    input::placeholder { color:rgba(255,255,255,.52); }
    input:focus { background:rgba(1,10,9,.65); border-color:rgba(37,211,102,.55); box-shadow:0 0 0 3px rgba(37,211,102,.10); outline:none; }
    .forgot { margin:13px 0 0; text-align:center; }
    .forgot a { font-size:12px; color:#a8e9c0; }
    button { width:100%; min-height:46px; height:auto; margin-top:6px; border-radius:12px; font-size:14px; font-weight:850; box-shadow:0 8px 22px rgba(37,211,102,.15); background:linear-gradient(135deg,#49ef88,#16a879); color:#031008; }
    .register { display:inline; margin:0; font-size:12px; color:#a8bfb4; }
    .register a { font-weight:800; color:#49ef88; }
    .register-wrap { text-align:center; margin-top:18px; line-height:1.6; }
    @media (max-width:480px) {
      .scene-panel { padding:92px 16px 28px; }
      .brand { top:16px; left:16px; gap:9px; }
      .brand .logo { width:40px; height:40px; flex-basis:40px; }
      .brand h1 { font-size:13px; }
      .brand p { font-size:9px; }
      .card { width:100%; max-width:430px; min-width:0; padding:26px 20px 23px; border-radius:19px; }
      .card h2 { font-size:24px; }
    }
    @media (max-height:560px) and (min-width:481px) {
      .scene-panel { padding-top:84px; padding-bottom:24px; align-items:flex-start; }
    }

  </style>
</head>

<body>

  <main class="scene-panel" aria-label="DGM login">
    <span class="orb orb-a"></span><span class="orb orb-b"></span><span class="orb orb-c"></span><span class="orb orb-d"></span><span class="orb orb-e"></span><span class="orb orb-f"></span>

  <div class="brand">

    <div class="logo">
      DGM
    </div>

    <h1>
      DHE GENIUS MEDIA
    </h1>

    <p>
      Stay Connected. Stay Genius.
    </p>

  </div>


  <section class="card">

    <h2>LOGIN</h2>

    <p class="subtitle">Stay Connected. Stay Genius.</p>


    <div
      id="message"
      class="message"
    ></div>


    <form id="loginForm">

      <div class="field">

        <label for="identifier">Email</label>

        <input
          type="text"
          id="identifier"
          name="identifier"
          placeholder=""
          autocomplete="username"
          required
        >

      </div>


      <div class="field">

        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder=""
          autocomplete="current-password"
          required
        >

      </div>


      <button
        type="submit"
        id="loginButton"
      >
        Sign In
      </button>

    </form>

    <div class="register-wrap">
      <div class="forgot" style="display:inline-block;margin:0;">
        <a href="/forgot-password.html">Forgot password?</a>
      </div>
      <div class="register"><a href="/register.html">Sign up</a></div>
    </div>

  </section>


  </main>


  <script>

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type = "error") {

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const identifier =
          document
            .getElementById("identifier")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        if (!identifier || !password) {

          showMessage(
            "Please enter your phone/email and password."
          );

          return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";

        message.className = "message";


        try {

          const response = await fetch(
            "/api/login",
            {
              method: "POST",

              credentials: "include",

              cache: "no-store",

              headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
              },

              body: JSON.stringify({
                identifier: identifier,
                password: password
              })
            }
          );


          const contentType =
            response.headers.get(
              "content-type"
            ) || "";


          let result;


          if (
            contentType.includes(
              "application/json"
            )
          ) {

            result =
              await response.json();

          } else {

            const text =
              await response.text();

            throw new Error(
              text ||
              "The server returned an invalid response."
            );
          }


          if (!response.ok || !result.success) {

            throw new Error(
              result.message ||
              "Login failed. Please check your details."
            );
          }


          showMessage(
            "Login successful. Opening your dashboard...",
            "success"
          );


          loginButton.textContent =
            "Success ✓";


          /*
           * Give the browser a moment to save
           * the session cookie before redirecting.
           */

          setTimeout(
            function() {

              window.location.replace(
                "/dashboard.html"
              );

            },
            500
          );

        } catch (error) {

          console.error(
            "DGM LOGIN ERROR:",
            error
          );


          showMessage(
            error.message ||
            "Unable to login. Please try again."
          );


          loginButton.disabled = false;

          loginButton.textContent =
            "Login";
        }

      }
    );

  </script>

<script src="/pwa.js" defer></script>
<script src="/funnel-analytics.js" defer></script>
</body>
</html>
