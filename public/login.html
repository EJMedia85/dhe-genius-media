<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | DHE GENIUS MEDIA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(ellipse at 12% 12%, rgba(37, 211, 102, 0.22), transparent 34%),
        radial-gradient(ellipse at 88% 78%, rgba(18, 140, 126, 0.20), transparent 32%),
        linear-gradient(135deg, #06140f 0%, #07111f 48%, #02060c 100%);
      background-attachment: fixed;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 35px 18px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #25d366, #128c7e);
      box-shadow: 0 12px 35px rgba(37, 211, 102, 0.24);
    }

    .brand h1 {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .brand p {
      margin-top: 7px;
      color: #a9bad0;
      font-size: 14px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 30px 24px;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.035));
      border: 1px solid rgba(255, 255, 255, 0.20);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      -webkit-backdrop-filter: blur(24px) saturate(155%);
      backdrop-filter: blur(24px) saturate(155%);
    }

    .card h2 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a8bf;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .message {
      display: none;
      padding: 12px 14px;
      margin-bottom: 18px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(255, 70, 70, 0.12);
      border: 1px solid rgba(255, 70, 70, 0.3);
      color: #ff9d9d;
    }

    .message.success {
      background: rgba(37, 211, 102, 0.12);
      border: 1px solid rgba(37, 211, 102, 0.3);
      color: #72f0a0;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #dce7f4;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border-radius: 13px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      outline: none;
      background: rgba(3, 12, 19, 0.40);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.16);
      color: #ffffff;
      font-size: 15px;
      transition: 0.2s ease;
    }

    input::placeholder {
      color: #60738a;
    }

    input:focus {
      border-color: rgba(37, 211, 102, 0.85);
      background: rgba(7, 25, 20, 0.58);
      box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.14), 0 0 22px rgba(37, 211, 102, 0.06);
    }

    .forgot {
      text-align: right;
      margin: -4px 0 20px;
    }

    .forgot a {
      color: #25d366;
      text-decoration: none;
      font-size: 13px;
    }

    .forgot a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      height: 53px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(18, 140, 126, 0.25);
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .register {
      text-align: center;
      margin-top: 24px;
      color: #8fa2b8;
      font-size: 14px;
      line-height: 1.6;
    }

    .register a {
      color: #25d366;
      text-decoration: none;
      font-weight: 800;
    }

    .register a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #62758b;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding: 25px 14px;
      }

      .brand h1 {
        font-size: 22px;
      }

      .card {
        padding: 26px 19px;
        border-radius: 20px;
      }

      .card h2 {
        font-size: 24px;
      }
    }

    /* Reference-matched DGM glass login */
    html, body { width:100%; min-height:100%; background:#000 !important; }
    body { min-height:100vh; padding:0 !important; display:flex; justify-content:center; align-items:center; overflow-x:hidden; background:#000 !important; }
    .brand, .footer { display:none !important; }
    .scene-panel { position:relative; isolation:isolate; width:100%; height:min(70vh, 500px); min-height:440px; display:flex; align-items:center; justify-content:center; overflow:hidden; background:linear-gradient(135deg,#002b1d 0%,#003b28 48%,#00170f 100%); }
    .orb { position:absolute; z-index:-1; border-radius:50%; background:radial-gradient(circle at 35% 28%,#3cffb0 0%,#00c982 38%,#00854d 78%); box-shadow:0 0 22px rgba(0,255,159,.22); }
    .orb-a { width:105px;height:105px;left:7%;top:15%;filter:blur(5px); }
    .orb-b { width:150px;height:150px;left:19%;bottom:23%; }
    .orb-c { width:135px;height:135px;right:24%;top:24%; }
    .orb-d { width:78px;height:78px;right:13%;bottom:32%;filter:blur(5px); }
    .orb-e { width:83px;height:83px;right:34%;bottom:8%; }
    .orb-f { width:100px;height:100px;left:38%;top:10%;filter:blur(5px); }
    .card { position:relative; z-index:2; width:min(36%, 300px); min-width:245px; height:355px; padding:70px 40px 28px; border-radius:15px; background:rgba(0,35,25,.46); border:1px solid rgba(69,255,184,.14); box-shadow:0 0 28px rgba(0,255,160,.08), inset 0 1px 1px rgba(255,255,255,.08); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); }
    .card h2 { text-align:center; font-size:22px; font-weight:500; margin:0 0 6px; letter-spacing:.2px; }
    .subtitle { display:none; }
    .message { padding:7px 8px; margin-bottom:8px; font-size:11px; }
    .field { margin-bottom:12px; }
    label { margin-bottom:4px; font-size:9px; font-weight:400; color:#a4e9d0; }
    input { height:28px; padding:0 9px; border-radius:5px; border:1px solid rgba(66,255,185,.12); background:rgba(20,205,140,.55); box-shadow:none; font-size:11px; }
    input::placeholder { color:rgba(255,255,255,.52); }
    input:focus { background:rgba(25,205,142,.68); border-color:rgba(75,255,190,.65); box-shadow:0 0 0 2px rgba(37,211,102,.12); }
    .forgot { margin:10px 0 0; text-align:center; }
    .forgot a { font-size:9px; color:#d0eee2; }
    button { height:37px; border-radius:24px; font-size:14px; font-weight:500; box-shadow:none; background:linear-gradient(110deg,#20c994,#14a875); }
    .register { display:inline; margin:0 0 0 8px; font-size:9px; color:#c7e8dc; }
    .register a { font-weight:400; }
    .register-wrap { text-align:center; margin-top:8px; }
    @media (max-width:480px) {
      body { padding:0 !important; }
      .scene-panel { height:min(70vh, 500px); min-height:440px; }
      .card { width:min(36%, 300px); min-width:245px; padding:70px 40px 28px; border-radius:15px; }
      .card h2 { font-size:22px; }
    }

  </style>
</head>

<body>

  <main class="scene-panel" aria-label="DGM login">
    <span class="orb orb-a"></span><span class="orb orb-b"></span><span class="orb orb-c"></span><span class="orb orb-d"></span><span class="orb orb-e"></span><span class="orb orb-f"></span>

  <div class="brand">

    <div class="logo">
      DGM
    </div>

    <h1>
      DHE GENIUS MEDIA
    </h1>

    <p>
      Stay Connected. Stay Genius.
    </p>

  </div>


  <section class="card">

    <h2>LOGIN</h2>

    <p class="subtitle">Stay Connected. Stay Genius.</p>


    <div
      id="message"
      class="message"
    ></div>


    <form id="loginForm">

      <div class="field">

        <label for="identifier">Email</label>

        <input
          type="text"
          id="identifier"
          name="identifier"
          placeholder=""
          autocomplete="username"
          required
        >

      </div>


      <div class="field">

        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder=""
          autocomplete="current-password"
          required
        >

      </div>


      <button
        type="submit"
        id="loginButton"
      >
        Sign In
      </button>

    </form>

    <div class="register-wrap">
      <div class="forgot" style="display:inline-block;margin:0;">
        <a href="/forgot-password.html">Forgot password?</a>
      </div>
      <div class="register"><a href="/register.html">Sign up</a></div>
    </div>

  </section>


  </main>


  <script>

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type = "error") {

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const identifier =
          document
            .getElementById("identifier")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        if (!identifier || !password) {

          showMessage(
            "Please enter your phone/email and password."
          );

          return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";

        message.className = "message";


        try {

          const response = await fetch(
            "/api/login",
            {
              method: "POST",

              credentials: "include",

              cache: "no-store",

              headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
              },

              body: JSON.stringify({
                identifier: identifier,
                password: password
              })
            }
          );


          const contentType =
            response.headers.get(
              "content-type"
            ) || "";


          let result;


          if (
            contentType.includes(
              "application/json"
            )
          ) {

            result =
              await response.json();

          } else {

            const text =
              await response.text();

            throw new Error(
              text ||
              "The server returned an invalid response."
            );
          }


          if (!response.ok || !result.success) {

            throw new Error(
              result.message ||
              "Login failed. Please check your details."
            );
          }


          showMessage(
            "Login successful. Opening your dashboard...",
            "success"
          );


          loginButton.textContent =
            "Success ✓";


          /*
           * Give the browser a moment to save
           * the session cookie before redirecting.
           */

          setTimeout(
            function() {

              window.location.replace(
                "/dashboard.html"
              );

            },
            500
          );

        } catch (error) {

          console.error(
            "DGM LOGIN ERROR:",
            error
          );


          showMessage(
            error.message ||
            "Unable to login. Please try again."
          );


          loginButton.disabled = false;

          loginButton.textContent =
            "Login";
        }

      }
    );

  </script>

<script src="/pwa.js" defer></script>

</body>
</html>
