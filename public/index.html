<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Vending Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="bg-indigo-600 text-white font-bold p-2 rounded-lg">⚡</span>
            <h1 class="text-xl font-bold tracking-wide">DataMart / Vending Portal</h1>
        </div>
        <div class="flex items-center space-x-4">
            <span id="username-display" class="text-sm text-gray-300">Loading...</span>
            <button onclick="loadUserData()" class="bg-gray-700 hover:bg-gray-600 text-xs px-3 py-1.5 rounded transition">Refresh</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Left Column: Wallet & Quick Actions -->
        <div class="space-y-6">
            <!-- Wallet Card -->
            <div class="bg-gradient-to-br from-indigo-900 to-gray-800 border border-indigo-700/50 rounded-2xl p-6 shadow-xl">
                <p class="text-sm text-indigo-300 font-medium uppercase tracking-wider">Wallet Balance</p>
                <h2 id="wallet-balance" class="text-4xl font-extrabold mt-2 text-white">$0.00</h2>
                <button onclick="fundWalletPrompt()" class="mt-5 w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl shadow transition">
                    + Fund Wallet
                </button>
            </div>

            <!-- Quick Vending Form -->
            <div class="bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-xl">
                <h3 class="text-lg font-semibold mb-4">Quick Service Purchase</h3>
                <form id="purchase-form" onsubmit="handlePurchase(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Select Service / Product</label>
                        <select id="service-select" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                            <option value="MTN 1GB Data ($2.50)">MTN 1GB Data - $2.50</option>
                            <option value="MTN 5GB Data ($10.00)">MTN 5GB Data - $10.00</option>
                            <option value="AirtelTigo 2GB ($4.00)">AirtelTigo 2GB - $4.00</option>
                            <option value="Airtime Topup ($5.00)">Airtime Topup - $5.00</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Recipient Phone / Account</label>
                        <input type="text" id="recipient" placeholder="e.g., 0541234567" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-xl shadow transition">
                        Buy Now
                    </button>
                </form>
            </div>
        </div>

        <!-- Right Column: Transaction History -->
        <div class="md:col-span-2 bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-xl flex flex-col">
            <h3 class="text-lg font-semibold mb-4">Recent Transactions</h3>
            <div class="overflow-x-auto flex-grow">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400 text-xs uppercase tracking-wider">
                            <th class="py-3 px-4">TXN ID</th>
                            <th class="py-3 px-4">Service</th>
                            <th class="py-3 px-4">Amount</th>
                            <th class="py-3 px-4">Status</th>
                            <th class="py-3 px-4">Date</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-table" class="divide-y divide-gray-700/50 text-sm">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 text-center py-4 text-xs text-gray-500">
        Powered by Node.js & Render. Designed for automated digital vending.
    </footer>

    <!-- JavaScript Logic -->
    <script>
        async function loadUserData() {
            try {
                const response = await fetch('/api/user');
                const data = await response.json();
                
                document.getElementById('username-display').innerText = `${data.username} (${data.email})`;
                document.getElementById('wallet-balance').innerText = `$${data.walletBalance.toFixed(2)}`;
                
                const tableBody = document.getElementById('transactions-table');
                tableBody.innerHTML = '';
                
                data.transactions.forEach(tx => {
                    tableBody.innerHTML += `
                        <tr class="hover:bg-gray-750 transition">
                            <td class="py-3 px-4 font-mono text-indigo-400">${tx.id}</td>
                            <td class="py-3 px-4">${tx.service}</td>
                            <td class="py-3 px-4 font-semibold">$${tx.amount.toFixed(2)}</td>
                            <td class="py-3 px-4"><span class="bg-emerald-900/60 text-emerald-400 px-2 py-0.5 rounded-full text-xs font-medium">${tx.status}</span></td>
                            <td class="py-3 px-4 text-gray-400 text-xs">${tx.date}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Failed to load user data', err);
            }
        }

        async function handlePurchase(event) {
            event.preventDefault();
            const serviceSelect = document.getElementById('service-select').value;
            
            // Extract price from string (e.g. "MTN 1GB Data ($2.50)" -> 2.50)
            let amount = 2.50;
            if (serviceSelect.includes('5GB')) amount = 10.00;
            if (serviceSelect.includes('AirtelTigo')) amount = 4.00;
            if (serviceSelect.includes('Airtime')) amount = 5.00;

            const response = await fetch('/api/purchase', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ service: serviceSelect, amount })
            });

            const result = await response.json();
            if (result.success) {
                alert(result.message);
                loadUserData();
            } else {
                alert(result.message);
            }
        }

        async function fundWalletPrompt() {
            const amtStr = prompt("Enter amount to fund wallet ($):", "50");
            if (!amtStr) return;
            const amount = parseFloat(amtStr);

            const response = await fetch('/api/fund-wallet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount })
            });

            const result = await response.json();
            if (result.success) {
                alert(result.message);
                loadUserData();
            } else {
                alert(result.message);
            }
        }

        // Load data on page open
        loadUserData();
    </script>
</body>
</html>
