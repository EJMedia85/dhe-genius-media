<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#07131f"
  >

  <title>Dashboard | DHE GENIUS MEDIA</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #07131f;
      --card: #0d2030;
      --card2: #10283b;
      --text: #ffffff;
      --muted: #8da5b8;
      --blue: #008cff;
      --blue2: #00c6ff;
      --green: #20d889;
      --red: #ff6262;
      --yellow: #ffc45e;
      --border: rgba(255,255,255,0.08);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #06121e 0%,
          #081725 100%
        );

      color: var(--text);

      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       MOBILE HEADER
    ========================= */

    .mobile-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      padding: 16px 18px;

      background:
        rgba(7,19,31,0.96);

      border-bottom:
        1px solid var(--border);

      position: sticky;

      top: 0;

      z-index: 100;

      backdrop-filter: blur(15px);
    }

    .brand {
      display: flex;

      align-items: center;

      gap: 10px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      border-radius: 13px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #00c6ff,
          #0072ff
        );

      color: white;

      font-size: 13px;

      font-weight: 900;

      box-shadow:
        0 8px 22px
        rgba(0,114,255,0.25);
    }

    .brand-name {
      font-size: 14px;

      font-weight: 900;

      letter-spacing: 0.1px;
    }

    .brand-tagline {
      font-size: 9px;

      color: var(--muted);

      margin-top: 2px;
    }

    .menu-btn {
      width: 42px;
      height: 42px;

      border:
        1px solid var(--border);

      background:
        var(--card);

      color: white;

      border-radius: 12px;

      font-size: 20px;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .menu-btn:active {
      transform: scale(0.95);
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      position: fixed;

      top: 0;
      left: -290px;

      width: 280px;

      height: 100vh;

      background:
        #091a29;

      border-right:
        1px solid var(--border);

      z-index: 200;

      padding: 22px;

      transition:
        left 0.25s ease;

      overflow-y: auto;

      box-shadow:
        15px 0 40px
        rgba(0,0,0,0.18);
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 30px;
    }

    .close-btn {
      background: none;

      border: none;

      color: white;

      font-size: 28px;

      line-height: 1;
    }

    .nav-title {
      color: #617b8e;

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: 1px;

      margin:
        20px 0 9px;
    }

    .nav-item {
      width: 100%;

      border: none;

      background: transparent;

      color: #c9d9e4;

      padding: 13px 12px;

      text-align: left;

      border-radius: 12px;

      margin-bottom: 4px;

      display: flex;

      align-items: center;

      gap: 12px;

      font-size: 14px;

      transition:
        background 0.2s,
        color 0.2s,
        transform 0.15s;
    }

    .nav-item:hover {
      background:
        var(--card);

      color: white;
    }

    .nav-item:active {
      transform: scale(0.98);
    }

    .logout {
      color: #ff7777;
    }

    .overlay {
      display: none;

      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,0.65);

      z-index: 150;

      backdrop-filter: blur(2px);
    }

    .overlay.show {
      display: block;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      width: 100%;

      max-width: 1200px;

      margin: auto;

      padding:
        20px 16px 100px;
    }

    .welcome {
      margin:
        8px 0 20px;
    }

    .welcome small {
      color: var(--muted);

      font-size: 13px;
    }

    .welcome h1 {
      font-size: 25px;

      margin-top: 4px;

      word-break: break-word;
    }

    /* =========================
       BALANCE
    ========================= */

    .balance-card {
      padding: 22px;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          #087fe8,
          #004fba
        );

      box-shadow:
        0 18px 40px
        rgba(0,100,220,0.22);

      position: relative;

      overflow: hidden;

      margin-bottom: 20px;
    }

    .balance-card::after {
      content: "";

      position: absolute;

      width: 160px;
      height: 160px;

      border-radius: 50%;

      border:
        30px solid
        rgba(255,255,255,0.06);

      right: -55px;
      top: -55px;

      pointer-events: none;
    }

    .balance-label {
      font-size: 12px;

      opacity: 0.8;
    }

    .balance {
      font-size: 34px;

      font-weight: 900;

      margin:
        8px 0 18px;
    }

    .balance-actions {
      display: flex;

      gap: 10px;

      position: relative;

      z-index: 2;
    }

    .balance-btn {
      border: none;

      background:
        rgba(255,255,255,0.15);

      color: white;

      padding: 10px 15px;

      border-radius: 10px;

      font-size: 12px;

      font-weight: 700;

      transition:
        background 0.2s,
        transform 0.15s;
    }

    .balance-btn:hover {
      background:
        rgba(255,255,255,0.22);
    }

    .balance-btn:active {
      transform: scale(0.96);
    }

    /* =========================
       SECTION
    ========================= */

    .section-title {
      font-size: 17px;

      margin:
        24px 0 12px;
    }

    /* =========================
       QUICK ACTIONS
    ========================= */

    .quick-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;
    }

    .quick-card {
      border:
        1px solid var(--border);

      background:
        var(--card);

      border-radius: 17px;

      padding: 17px;

      color: white;

      text-align: left;

      min-height: 105px;

      transition:
        transform 0.2s,
        background 0.2s,
        border 0.2s;
    }

    .quick-card:hover {
      background:
        var(--card2);

      border-color:
        rgba(0,140,255,0.25);
    }

    .quick-card:active {
      transform: scale(0.97);
    }

    .quick-icon {
      width: 40px;
      height: 40px;

      border-radius: 12px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        rgba(0,140,255,0.12);

      font-size: 20px;

      margin-bottom: 10px;
    }

    .quick-card strong {
      display: block;

      font-size: 14px;
    }

    .quick-card span {
      display: block;

      color: var(--muted);

      font-size: 11px;

      margin-top: 4px;
    }

    /* =========================
       SERVICE STATUS
    ========================= */

    .status-card {
      background:
        var(--card);

      border:
        1px solid var(--border);

      border-radius: 18px;

      padding: 17px;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }

    .status-left {
      display: flex;

      align-items: center;

      gap: 12px;
    }

    .status-dot {
      width: 11px;
      height: 11px;

      flex-shrink: 0;

      border-radius: 50%;

      background:
        var(--green);

      box-shadow:
        0 0 12px
        rgba(32,216,137,0.7);
    }

    .status-left strong {
      font-size: 14px;
    }

    .status-left small {
      display: block;

      color: var(--muted);

      margin-top: 3px;

      font-size: 11px;
    }

    .online {
      color: var(--green);

      font-size: 11px;

      font-weight: 800;
    }

    /* =========================
       ORDERS
    ========================= */

    .orders-card {
      background:
        var(--card);

      border:
        1px solid var(--border);

      border-radius: 18px;

      overflow: hidden;
    }

    .empty-orders {
      text-align: center;

      padding: 30px 20px;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.6;
    }

    .empty-orders div {
      font-size: 30px;

      margin-bottom: 10px;
    }

    .order {
      padding: 15px;

      border-bottom:
        1px solid var(--border);

      display: flex;

      justify-content: space-between;

      gap: 10px;
    }

    .order:last-child {
      border-bottom: none;
    }

    .order strong {
      font-size: 13px;
    }

    .order small {
      display: block;

      color: var(--muted);

      font-size: 10px;

      margin-top: 5px;
    }

    .order-right {
      text-align: right;

      flex-shrink: 0;
    }

    .order-amount {
      font-size: 13px;

      font-weight: 800;
    }

    .order-status {
      display: inline-block;

      margin-top: 5px;

      padding: 4px 8px;

      border-radius: 20px;

      background:
        rgba(255,190,70,0.10);

      color:
        var(--yellow);

      font-size: 9px;

      font-weight: 800;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;

      bottom: 0;
      left: 0;
      right: 0;

      height: 68px;

      background:
        rgba(6,18,30,0.97);

      border-top:
        1px solid var(--border);

      display: flex;

      align-items: center;

      justify-content: space-around;

      z-index: 100;

      backdrop-filter: blur(15px);
    }

    .bottom-nav button {
      background: none;

      border: none;

      color: #70899c;

      font-size: 10px;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 5px;

      min-width: 55px;
    }

    .bottom-nav button:first-child {
      color: #00aaff;
    }

    .bottom-nav button:active {
      transform: scale(0.94);
    }

    .bottom-icon {
      font-size: 20px;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      opacity: 0.6;

      pointer-events: none;
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 800px) {

      .mobile-header {
        display: none;
      }

      .sidebar {
        left: 0;
      }

      .close-btn {
        display: none;
      }

      .main {
        margin-left: 280px;

        max-width:
          calc(1200px - 280px);

        padding:
          40px 35px 60px;
      }

      .overlay {
        display: none !important;
      }

      .quick-grid {
        grid-template-columns:
          repeat(4, 1fr);
      }

      .balance-card {
        max-width: 600px;
      }

      .bottom-nav {
        display: none;
      }

    }

  </style>
</head>

  <script>

    // =================================================
    // NAVIGATION
    // =================================================

    function goTo(page) {

      if (!page) {
        return;
      }

      closeMenu();

      window.location.assign(page);

    }


    // =================================================
    // MOBILE MENU
    // =================================================

    function openMenu() {

      const sidebar =
        document.getElementById("sidebar");

      const overlay =
        document.getElementById("overlay");

      sidebar.classList.add("open");

      overlay.classList.add("show");

      document.body.style.overflow = "hidden";

    }


    function closeMenu() {

      const sidebar =
        document.getElementById("sidebar");

      const overlay =
        document.getElementById("overlay");

      sidebar.classList.remove("open");

      overlay.classList.remove("show");

      document.body.style.overflow = "";

    }


    // =================================================
    // ESC KEY CLOSES MENU
    // =================================================

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {
          closeMenu();
        }

      }
    );


    // =================================================
    // WHATSAPP
    // =================================================

    function openWhatsApp() {

      window.open(
        "https://wa.me/233241518385",
        "_blank",
        "noopener,noreferrer"
      );

    }


    // =================================================
    // WALLET MESSAGE
    // =================================================

    function showWalletMessage() {

      alert(
        "Wallet funding will be connected to the payment system."
      );

    }


    // =================================================
    // LOGOUT
    // =================================================

    async function logout() {

      const button =
        document.querySelector(".logout");

      if (button) {
        button.disabled = true;
        button.classList.add("loading");
      }

      try {

        await fetch(
          "/api/logout",
          {
            method: "POST",

            credentials: "include",

            cache: "no-store"
          }
        );

      } catch (error) {

        console.error(
          "Logout error:",
          error
        );

      } finally {

        window.location.replace(
          "/login.html"
        );

      }

    }


    // =================================================
    // LOAD CUSTOMER
    // =================================================

    async function loadCustomer() {

      try {

        const response =
          await fetch(
            "/api/me",
            {
              method: "GET",

              credentials: "include",

              cache: "no-store",

              headers: {
                "Accept":
                  "application/json"
              }
            }
          );


        /*
         * If the session is gone,
         * send the customer back to login.
         */

        if (response.status === 401) {

          window.location.replace(
            "/login.html"
          );

          return;

        }


        if (!response.ok) {

          throw new Error(
            "Could not load account."
          );

        }


        const result =
          await response.json();


        if (
          !result ||
          !result.success ||
          !result.customer
        ) {

          window.location.replace(
            "/login.html"
          );

          return;

        }


        const customer =
          result.customer;


        // CUSTOMER NAME

        document
          .getElementById("customerName")
          .textContent =
          customer.name ||
          "DGM Customer";


        // BALANCE

        const balance =
          Number(
            customer.balance || 0
          );


        document
          .getElementById("balance")
          .textContent =
          "GH₵" +
          balance.toFixed(2);


      } catch (error) {

        console.error(
          "Customer loading error:",
          error
        );

        /*
         * Only redirect when the request
         * actually fails. This prevents
         * unnecessary redirects from
         * normal page behavior.
         */

        window.location.replace(
          "/login.html"
        );

      }

    }


    // =================================================
    // LOAD ORDERS
    // =================================================

    async function loadOrders() {

      const container =
        document.getElementById(
          "orders"
        );


      try {

        const response =
          await fetch(
            "/api/orders",
            {
              method: "GET",

              credentials: "include",

              cache: "no-store",

              headers: {
                "Accept":
                  "application/json"
              }
            }
          );


        if (
          response.status === 401
        ) {

          window.location.replace(
            "/login.html"
          );

          return;

        }


        if (!response.ok) {

          throw new Error(
            "Could not load orders."
          );

        }


        const result =
          await response.json();


        if (
          !result ||
          !result.success ||
          !Array.isArray(result.orders) ||
          result.orders.length === 0
        ) {

          container.innerHTML = `

            <div class="empty-orders">

              <div>
                📦
              </div>

              No orders yet.

              <br>

              Your recent transactions
              will appear here.

            </div>

          `;

          return;

        }


        container.innerHTML = "";


        result.orders
          .slice(0, 5)
          .forEach(
            function(order) {

              const item =
                document.createElement(
                  "div"
                );


              item.className =
                "order";


              const service =
                escapeHTML(
                  order.service ||
                  "Service"
                );


              const reference =
                escapeHTML(
                  order.order_ref ||
                  "N/A"
                );


              const status =
                escapeHTML(
                  order.status ||
                  "Processing"
                );


              const amount =
                Number(
                  order.amount || 0
                );


              item.innerHTML = `

                <div>

                  <strong>
                    ${service}
                  </strong>

                  <small>
                    ${reference}
                  </small>

                </div>

                <div class="order-right">

                  <div class="order-amount">
                    GH₵${amount.toFixed(2)}
                  </div>

                  <span class="order-status">
                    ${status}
                  </span>

                </div>

              `;


              container.appendChild(
                item
              );

            }
          );


      } catch (error) {

        console.error(
          "Orders loading error:",
          error
        );


        container.innerHTML = `

          <div class="empty-orders">

            <div>
              📦
            </div>

            Unable to load orders.

            <br>

            Please refresh and try again.

          </div>

        `;

      }

    }


    // =================================================
    // BASIC HTML ESCAPE
    // =================================================

    function escapeHTML(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // =================================================
    // START DASHBOARD
    // =================================================

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        loadCustomer();

        loadOrders();

      }
    );

  </script>

</body>
