<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07131f">
<title>Live Scores • DHE GENIUS MEDIA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07131f;color:#fff;font-family:Arial,sans-serif;min-height:100vh;padding-bottom:35px}
header{padding:15px 16px;background:rgba(7,19,31,.96);border-bottom:1px solid #ffffff12;position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}
header a{color:#fff;text-decoration:none;font-weight:700}
.wrap{max-width:900px;margin:auto;padding:20px 15px}
.hero{background:linear-gradient(135deg,#087fe8,#0b465f);border-radius:22px;padding:22px;margin-bottom:15px;box-shadow:0 18px 40px #0003}
.hero h1{margin:0 0 7px;font-size:28px}
.hero p{margin:0;color:#d9edf7;font-size:13px;line-height:1.55}
.controls{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.tab{border:1px solid #ffffff15;background:#0d2030;color:#aebdca;padding:10px 14px;border-radius:11px;font-weight:800;white-space:nowrap}
.tab.active{background:#25d366;color:#07131f;border-color:#25d366}
.bar{display:flex;gap:9px;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap}
.live{font-size:12px;color:#25d366;font-weight:800}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#25d366;margin-right:6px;box-shadow:0 0 10px #25d366}
.refresh{border:1px solid #ffffff15;background:#0d2030;color:#fff;padding:10px 13px;border-radius:10px;font-weight:800}
.refresh:disabled{opacity:.5}
.info{color:#91a7b8;font-size:11px}
.section-title{font-size:17px;font-weight:900;margin:20px 0 10px}
.error,.empty{background:#0d2030;border:1px solid #ffffff12;border-radius:18px;padding:22px;color:#91a7b8;text-align:center;line-height:1.5}
.match{background:#0d2030;border:1px solid #ffffff12;border-radius:18px;padding:15px;margin-bottom:10px}
.match.live-match{border-color:#25d36655}
.league{display:flex;align-items:center;gap:8px;color:#91a7b8;font-size:11px;margin-bottom:13px}
.league img{width:20px;height:20px;object-fit:contain;border-radius:50%}
.matchtop{display:flex;justify-content:space-between;gap:10px;align-items:center}
.team{width:38%;font-weight:800;font-size:13px}
.team.right{text-align:right}
.team img{width:28px;height:28px;display:block;margin-bottom:7px;object-fit:contain}
.right img{margin-left:auto}
.score{font-size:24px;font-weight:900;text-align:center;min-width:75px}
.status{display:block;color:#25d366;font-size:10px;margin-top:4px}
.scheduled{color:#8ec9ff}
.finished{color:#91a7b8}
.updated{text-align:center;color:#70899c;font-size:10px;margin-top:14px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;padding:15px;overflow:auto}.modal.show{display:flex;align-items:center;justify-content:center}.modalbox{position:relative;width:100%;max-width:700px;max-height:90vh;overflow:auto;background:#091a28;border:1px solid #ffffff18;border-radius:20px;padding:20px}.detail-refresh{position:absolute;right:52px;top:10px;border:0;background:#25d366;color:#07131f;border-radius:9px;padding:8px 10px;font-weight:800}.close{position:absolute;right:12px;top:10px;border:0;background:#ffffff12;color:#fff;border-radius:50%;width:34px;height:34px;font-size:25px}.detailhead{text-align:center;padding:10px 35px 20px}.detailteams{display:flex;justify-content:space-between;align-items:center;gap:10px}.detailteam{width:36%;font-weight:900;font-size:13px}.detailteam img{width:45px;height:45px;display:block;object-fit:contain;margin:0 auto 8px}.detailscore{font-size:30px;font-weight:900}.detailstatus{font-size:11px;color:#25d366;margin-top:5px}.detailsection{margin-top:15px;background:#0d2030;border-radius:14px;padding:14px}.detailsection h3{margin:0 0 10px;font-size:14px}.event{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff0c;font-size:12px}.eventtime{width:42px;color:#25d366;font-weight:900}.eventbody{flex:1;color:#d9e5ec}.statrow{display:grid;grid-template-columns:1fr 55px 55px 1fr;gap:6px;padding:7px 0;border-bottom:1px solid #ffffff0c;font-size:11px}.lineup{font-size:11px;color:#aebdca;padding:5px 0}.badge{display:inline-block;margin-left:7px;padding:3px 6px;border-radius:6px;background:#25d3661a;color:#25d366;font-size:9px}
@media(max-width:480px){
 .hero h1{font-size:24px}
 .team{font-size:12px}
 .score{font-size:21px;min-width:62px}
}
</style>
</head>
<body>
<header><a href="/entertainment.html">‹ Entertainment</a></header>

<main class="wrap">
<section class="hero">
<h1>⚽ Football Scores</h1>
<p>Live scores, today's matches and upcoming fixtures delivered directly inside DHE GENIUS MEDIA.</p>
</section>

<div class="controls">
<button class="tab active" data-view="live">🔴 Live Now</button>
<button class="tab" data-view="today">📅 Today's Matches</button>
<button class="tab" data-view="upcoming">⏭️ Upcoming</button>
</div>

<div class="bar">
<div class="live"><span class="dot"></span><span id="summary">Checking scores...</span></div>
<button class="refresh" id="refreshBtn">↻ Refresh</button>
</div>

<div id="updated" class="info">Connecting to API-Football...</div>
<section id="matches" style="margin-top:12px"><div class="empty">Loading scores...</div></section>

<div id="detailModal" class="modal" onclick="if(event.target===this)closeMatch()"><div class="modalbox"><button class="close" onclick="closeMatch()">×</button><button class="refresh detail-refresh" id="detailRefresh" onclick="refreshMatch()">↻ Refresh</button><div id="detailContent"><div class="empty">Loading match details...</div></div></div></div><div class="updated">Powered by API-Football • Live refresh every 15 seconds</div>
</main>

<script>
const matchesEl=document.getElementById("matches");
const summaryEl=document.getElementById("summary");
const updatedEl=document.getElementById("updated");
const refreshBtn=document.getElementById("refreshBtn");
const tabs=[...document.querySelectorAll(".tab")];

let loading=false;
let currentView="live";
let activeMatchId=null;
let detailTimer=null;
let liveMatches=[];
let todayMatches=[];

function esc(v){
 return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function localDate(){
 const d=new Date();
 const y=d.getFullYear();
 const m=String(d.getMonth()+1).padStart(2,"0");
 const day=String(d.getDate()).padStart(2,"0");
 return y+"-"+m+"-"+day;
}

function isLive(m){
 const s=m?.status?.short||"";
 return ["1H","HT","2H","ET","BT","P","LIVE"].includes(s);
}

function isFinished(m){
 const s=m?.status?.short||"";
 return ["FT","AET","PEN","CANC","ABD","AWD","WO"].includes(s);
}

function statusText(m){
 const s=m?.status||{};
 if(s.short==="HT") return "HALF TIME";
 if(s.elapsed!=null && ["1H","2H","ET","P","BT"].includes(s.short)) return s.elapsed+"′";
 if(isFinished(m)) return s.long||s.short||"FINISHED";
 return s.long||s.short||"SCHEDULED";
}

function kickoffText(m){
 if(!m?.date) return "Scheduled";
 try{
   return new Date(m.date).toLocaleTimeString([],{
     hour:"2-digit",
     minute:"2-digit"
   });
 }catch{
   return "Scheduled";
 }
}

function matchCard(m){
 const home=m.teams?.home||{};
 const away=m.teams?.away||{};
 const score=m.score||{};
 const live=isLive(m);
 const finished=isFinished(m);
 const homeScore=score.home==null?"-":score.home;
 const awayScore=score.away==null?"-":score.away;

 return '<article class="match '+(live?"live-match":"")+'">'+
   '<div class="league">'+
   (m.league?.logo?'<img src="'+esc(m.league.logo)+'" alt="">':"")+
   esc(m.league?.name||"Football")+
   (m.league?.country?" • "+esc(m.league.country):"")+
   (live?'<span class="badge">LIVE</span>':"")+
   '</div>'+
   '<div class="matchtop">'+
   '<div class="team"><img src="'+esc(home.logo||"")+'" alt="">'+esc(home.name||"Home")+'</div>'+
   '<div class="score">'+
   (live||finished
     ? esc(homeScore)+" - "+esc(awayScore)
     : '<span style="font-size:14px">'+esc(kickoffText(m))+'</span>')+
   '<span class="status '+(finished?"finished":(live?"":"scheduled"))+'">'+
   esc(live||finished?statusText(m):"UPCOMING")+
   '</span></div>'+
   '<div class="team right"><img src="'+esc(away.logo||"")+'" alt="">'+esc(away.name||"Away")+'</div>'+
   '</div></article>';
}

function render(){
 let list=[];
 let title="";

 if(currentView==="live"){
   list=liveMatches;
   title=list.length?"Live matches":"No matches live right now";
   summaryEl.textContent=list.length
     ? list.length+" live match"+(list.length===1?"":"es")
     : "No matches live right now";
 }else if(currentView==="today"){
   list=todayMatches;
   title="Today's matches";
   summaryEl.textContent=list.length
     ? list.length+" match"+(list.length===1?"":"es")+" today"
     : "No matches found today";
 }else{
   list=todayMatches.filter(m=>!isLive(m)&&!isFinished(m));
   title="Upcoming today";
   summaryEl.textContent=list.length
     ? list.length+" upcoming match"+(list.length===1?"":"es")
     : "No upcoming matches found today";
 }

 if(!list.length){
   matchesEl.innerHTML='<div class="empty">'+esc(title)+
     '<br><br>'+(
       currentView==="live"
       ?"There are currently no football matches being returned as live by the provider."
       :currentView==="today"
       ?"API-Football returned no fixtures for today."
       :"There are no remaining scheduled matches today."
     )+'</div>';
   return;
 }

 matchesEl.innerHTML=list.map(matchCard).join("");
}

async function loadData(){
 if(loading)return;
 loading=true;
 refreshBtn.disabled=true;

 try{
   const date=localDate();

   const [liveResponse,todayResponse]=await Promise.all([
     fetch("/api/sports/live",{cache:"no-store",headers:{"Accept":"application/json"}}),
     fetch("/api/sports/fixtures?date="+encodeURIComponent(date),{cache:"no-store",headers:{"Accept":"application/json"}})
   ]);

   const liveData=await liveResponse.json();
   const todayData=await todayResponse.json();

   if(!liveResponse.ok||!liveData.success){
     throw new Error(liveData.message||"Live scores unavailable.");
   }

   if(!todayResponse.ok||!todayData.success){
     throw new Error(todayData.message||"Today's fixtures unavailable.");
   }

   liveMatches=Array.isArray(liveData.matches)?liveData.matches:[];
   todayMatches=Array.isArray(todayData.matches)?todayData.matches:[];

   render();

   const liveText=liveMatches.length
     ? liveMatches.length+" live"
     : "No live matches";
   updatedEl.textContent=
     "Today: "+date+" • "+liveText+
     " • Updated "+new Date().toLocaleTimeString([],{
       hour:"2-digit",minute:"2-digit",second:"2-digit"
     });

 }catch(error){
   summaryEl.textContent="Scores unavailable";
   matchesEl.innerHTML='<div class="error">'+
     esc(error.message||"Could not load football scores.")+
     '<br><br>Try again in a few seconds.</div>';
   updatedEl.textContent="Unable to reach the sports data service.";
 }finally{
   loading=false;
   refreshBtn.disabled=false;
 }
}

tabs.forEach(tab=>{
 tab.addEventListener("click",()=>{
   tabs.forEach(t=>t.classList.remove("active"));
   tab.classList.add("active");
   currentView=tab.dataset.view;
   render();
 });
});

async function openMatch(id){
activeMatchId=id;
if(detailTimer)clearInterval(detailTimer);
await loadMatchDetails(id);
detailTimer=setInterval(()=>{if(activeMatchId)loadMatchDetails(activeMatchId);},15000);
}
async function loadMatchDetails(id){
const modal=document.getElementById("detailModal"),content=document.getElementById("detailContent");
modal.classList.add("show");content.innerHTML='<div class="empty">Loading match details...</div>';
try{
const r=await fetch("/api/sports/match/"+encodeURIComponent(id),{cache:"no-store"}),d=await r.json();
if(!r.ok||!d.success)throw new Error(d.message||"Could not load match details.");
const m=d.match||{},h=m.teams?.home||{},a=m.teams?.away||{},s=m.score||{},events=d.events||[],stats=d.statistics||[],lineups=d.lineups||[];
const ev=events.length?events.map(e=>'<div class="event"><div class="eventtime">'+esc(e.time?.elapsed!=null?e.time.elapsed+"′":"")+'</div><div class="eventbody"><b>'+esc(e.player?.name||e.type||"Event")+'</b> • '+esc(e.detail||"")+'</div></div>').join(""):'<div class="info">No match events are currently available.</div>';
const st=stats.length?stats.map(x=>'<h4>'+esc(x.team?.name||"Team")+'</h4>'+((x.statistics||[]).map(y=>'<div class="statrow"><div>'+esc(y.type||"")+'</div><div>'+esc(String(y.value??"-"))+'</div><div></div><div></div></div>').join(""))).join(""):'<div class="info">Statistics are not available yet.</div>';
const lu=lineups.length?lineups.map(x=>'<div class="lineup"><b>'+esc(x.team?.name||"Team")+'</b>: '+esc((x.startXI||[]).slice(0,11).map(y=>y.player?.name||"").filter(Boolean).join(", ")||"Lineup unavailable")+'</div>').join(""):'<div class="info">Starting lineups are not available yet.</div>';
content.innerHTML='<div class="detailhead"><div class="league">'+esc(m.league?.name||"Football")+" • "+esc(m.league?.country||"")+'</div><div class="detailteams"><div class="detailteam"><img src="'+esc(h.logo||"")+'">'+esc(h.name||"Home")+'</div><div><div class="detailscore">'+esc(String(s.home??"-"))+" - "+esc(String(s.away??"-"))+'</div><div class="detailstatus">'+esc(statusText(m))+'</div></div><div class="detailteam"><img src="'+esc(a.logo||"")+'">'+esc(a.name||"Away")+'</div></div></div><div class="detailsection"><h3>⚡ Match Events</h3>'+ev+'</div><div class="detailsection"><h3>📊 Statistics</h3>'+st+'</div><div class="detailsection"><h3>👥 Lineups</h3>'+lu+'</div>'+(d.venue?.name?'<div class="detailsection"><h3>🏟 Venue</h3><div class="info">'+esc(d.venue.name)+(d.venue.city?" • "+esc(d.venue.city):"")+'</div></div>':"");
}catch(e){content.innerHTML='<div class="error">'+esc(e.message||"Could not load match details.")+'</div>';}
}
async function refreshMatch(){if(activeMatchId)await loadMatchDetails(activeMatchId);}
function closeMatch(){if(detailTimer)clearInterval(detailTimer);detailTimer=null;activeMatchId=null;document.getElementById("detailModal").classList.remove("show");}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMatch();});
refreshBtn.addEventListener("click",loadData);
loadData();
setInterval(loadData,15000);
</script>
</body>
</html>
