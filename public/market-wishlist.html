<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b0b"><title>Wishlist | DGM Market</title><style>body{margin:0;background:#050b0b;color:#f7fffb;font-family:Inter,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:40px;height:40px;border-radius:12px;background:#25d366;color:#04120a;display:grid;place-items:center;font-weight:900}.back{margin-left:auto;color:#25d366;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#0b1515;border:1px solid #ffffff12;border-radius:16px;overflow:hidden}.pic{aspect-ratio:1;background:#102020}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:13px}.muted{color:#829b93;font-size:12px}.price{font-size:18px;font-weight:900;margin:8px 0}.btn{width:100%;padding:10px;border:0;border-radius:10px;background:#25d366;font-weight:900}.empty{text-align:center;color:#829b93;padding:50px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><main class="wrap"><div class="top"><div class="logo">DGM</div><div><b>DGM Market</b><div class="muted">My Wishlist</div></div><a class="back" href="/market.html">← Shop</a></div><h1>♡ Saved Products</h1><div id="grid" class="grid"><div class="empty">Loading…</div></div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=v=>'GH₵'+Number(v||0).toFixed(2);async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',...o}),d=await r.json().catch(()=>({success:false,message:'Request failed'}));if(!r.ok||d.success===false)throw Error(d.message||'Request failed');return d}async function load(){try{const d=await api('/api/market/wishlist');const g=document.getElementById('grid');g.innerHTML=d.products.length?d.products.map(p=>'<article class="card"><a href="/market-product.html?id='+p.id+'"><div class="pic">'+(p.image_url?'<img src="'+esc(p.image_url)+'">':'<div class="empty">🛍️</div>')+'</div></a><div class="info"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.brand||p.category||'DGM Market')+'</div><div class="price">'+money(p.sale_price??p.price)+'</div><button class="btn" onclick="removeWish('+p.id+')">Remove from Wishlist</button></div></article>').join(''):'<div class="empty">Your wishlist is empty.</div>'}catch(e){if(/login|session/i.test(e.message))location.href='/login.html';else document.getElementById('grid').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}async function removeWish(id){try{await api('/api/market/wishlist/'+id,{method:'POST'});load()}catch(e){alert(e.message)}}load();</script></body></html>
