<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTN MashUp | DHE GENIUS MEDIA</title><style>body{margin:0;background:#06131f;color:#fff;font-family:Inter,Arial,sans-serif;padding-bottom:90px}.wrap{max-width:760px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;margin-bottom:24px}.back{border:1px solid #ffffff18;background:#10283b;color:#fff;border-radius:12px;padding:11px 14px}.muted{color:#8ea7b9;font-size:12px}.title{font-size:27px;font-weight:900;margin:6px 0}.wallet{padding:15px;border:1px solid #25d36640;border-radius:18px;background:#0d2030;margin-bottom:18px}.wallet b{font-size:22px}.phone,.pack,.summary{background:#0d2030;border:1px solid #ffffff12;border-radius:18px;padding:16px;margin-bottom:16px}label{display:block;font-size:12px;font-weight:800;margin-bottom:8px}input{width:100%;box-sizing:border-box;background:#071a29;border:1px solid #ffffff16;color:#fff;border-radius:12px;padding:14px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{border:1px solid #ffffff12;background:#10283b;color:#fff;border-radius:16px;padding:15px;text-align:left}.item.sel{border-color:#25d366;background:#12352d}.price{color:#25d366;font-weight:900;font-size:18px}.stats{color:#8ea7b9;font-size:11px;line-height:1.7;margin-top:8px}.buy{width:100%;border:0;border-radius:13px;padding:15px;background:#25d366;color:#04120b;font-weight:900;font-size:14px}.msg{margin:12px 0;padding:12px;border-radius:12px;background:#10283b;font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:#081a28;border-top:1px solid #ffffff12;padding:12px;text-align:center}.nav a{color:#fff;text-decoration:none;margin:0 12px;font-size:12px}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="location.href='/data.html'">←</button><div><b>DHE GENIUS MEDIA</b><div class="muted">Stay Connected. Stay Genius.</div></div></div><div class="title">MTN MashUp</div><p class="muted">30-day MTN packages combining data, MTN minutes, other-network minutes and SMS.</p><div class="wallet">Available DGM Wallet<br><b id="balance">GH₵0.00</b></div><div class="phone"><label>MTN recipient number</label><input id="phone" inputmode="numeric" maxlength="10" placeholder="024XXXXXXX"></div><div class="pack"><h3>Choose a package</h3><div id="grid" class="grid">Loading current packages…</div></div><div id="summary" class="summary" style="display:none"><div id="details"></div><button class="buy" onclick="buy()">Buy from DGM Wallet</button></div><div id="msg"></div></main><nav class="nav"><a href="/dashboard.html">Home</a><a href="/data.html">Data</a><a href="/orders.html">Orders</a><a href="/account.html">Account</a></nav><script>
let selected=null;const $=id=>document.getElementById(id);
async function wallet(){const r=await fetch('/api/wallet',{credentials:'include',cache:'no-store'});if(r.status===401)return location.href='/login.html';const d=await r.json();$('balance').textContent='GH₵'+Number(d.balance||0).toFixed(2)}
async function load(){try{await wallet();const r=await fetch('/api/mashup/packages',{credentials:'include',cache:'no-store'}),d=await r.json();if(r.status===401)return location.href='/login.html';if(!r.ok){$('grid').innerHTML='<div class="msg">'+(d.message||'MashUp is unavailable.')+'</div>';return}if(d.open===false){$('grid').innerHTML='<div class="msg">MTN MashUp is temporarily unavailable.</div>';return}const ps=Array.isArray(d.data)?d.data:[];$('grid').innerHTML=ps.map(p=>'<button class="item" onclick="pick('+Number(p.comboCost)+',this)"><div><b>'+String(p.title||('MTN MashUp ₵'+p.price))+'</b></div><div class="price">GH₵'+Number(p.price).toFixed(2)+'</div><div class="stats">'+Number(p.mb||0)+' MB ('+Number(p.capacity||0)+' GB) • '+Number(p.onnetMins||0)+' MTN mins<br>'+Number(p.offnetMins||0)+' other-network mins • '+Number(p.sms||0)+' SMS<br>Valid '+Number(p.validityDays||30)+' days</div></button>').join('')||'<div class="msg">No packages available.</div>'}catch(e){$('grid').innerHTML='<div class="msg">'+e.message+'</div>'}}
function pick(cost,el){document.querySelectorAll('.item').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');selected=cost;const txt=el.innerText.split('\n');$('details').innerHTML='<b>Selected package</b><br>'+txt.join(' • ');$('summary').style.display='block'}
async function buy(){if(!selected)return;const phone=$('phone').value.trim();if(!/^0(?:24|54|55|59)\d{7}$/.test(phone))return msg('Enter a valid 10-digit MTN Ghana number.');const b=document.querySelector('.buy');b.disabled=true;b.textContent='Processing…';try{const r=await fetch('/api/mashup/purchase',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,comboCost:selected})});const d=await r.json();if(!r.ok)throw Error(d.message||'Purchase failed.');msg('Order '+(d.order?.order_ref||'created')+' is processing. Your wallet was charged GH₵'+Number(d.package?.price||0).toFixed(2)+'.');await wallet()}catch(e){msg(e.message)}finally{b.disabled=false;b.textContent='Buy from DGM Wallet'}}
function msg(x){$('msg').innerHTML='<div class="msg">'+String(x).replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]))+'</div>'}load();
</script></body></html>
