<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DGM Admin Portal</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07110d;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#0d1914;border:1px solid #20362b;border-radius:22px;padding:28px;box-shadow:0 20px 60px #0008}.brand{font-size:13px;color:#25d366;font-weight:800;letter-spacing:2px}.logo{font-size:30px;font-weight:900;margin:8px 0 5px}.muted{color:#9eafa6;font-size:14px;line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0 4px}.tab{padding:11px;border-radius:10px;border:1px solid #294136;background:#08120e;color:#c9d4cf;font-weight:800;cursor:pointer}.tab.active{background:#25d366;color:#041008}label{display:block;margin:18px 0 7px;font-size:13px;color:#c9d4cf}input{width:100%;padding:14px;border-radius:12px;border:1px solid #294136;background:#08120e;color:#fff;outline:none}input:focus{border-color:#25d366}button.submit{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:#25d366;color:#041008;font-weight:900;cursor:pointer}.msg{margin-top:14px;min-height:20px;color:#ff8b8b;font-size:13px}.staff-link{display:block;margin-top:16px;text-align:center;color:#25d366;text-decoration:none;font-size:13px;font-weight:800}.secure{margin-top:20px;padding:12px;border-radius:12px;background:#09140f;color:#93a59b;font-size:12px}</style></head>
<body><main class="card"><div class="brand">DHE GENIUS MEDIA</div><div class="logo">Business Control Center</div><div class="muted">Secure sign-in for the DGM Super Admin Control Center.</div>

<form id="form"><label id="emailLabel">Admin email</label><input id="email" type="email" autocomplete="username" required><label id="passwordLabel">Admin password</label><input id="password" type="password" autocomplete="current-password" required><button class="submit" id="btn">Sign in</button><div id="msg" class="msg"></div></form>
<div class="secure">Credentials are verified server-side. Staff members use the separate DGM Staff Workspace.<a class="staff-link" href="/staff-login.html">Staff Workspace login</a></div></main>
<script>
const $=s=>document.querySelector(s);
(async()=>{try{const staff=await fetch('/api/admin/staff/me',{credentials:'same-origin'});if(staff.ok)return location.replace('/staff.html');const r=await fetch('/api/admin/me',{credentials:'same-origin'});if(r.ok)location.replace('/admin.html')}catch(e){}})();
$('#form').addEventListener('submit',async e=>{e.preventDefault();const btn=$('#btn'),msg=$('#msg');btn.disabled=true;btn.textContent='Signing in...';msg.textContent='';try{const url='/api/admin/login';const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.message||'Login failed.');location.replace('/admin.html')}catch(err){msg.textContent=err.message}finally{btn.disabled=false;btn.textContent='Sign in'}});
</script></body></html>
