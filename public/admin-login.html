<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DGM Admin Portal</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07110d;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#0d1914;border:1px solid #20362b;border-radius:22px;padding:28px;box-shadow:0 20px 60px #0008}.brand{font-size:13px;color:#25d366;font-weight:800;letter-spacing:2px}.logo{font-size:30px;font-weight:900;margin:8px 0 5px}.muted{color:#9eafa6;font-size:14px;line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0 4px}.tab{padding:11px;border-radius:10px;border:1px solid #294136;background:#08120e;color:#c9d4cf;font-weight:800;cursor:pointer}.tab.active{background:#25d366;color:#041008}label{display:block;margin:18px 0 7px;font-size:13px;color:#c9d4cf}input{width:100%;padding:14px;border-radius:12px;border:1px solid #294136;background:#08120e;color:#fff;outline:none}input:focus{border-color:#25d366}button.submit{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:#25d366;color:#041008;font-weight:900;cursor:pointer}.msg{margin-top:14px;min-height:20px;color:#ff8b8b;font-size:13px}.staff-link{display:block;margin-top:16px;text-align:center;color:#25d366;text-decoration:none;font-size:13px;font-weight:800}.secure{margin-top:20px;padding:12px;border-radius:12px;background:#09140f;color:#93a59b;font-size:12px}
/* DGM Premium Navy + Gold Authentication Theme */
:root{color-scheme:dark;--dgm-gold:#ffd51f;--dgm-gold2:#ffb800;--dgm-navy:#071321;--dgm-panel:rgba(9,22,39,.82);--dgm-muted:#b5c3d5}
html{min-height:100%;background:#050b14!important}
body{min-height:100vh!important;min-height:100svh!important;margin:0!important;padding:24px!important;color:#f7f9fc!important;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif!important;background:radial-gradient(ellipse at 15% 30%,rgba(255,190,0,.15),transparent 32%),radial-gradient(ellipse at 85% 15%,rgba(46,104,157,.18),transparent 35%),linear-gradient(135deg,#030812 0%,#0a1728 52%,#030811 100%)!important}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 8% 25%,rgba(255,213,31,.85) 0 2px,transparent 4px),radial-gradient(circle at 78% 12%,rgba(255,213,31,.8) 0 2px,transparent 5px),radial-gradient(circle at 88% 72%,rgba(255,213,31,.75) 0 2px,transparent 5px),radial-gradient(circle at 25% 83%,rgba(255,213,31,.65) 0 2px,transparent 5px);opacity:.7}
.container,.scene-panel,.card,main,section{position:relative;z-index:1}
.scene-panel{width:100%;min-height:calc(100vh - 48px)!important;min-height:calc(100svh - 48px)!important;overflow:visible!important;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px!important;background:transparent!important}
.orb{background:radial-gradient(circle,rgba(255,213,31,.17),rgba(255,184,0,.04) 55%,transparent 72%)!important;box-shadow:0 0 32px rgba(255,190,0,.1)!important}
.brand{margin:0 0 22px!important;text-align:center!important}
.logo{width:54px!important;height:54px!important;display:flex!important;align-items:center;justify-content:center;margin:0 auto 12px!important;border-radius:16px!important;background:linear-gradient(135deg,#ffe34a,#ffb900)!important;color:#071321!important;font-weight:950!important;box-shadow:0 8px 32px rgba(255,190,0,.28)!important}
.brand h1{color:#f7f9fc!important;font-size:clamp(18px,4vw,24px)!important;font-weight:850!important}
.brand p{color:#aebed2!important;font-size:13px!important}
.card{width:min(100%,480px)!important;min-width:0!important;height:auto!important;max-height:none!important;padding:clamp(24px,5vw,38px)!important;border-radius:26px!important;background:linear-gradient(145deg,rgba(17,34,55,.94),rgba(5,15,28,.94))!important;border:1px solid rgba(220,235,255,.27)!important;box-shadow:0 28px 80px rgba(0,0,0,.48),0 0 35px rgba(255,190,0,.08),inset 0 1px 0 rgba(255,255,255,.13)!important;backdrop-filter:blur(24px) saturate(145%)!important;-webkit-backdrop-filter:blur(24px) saturate(145%)!important}
.card h1,.card h2{font-size:clamp(27px,6vw,40px)!important;line-height:1.08!important;font-weight:850!important;letter-spacing:-.7px!important;margin:0 0 10px!important;color:#fff!important}
.card h1 strong,.card h2 strong{color:var(--dgm-gold)!important}
.subtitle,.sub,.muted{color:var(--dgm-muted)!important;line-height:1.6!important;margin-bottom:24px!important}
label{display:block!important;color:#dce6f3!important;font-size:13px!important;font-weight:650!important;margin:0 0 8px!important}
.field{margin-bottom:17px!important}
input{width:100%!important;min-height:50px!important;height:auto!important;padding:14px 15px!important;border-radius:13px!important;border:1px solid rgba(185,205,230,.28)!important;background:rgba(3,12,24,.62)!important;color:#fff!important;font-size:15px!important;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)!important}
input::placeholder{color:#8193aa!important}
input:focus{border-color:var(--dgm-gold)!important;box-shadow:0 0 0 3px rgba(255,213,31,.13),0 0 20px rgba(255,190,0,.08)!important;background:rgba(3,12,24,.85)!important}
.password-wrap{position:relative!important}.password-wrap input{padding-right:64px!important}
.password-toggle{position:absolute!important;right:6px!important;top:50%!important;transform:translateY(-50%)!important;width:48px!important;height:32px!important;padding:0!important;margin:0!important;border-radius:8px!important;background:transparent!important;color:var(--dgm-gold)!important;font-size:11px!important;box-shadow:none!important}
button,.submit{min-height:52px!important;height:auto!important;width:100%!important;margin-top:8px!important;padding:14px 18px!important;border:0!important;border-radius:14px!important;background:linear-gradient(110deg,#ffe34a 0%,#ffd21a 45%,#ffb900 100%)!important;color:#111827!important;font-size:16px!important;font-weight:850!important;box-shadow:0 10px 28px rgba(255,190,0,.22)!important;cursor:pointer!important;transition:transform .18s ease,filter .18s ease!important}
button:hover,.submit:hover{transform:translateY(-1px)!important;filter:brightness(1.04)!important}
button:disabled,.submit:disabled{opacity:.65!important;cursor:wait!important;transform:none!important}
.forgot a,.register a,.login a,.back a,.admin-link{color:var(--dgm-gold)!important}
.forgot,.register,.login,.back{color:#aebed2!important}
.message{border-radius:12px!important;font-size:13px!important;line-height:1.5!important}
.message.error,.error,.msg{color:#ffabab!important}
.message.success,.success{color:#a0f0bc!important}
.security-note,.secure,.footer{color:#899bb0!important;font-size:11px!important;line-height:1.6!important}
.secure{background:rgba(255,255,255,.035)!important;border:1px solid rgba(255,255,255,.08)!important}
.badge{background:rgba(255,213,31,.12)!important;color:var(--dgm-gold)!important}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--dgm-gold)!important;outline-offset:3px!important}
@media(max-width:520px){body{padding:12px!important}.scene-panel{min-height:calc(100svh - 24px)!important;padding:20px 4px!important}.card{padding:25px 20px!important;border-radius:22px!important}.brand{margin-bottom:18px!important}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

</style></head>
<body><main class="card"><div class="brand">DHE GENIUS MEDIA</div><div class="logo">Business Control Center</div><div class="muted">Secure sign-in for the DGM Super Admin Control Center.</div>

<form id="form"><label id="emailLabel">Admin email</label><input id="email" type="email" autocomplete="username" required><label id="passwordLabel">Admin password</label><input id="password" type="password" autocomplete="current-password" required><button class="submit" id="btn">Sign in</button><div id="msg" class="msg"></div></form>
<div class="secure">Credentials are verified server-side. Staff members use the separate DGM Staff Workspace.<a class="staff-link" href="/staff-login.html">Staff Workspace login</a></div></main>
<script>
const $=s=>document.querySelector(s);
(async()=>{try{const staff=await fetch('/api/admin/staff/me',{credentials:'same-origin'});if(staff.ok)return location.replace('/staff.html');const r=await fetch('/api/admin/me',{credentials:'same-origin'});if(r.ok)location.replace('/admin.html')}catch(e){}})();
$('#form').addEventListener('submit',async e=>{e.preventDefault();const btn=$('#btn'),msg=$('#msg');btn.disabled=true;btn.textContent='Signing in...';msg.textContent='';try{const url='/api/admin/login';const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.message||'Login failed.');location.replace('/admin.html')}catch(err){msg.textContent=err.message}finally{btn.disabled=false;btn.textContent='Sign in'}});
</script></body></html>
