<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b0b"><title>Product | DGM Market</title>
<style>:root{--bg:#050b0b;--card:#0b1515;--card2:#102020;--text:#f7fffb;--muted:#829b93;--green:#25d366;--border:rgba(255,255,255,.08);--red:#ff6670}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#050b0b,#071010 55%,#050909);color:var(--text);font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:10;background:rgba(5,11,11,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}.bar{max-width:1200px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#35f47c,#0b9f4a);display:grid;place-items:center;font-weight:900;font-size:12px}.brand{font-weight:900}.brand small{display:block;color:var(--muted);font-size:9px}.back{margin-left:auto;border:1px solid var(--border);background:#0b1717;color:#fff;border-radius:10px;padding:9px 12px}.wrap{max-width:1200px;margin:auto;padding:22px 16px 80px}.product{display:grid;grid-template-columns:1.05fr 1fr;gap:25px}.gallery{display:grid;gap:10px}.heroimg{aspect-ratio:1/1;background:#0d1b1b;border:1px solid var(--border);border-radius:22px;overflow:hidden}.heroimg img{width:100%;height:100%;object-fit:cover}.thumbs{display:flex;gap:8px;overflow:auto}.thumb{width:72px;height:72px;flex:none;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#0d1b1b}.thumb img{width:100%;height:100%;object-fit:cover}.info{padding:8px 0}.brandline{color:var(--muted);font-size:12px}.title{font-size:32px;margin:8px 0}.rating{color:#ffd35c;font-weight:800}.price{font-size:29px;font-weight:950;margin:15px 0}.old{text-decoration:line-through;color:#6d817a;font-size:14px;margin-left:8px}.deal{display:inline-block;background:rgba(37,211,102,.14);color:var(--green);padding:5px 9px;border-radius:99px;font-size:11px;font-weight:900}.desc{color:#bfd0c9;line-height:1.65;white-space:pre-wrap}.variant{margin:18px 0}.variant h4{margin:0 0 8px}.opts{display:flex;gap:8px;flex-wrap:wrap}.opt{border:1px solid var(--border);background:#0b1717;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.opt.active{border-color:var(--green);background:rgba(37,211,102,.12)}.buyrow{display:flex;gap:9px;margin-top:20px}.buy{flex:1;border:0;background:var(--green);color:#04120a;border-radius:12px;padding:13px;font-weight:950}.wish{border:1px solid var(--border);background:#0b1717;color:#fff;border-radius:12px;padding:13px 18px}.reviews{margin-top:30px;border-top:1px solid var(--border);padding-top:22px}.review{padding:14px 0;border-bottom:1px solid var(--border)}.stars{color:#ffd35c}.review small{color:var(--muted)}.form{background:#0b1515;border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:18px}.field{display:block;margin:9px 0}.field span{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field input,.field textarea{width:100%;background:#071010;color:#fff;border:1px solid var(--border);border-radius:9px;padding:10px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#173021;border:1px solid #2c573d;color:#fff;padding:11px 15px;border-radius:12px;display:none}.toast.show{display:block}.empty{color:var(--muted);padding:30px;text-align:center}@media(max-width:800px){.product{grid-template-columns:1fr}.title{font-size:25px}}</style></head><body>
<header class="top"><div class="bar"><a href="/dashboard.html"><div class="logo">DGM</div></a><div class="brand">DHE GENIUS MEDIA<small>Stay Connected. Stay Genius. • DGM Market</small></div><a class="back" href="/market.html">← Market</a></div></header>
<main class="wrap"><div id="app" class="empty">Loading product…</div></main><div id="toast" class="toast"></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=v=>'GH₵'+Number(v||0).toFixed(2);
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const d=await r.json().catch(()=>({success:false,message:'Request failed'}));if(!r.ok||d.success===false)throw Error(d.message||'Request failed');return d}
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
let product=null,selected={},reviews=[];
function stars(n){return '★★★★★'.slice(0,Math.max(0,Math.min(5,Math.round(Number(n)||0))) )+'☆☆☆☆☆'.slice(0,5-Math.max(0,Math.min(5,Math.round(Number(n)||0))))}
function render(){
 const p=product, price=p.sale_price??p.price, images=[p.image_url,...(p.gallery||[])].filter(Boolean);
 document.getElementById('app').innerHTML='<div class="product"><div class="gallery"><div class="heroimg">'+(images[0]?'<img id="hero" src="'+esc(images[0])+'">':'<div class="empty">🛍️</div>')+'</div><div class="thumbs">'+images.map((x,i)=>'<button class="thumb" onclick="document.getElementById(\'hero\').src=\''+esc(x).replace(/'/g,'')+'\'"><img src="'+esc(x)+'"></button>').join('')+'</div></div><div class="info"><div class="brandline">'+esc(p.brand||p.category||'DGM Market')+'</div><h1 class="title">'+esc(p.name)+'</h1><div><span class="rating">'+stars(p.rating)+'</span> <span class="brandline">'+Number(p.rating||0).toFixed(1)+' • '+Number(p.review_count||0)+' reviews</span></div><div class="price">'+money(price)+(p.sale_price!=null?'<span class="old">'+money(p.price)+'</span> <span class="deal">DEAL</span>':'')+'</div><div class="desc">'+esc(p.description||'Quality product from DGM Market.')+'</div>'+variantHtml()+'<div class="brandline">Stock: '+Number(p.stock||0)+' • Delivery: '+money(p.delivery_fee||0)+'</div><div class="buyrow"><button class="buy" onclick="addToCart()">Add to Cart</button><button class="wish" onclick="saveWish()">♡</button></div></div></div><section class="reviews"><h2>Customer Reviews</h2><div id="reviewList">'+renderReviews()+'</div><div class="form"><h3>Rate this product</h3><div class="field"><span>Rating (1–5)</span><select id="rating" style="background:#071010;color:#fff;border:1px solid var(--border);padding:10px;border-radius:9px"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div><label class="field"><span>Title</span><input id="reviewTitle" maxlength="160" placeholder="Your review title"></label><label class="field"><span>Review</span><textarea id="reviewBody" rows="4" maxlength="2000" placeholder="Tell other shoppers about the product"></textarea></label><button class="buy" onclick="submitReview()">Submit Review</button></div></section>';
}
function variantHtml(){return (product.variants||[]).map((v,i)=>{const name=typeof v==='string'?v:(v.name||v.title||('Option '+(i+1))),opts=Array.isArray(v.options)?v.options:(Array.isArray(v.values)?v.values:[]);return opts.length?'<div class="variant"><h4>'+esc(name)+'</h4><div class="opts">'+opts.map(o=>'<button class="opt '+(selected[name]===o?'active':'')+'" onclick="selected[\''+esc(name).replace(/'/g,'')+'\']=\''+esc(o).replace(/'/g,'')+'\';render()">'+esc(o)+'</button>').join('')+'</div></div>':''}).join('')}
function renderReviews(){if(!reviews.length)return '<div class="empty">No reviews yet. Be the first to review this product.</div>';return reviews.map(r=>'<div class="review"><b>'+esc(r.customer_name||'Customer')+'</b> <span class="stars">'+stars(r.rating)+'</span> '+(r.verified_purchase?'<span class="deal">Verified purchase</span>':'')+'<br><b>'+esc(r.title||'Review')+'</b><p>'+esc(r.body)+'</p><small>'+new Date(r.created_at).toLocaleString()+'</small></div>').join('')}
async function addToCart(){if(!product)return;let cart=JSON.parse(localStorage.getItem('dgmMarketCart')||'[]'),x=cart.find(x=>x.product_id===product.id&&JSON.stringify(x.variant||{})===JSON.stringify(selected));if(x)x.quantity++;else cart.push({product_id:product.id,name:product.name,price:product.sale_price??product.price,image_url:product.image_url,quantity:1,variant:selected});localStorage.setItem('dgmMarketCart',JSON.stringify(cart));toast('Added to cart');}
async function saveWish(){try{const j=await api('/api/market/wishlist/'+product.id,{method:'POST'});toast(j.saved?'Saved to wishlist':'Removed from wishlist')}catch(e){if(/login|session/i.test(e.message))location.href='/login.html';else toast(e.message)}}
async function submitReview(){const body=document.getElementById('reviewBody').value.trim();if(!body)return toast('Write a review first');try{await api('/api/market/products/'+product.id+'/reviews',{method:'POST',body:JSON.stringify({rating:Number(document.getElementById('rating').value),title:document.getElementById('reviewTitle').value,body})});toast('Review saved');await load();}catch(e){if(/login|session/i.test(e.message))location.href='/login.html';else toast(e.message)}}
async function load(){try{const id=Number(new URLSearchParams(location.search).get('id'));if(!id)throw Error('Product not found');const [p,r]=await Promise.all([api('/api/market/products/'+id),api('/api/market/products/'+id+'/reviews')]);product=p.product;reviews=r.reviews||[];render()}catch(e){document.getElementById('app').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
load();
</script></body></html>
