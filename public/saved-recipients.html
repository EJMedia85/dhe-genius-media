<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DGM Saved Recipients</title><style>body{margin:0;background:#07110d;color:#f4fff8;font-family:Arial}.wrap{max-width:800px;margin:auto;padding:24px}.card{background:#0d1b15;border:1px solid #193329;border-radius:18px;padding:20px;margin:14px 0}input,button{padding:12px;border-radius:10px;border:1px solid #29463a;background:#08130e;color:#fff;margin:5px 0;width:100%;box-sizing:border-box}button{background:#25d366;color:#06100b;font-weight:800;border:0}.item{padding:14px 0;border-bottom:1px solid #193329}a{color:#25d366}</style></head><body><div class="wrap"><h1>DGM Saved Recipients</h1><p><a href="/dashboard.html">← Dashboard</a></p><div class="card"><input id="label" placeholder="Name e.g. Mom"><input id="phone" placeholder="Ghana phone number"><input id="network" placeholder="Network e.g. MTN"><button onclick="save()">Save Recipient</button><p id="msg"></p></div><div class="card"><h2>Saved Numbers</h2><div id="list">Loading…</div></div></div><script>async function load(){const r=await fetch('/api/saved-recipients',{credentials:'include'});if(r.status===401){location='/login.html';return}const d=await r.json();document.getElementById('list').innerHTML=d.recipients.length?d.recipients.map(x=>'<div class="item"><b>'+esc(x.label)+'</b><br>'+esc(x.phone)+' • '+esc(x.network||'')+' <button onclick="del('+x.id+')">Remove</button></div>').join(''):'No saved recipients yet.'}async function save(){const body={label:label.value,phone:phone.value,network:network.value};const r=await fetch('/api/saved-recipients',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)});const d=await r.json();msg.textContent=d.message||'Saved';if(d.success){label.value=phone.value=network.value='';load()}}async function del(id){await fetch('/api/saved-recipients/'+id,{method:'DELETE',credentials:'include'});load()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load()</script></body></html>
