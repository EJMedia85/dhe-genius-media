<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | DHE GENIUS MEDIA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#123b7a 0%,#07111f 42%,#02060c 100%);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:430px;padding:30px 24px;border-radius:24px;background:rgba(10,22,38,.95);border:1px solid rgba(255,255,255,.09);box-shadow:0 25px 70px rgba(0,0,0,.45)}.logo{text-align:center;font-weight:900;font-size:22px;margin-bottom:20px}.card h1{font-size:27px;margin-bottom:8px}.sub{color:#94a8bf;font-size:14px;line-height:1.5;margin-bottom:22px}.message{display:none;padding:12px 14px;margin-bottom:18px;border-radius:12px;font-size:14px;line-height:1.45}.message.show{display:block}.error{background:rgba(255,70,70,.12);border:1px solid rgba(255,70,70,.3);color:#ff9d9d}.success{background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.3);color:#72f0a0}label{display:block;margin-bottom:8px;font-size:14px;font-weight:700}input{width:100%;height:52px;padding:0 15px;border-radius:13px;border:1px solid #263a52;outline:none;background:#081321;color:#fff;font-size:15px;margin-bottom:18px}button{width:100%;height:53px;border:0;border-radius:13px;background:linear-gradient(135deg,#168cff,#005eea);color:#fff;font-size:16px;font-weight:800}button:disabled{opacity:.65}.back{text-align:center;margin-top:20px;font-size:14px}.back a{color:#4aa3ff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<section class="card">
<div class="logo">DGM</div>
<h1>Forgot password?</h1>
<p class="sub">Enter the email address or phone number linked to your DGM account. If it matches an account, we'll send a password reset link.</p>
<div id="message" class="message"></div>
<form id="form">
<label for="identifier">Email or Phone Number</label>
<input id="identifier" autocomplete="username" placeholder="you@example.com or 0241234567" required>
<button id="button" type="submit">Send Reset Link</button>
</form>
<div class="back"><a href="/login.html">← Back to Login</a></div>
</section>
<script>
const form=document.getElementById("form"),button=document.getElementById("button"),message=document.getElementById("message");
function show(text,type){message.textContent=text;message.className="message show "+type}
form.addEventListener("submit",async e=>{
 e.preventDefault(); button.disabled=true; button.textContent="Sending...";
 try{
  const r=await fetch("/api/forgot-password",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({identifier:document.getElementById("identifier").value.trim()})});
  const data=await r.json().catch(()=>({}));
  if(!r.ok||!data.success) throw new Error(data.message||"Could not process your request.");
  if(data.reset_url){
   message.innerHTML=data.message+'<br><br><a href="'+data.reset_url+'" style="display:inline-block;padding:11px 15px;background:#25d366;color:#06110a;text-decoration:none;border-radius:10px;font-weight:800">Open Test Reset Link</a>';
   message.className="message show success";
  }else{
   show(data.message,"success");
  }
  button.textContent="Reset Link Requested";
 }catch(err){show(err.message||"Please try again.","error");button.disabled=false;button.textContent="Send Reset Link"}
});
</script>

<!-- DGM GLOBAL BRAND NAVIGATION -->
<script>
(function(){
  function enableDgmBrandNavigation(){
    document.querySelectorAll('.brand, .logo, .brand-name, .brand-tagline, header b, header strong').forEach(function(el){
      if(el.dataset.dgmNavBound==='1') return;
      var text=(el.textContent||'').replace(/\\s+/g,' ').trim().toLowerCase();
      if(!text.includes('dgm') && !text.includes('dhe genius media') && !text.includes('stay connected. stay genius')) return;
      el.dataset.dgmNavBound='1';
      el.style.cursor='pointer';
      el.setAttribute('role','link');
      el.setAttribute('aria-label','Go to DGM Dashboard');
      el.addEventListener('click',function(event){
        if(event.target.closest('a') && event.target.closest('a')!==el) return;
        window.location.href='/dashboard.html';
      });
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',enableDgmBrandNavigation);
  else enableDgmBrandNavigation();
})();
</script>
</body>
</html>
