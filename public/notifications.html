<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07120d">
<title>Notifications • DHE GENIUS MEDIA</title>
<style>
:root{color-scheme:dark;--bg:#06100c;--panel:#0d1c15;--panel2:#10251a;--line:rgba(143,190,164,.16);--text:#f2fff7;--muted:#91a99a;--green:#25d366;--mint:#9bffc1;--red:#ff6375}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% -10%,rgba(37,211,102,.13),transparent 42%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;padding:22px 16px 50px}.wrap{max-width:860px;margin:auto}.top{display:flex;align-items:center;gap:13px;margin-bottom:20px}.back{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--mint);text-decoration:none;font-size:26px}.brand{font-size:clamp(23px,5vw,32px);font-weight:900;letter-spacing:-.04em}.muted{color:var(--muted);font-size:13px;line-height:1.55}.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,rgba(37,211,102,.11),rgba(13,28,21,.94));margin-bottom:14px}.summary-title{font-size:15px;font-weight:850}.summary-count{display:inline-flex;align-items:center;gap:7px;color:var(--mint);font-weight:800;font-size:12px;margin-top:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(37,211,102,.8)}button{font:inherit;cursor:pointer}.btn{border:1px solid var(--line);border-radius:11px;padding:10px 13px;color:var(--text);background:#13271c;font-weight:800;font-size:12px}.btn.primary{background:var(--green);border-color:var(--green);color:#041109}.btn:disabled{opacity:.45;cursor:not-allowed}.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:thin}.filter{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:var(--panel);color:var(--muted);font-size:12px;font-weight:800}.filter.active{background:rgba(37,211,102,.15);border-color:rgba(37,211,102,.48);color:var(--mint)}.list{display:grid;gap:10px}.card{display:flex;gap:13px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,rgba(16,37,26,.98),rgba(9,22,15,.98));transition:border-color .15s,transform .15s}.card.unread{border-color:rgba(37,211,102,.38);box-shadow:inset 3px 0 0 var(--green)}.icon{flex:0 0 42px;width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:rgba(37,211,102,.12);font-size:19px}.content{flex:1;min-width:0}.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}.category{font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:var(--mint)}.new{font-size:9px;font-weight:900;letter-spacing:.06em;padding:4px 7px;border-radius:999px;background:rgba(37,211,102,.15);color:var(--mint)}.title{font-size:15px;font-weight:850;line-height:1.35;margin:0 0 6px}.message{font-size:13px;color:#b5c9bc;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.date{font-size:10px;color:#779183;margin-top:10px}.card-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:11px}.empty,.error{padding:34px 18px;text-align:center;border:1px dashed var(--line);border-radius:18px;background:rgba(13,28,21,.65);color:var(--muted);line-height:1.6}.empty-icon{font-size:28px;margin-bottom:10px}.error{color:#ffb5bd}.status{font-size:12px;color:var(--muted);margin:0 0 10px}@media(max-width:520px){body{padding:14px 12px 34px}.summary{padding:15px}.card{padding:13px;gap:10px}.icon{width:36px;height:36px;flex-basis:36px;border-radius:12px}.card-actions .btn{flex:1}.top{margin-bottom:15px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><a class="back" href="/dashboard.html" aria-label="Back to dashboard">‹</a><div><div class="brand">Notification Centre</div><div class="muted">Your DGM updates, announcements and account alerts.</div></div></header>
<section class="summary"><div><div class="summary-title">Stay in the loop</div><div class="muted">Important updates from DHE GENIUS MEDIA, all in one place.</div><div class="summary-count"><span class="dot"></span><span id="unreadSummary">Checking unread alerts…</span></div></div><button class="btn primary" id="markAllBtn" onclick="markAllRead()" disabled>Mark all as read</button></section>
<div class="filters" role="group" aria-label="Filter notifications">
<button class="filter active" data-filter="all" onclick="setFilter('all')">All</button><button class="filter" data-filter="unread" onclick="setFilter('unread')">Unread</button><button class="filter" data-filter="announcements" onclick="setFilter('announcements')">Announcements</button><button class="filter" data-filter="orders" onclick="setFilter('orders')">Orders</button><button class="filter" data-filter="payments" onclick="setFilter('payments')">Payments</button><button class="filter" data-filter="promotions" onclick="setFilter('promotions')">Promotions</button><button class="filter" data-filter="security" onclick="setFilter('security')">Account &amp; security</button>
</div><p class="status" id="status" aria-live="polite">Loading notifications…</p><section class="list" id="app" aria-live="polite"><div class="empty"><div class="empty-icon">🔔</div>Loading your notifications…</div></section>
</main>
<script>
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
let allNotifications=[],activeFilter="all",loading=false;
function category(n){const t=String(n.type||"").toLowerCase(),s=(String(n.title||"")+" "+String(n.message||"")).toLowerCase();if(n.is_broadcast||/announcement|broadcast|news/.test(t+" "+s))return{key:"announcements",label:"Announcement",icon:"📣"};if(/order|delivery|bundle|purchase/.test(t+" "+s))return{key:"orders",label:"Order update",icon:"📦"};if(/payment|wallet|refund|top.?up|withdraw|transaction/.test(t+" "+s))return{key:"payments",label:"Payment & wallet",icon:"💳"};if(/promo|offer|discount|reward/.test(t+" "+s))return{key:"promotions",label:"Promotion",icon:"✨"};if(/security|password|login|account|verify/.test(t+" "+s))return{key:"security",label:"Account & security",icon:"🔐"};return{key:"announcements",label:"DGM update",icon:"🔔"}}
function setFilter(filter){activeFilter=filter;document.querySelectorAll("[data-filter]").forEach(b=>b.classList.toggle("active",b.dataset.filter===filter));render()}
function render(){const root=document.getElementById("app"),items=allNotifications.filter(n=>{if(activeFilter==="unread")return!n.read_at;if(activeFilter==="all")return true;return category(n).key===activeFilter});const unread=allNotifications.filter(n=>!n.read_at).length;document.getElementById("unreadSummary").textContent=unread?unread+" unread notification"+(unread===1?"":"s"): "You're all caught up";document.getElementById("markAllBtn").disabled=!unread;if(!items.length){root.innerHTML='<div class="empty"><div class="empty-icon">'+(activeFilter==="unread"?"✅":"🔔")+'</div><b>'+(activeFilter==="unread"?"No unread notifications":"Nothing to show here yet")+'</b><div class="muted" style="margin-top:6px">'+(activeFilter==="unread"?"You’re all caught up.":"New DGM announcements and updates will appear here when available.")+'</div>'+(activeFilter!=="all"?'<button class="btn" style="margin-top:14px" onclick="setFilter(\'all\')">View all notifications</button>':"")+'</div>';return}root.innerHTML=items.map(n=>{const c=category(n),id=Number(n.id),date=n.created_at?new Date(n.created_at):null;return '<article class="card '+(!n.read_at?"unread":"")+'"><div class="icon" aria-hidden="true">'+c.icon+'</div><div class="content"><div class="meta"><span class="category">'+esc(c.label)+'</span>'+(!n.read_at?'<span class="new">NEW</span>':"")+'</div><h2 class="title">'+esc(n.title||"DGM Update")+'</h2><div class="message">'+esc(n.message||"")+'</div><div class="date">'+(date&&!Number.isNaN(date.getTime())?esc(date.toLocaleString()):"")+'</div>' +(!n.read_at?'<div class="card-actions"><button class="btn" onclick="markRead('+id+')">Mark as read</button></div>':"")+'</div></article>'}).join("")}
async function request(url,options={}){const r=await fetch(url,{credentials:"include",cache:"no-store",headers:{Accept:"application/json",...(options.headers||{})},...options});if(r.status===401){location.href="/login.html";throw Error("Please sign in to view your notifications.")}let data={};try{data=await r.json()}catch{}if(!r.ok||data.success===false)throw Error(data.message||"Notification request failed ("+r.status+")");return data}
async function load(){if(loading)return;loading=true;const status=document.getElementById("status");try{const data=await request("/api/notifications");allNotifications=Array.isArray(data.notifications)?data.notifications:[];status.textContent="Showing "+allNotifications.length+" recent notification"+(allNotifications.length===1?"":"s")+" • refreshes automatically";render()}catch(e){status.textContent="";document.getElementById("app").innerHTML='<div class="error"><div class="empty-icon">⚠️</div><b>Could not load notifications</b><div style="margin-top:6px">'+esc(e.message||"Check your connection and try again.")+'</div><button class="btn primary" style="margin-top:14px" onclick="load()">Try again</button></div>'}finally{loading=false}}
async function markRead(id){try{await request("/api/notifications/"+encodeURIComponent(id)+"/read",{method:"POST"});const n=allNotifications.find(x=>Number(x.id)===Number(id));if(n&&!n.read_at)n.read_at=new Date().toISOString();render()}catch(e){document.getElementById("status").textContent=e.message||"Could not mark as read."}}
async function markAllRead(){const button=document.getElementById("markAllBtn");button.disabled=true;button.textContent="Updating…";try{await request("/api/notifications/read-all",{method:"POST"});const now=new Date().toISOString();allNotifications.forEach(n=>{if(!n.read_at)n.read_at=now});render();document.getElementById("status").textContent="All notifications marked as read."}catch(e){document.getElementById("status").textContent=e.message||"Could not update notifications."}finally{button.textContent="Mark all as read";button.disabled=!allNotifications.some(n=>!n.read_at)}}
load();setInterval(load,15000);window.addEventListener("focus",load);window.addEventListener("pageshow",load);
</script></body></html>
