<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DGM Movie Playback Admin</title>
<style>
body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif;padding:20px}
.box{max-width:620px;margin:30px auto;background:#111;border:1px solid #ffffff18;border-radius:16px;padding:22px}
h1{margin-top:0}.muted{color:#aaa;font-size:13px;line-height:1.5}
label{display:block;margin:15px 0 7px;font-size:13px;font-weight:700}
input,select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #ffffff20;background:#181818;color:#fff}
button{margin-top:18px;background:#25d366;color:#06110b;border:0;font-weight:900;cursor:pointer}
#out{margin-top:16px;padding:12px;border-radius:9px;background:#181818;white-space:pre-wrap;font-size:12px}
</style>
</head>
<body>
<div class="box">
<h1>🎬 DGM Movie Playback</h1>
<p class="muted">Register only movies that DGM owns, licenses, or is otherwise authorized to stream. The playback URL should point to your authorized MP4 or HLS source.</p>

<label>Movie TMDB ID</label>
<input id="tmdb" type="number" min="1" placeholder="Example: 603">

<label>Movie title</label>
<input id="title" placeholder="Example: The Matrix">

<label>Playback type</label>
<select id="type"><option value="hls">HLS (.m3u8)</option><option value="mp4">MP4</option></select>

<label>Authorized playback URL</label>
<input id="url" type="url" placeholder="https://your-authorized-cdn.example/movie.m3u8">

<label>Optional expiry (ISO date/time)</label>
<input id="expires" type="datetime-local">

<label>DGM movie admin token</label>
<input id="token" type="password" autocomplete="off" placeholder="Enter your MOVIE_ADMIN_TOKEN">

<button onclick="saveMovie()">Save playback source</button>
<div id="out">Ready.</div>
</div>
<script>
async function saveMovie(){
 const out=document.getElementById("out");
 const payload={
  tmdb_id:Number(document.getElementById("tmdb").value),
  title:document.getElementById("title").value.trim(),
  playback_type:document.getElementById("type").value,
  playback_url:document.getElementById("url").value.trim(),
  expires_at:document.getElementById("expires").value?new Date(document.getElementById("expires").value).toISOString():null
 };
 const token=document.getElementById("token").value;
 if(!payload.tmdb_id||!payload.playback_url||!token){out.textContent="TMDB ID, playback URL and admin token are required.";return}
 out.textContent="Saving…";
 try{
  const r=await fetch("/api/admin/movies/playback",{
   method:"POST",
   headers:{"Content-Type":"application/json","X-DGM-Movie-Admin-Token":token},
   body:JSON.stringify(payload)
  });
  const d=await r.json();
  out.textContent=JSON.stringify(d,null,2);
 }catch(e){out.textContent="Request failed: "+e.message}
}
</script>
</body>
</html>
