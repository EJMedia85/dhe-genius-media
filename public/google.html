<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google • DGM</title><style>body{margin:0;background:#07131f;color:#fff;font-family:Arial,sans-serif}main{max-width:650px;margin:12vh auto;padding:20px;text-align:center}.logo{font-size:42px;font-weight:900}p{color:#91a7b8}.search{display:flex;gap:8px;margin-top:25px}.search input{flex:1;padding:15px;border-radius:12px;border:1px solid #ffffff15;background:#0d2030;color:#fff}.search button{border:0;border-radius:12px;padding:0 20px;font-weight:800}.back{display:block;text-align:left;margin-bottom:30px;color:#91a7b8}</style></head><body><main><a class="back" href="/entertainment.html">‹ Entertainment</a><div class="logo">🔎 Google</div><p>Search the web from DHE GENIUS MEDIA.</p><form class="search" action="https://www.google.com/search" method="get" target="_blank"><input name="q" placeholder="Search Google..." required><button>Search</button></form></main>
<!-- DGM GLOBAL BRAND NAVIGATION -->
<script>
(function(){
  function enableDgmBrandNavigation(){
    document.querySelectorAll('.brand, .logo, .brand-name, .brand-tagline, header b, header strong').forEach(function(el){
      if(el.dataset.dgmNavBound==='1') return;
      var text=(el.textContent||'').replace(/\\s+/g,' ').trim().toLowerCase();
      if(!text.includes('dgm') && !text.includes('dhe genius media') && !text.includes('stay connected. stay genius')) return;
      el.dataset.dgmNavBound='1';
      el.style.cursor='pointer';
      el.setAttribute('role','link');
      el.setAttribute('aria-label','Go to DGM Dashboard');
      el.addEventListener('click',function(event){
        if(event.target.closest('a') && event.target.closest('a')!==el) return;
        window.location.href='/dashboard.html';
      });
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',enableDgmBrandNavigation);
  else enableDgmBrandNavigation();
})();
</script>
</body></html>
