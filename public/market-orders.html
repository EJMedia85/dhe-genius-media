<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b0b"><title>Market Orders | DHE GENIUS MEDIA</title><style>:root{--bg:#050b0b;--card:#0b1515;--text:#f7fffb;--muted:#829b93;--green:#25d366;--border:rgba(255,255,255,.08)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#050b0b,#071010);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:20px 16px 60px}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.back{border:1px solid var(--border);background:var(--card);color:#fff;border-radius:11px;padding:10px 13px}.order{background:linear-gradient(180deg,#0d1c1c,#081313);border:1px solid var(--border);border-radius:18px;padding:16px;margin:12px 0}.head{display:flex;justify-content:space-between;gap:10px}.ref{font-weight:900}.status{font-size:10px;padding:5px 9px;border-radius:999px;background:rgba(37,211,102,.1);color:var(--green)}.meta{color:var(--muted);font-size:11px;line-height:1.7;margin-top:10px}.price{font-size:18px;font-weight:900;margin-top:8px}.empty{text-align:center;color:var(--muted);padding:60px 20px}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="location.href='/market.html'">← Market</button><div><h1 style="margin:0;font-size:25px">My Market Orders</h1><div style="color:var(--muted);font-size:11px">Track your DGM Market purchases</div></div></div><section id="list"><div class="empty">Loading orders...</div></section></main><script>async function load(){try{const r=await fetch('/api/market/orders',{credentials:'include',headers:{Accept:'application/json'},cache:'no-store'});if(r.status===401)return location.href='/login.html';const j=await r.json();if(!r.ok)throw Error(j.message||'Could not load orders');const list=j.orders||[];const el=document.getElementById('list');if(!list.length){el.innerHTML='<div class="empty">🛍️<br><br>No market orders yet.<br><br><button class="back" onclick="location.href=\'/market.html\'">Start Shopping</button></div>';return}el.innerHTML=list.map(o=>'<article class="order"><div class="head"><div><div class="ref">'+esc(o.order_ref)+'</div><div class="meta">'+new Date(o.created_at).toLocaleString()+'<br>'+esc(o.delivery_name)+' • '+esc(o.delivery_phone)+'<br>'+esc(o.delivery_address)+'</div></div><span class="status">'+esc(o.status)+'</span></div><div class="price">GH₵'+Number(o.total||0).toFixed(2)+'</div><div class="meta">Payment: '+esc(o.payment_method)+' • '+esc(o.payment_status)+(o.supplier_delivery?' • Supplier delivery':'')+'</div></article>').join('')}catch(e){document.getElementById('list').innerHTML='<div class="empty">Could not load your market orders. Please try again.</div>'}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}load()</script></body></html>
