<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b0b"><title>DGM Agent Store</title><style>
:root{--bg:#050b0b;--card:#0b1515;--muted:#89a29a;--green:#25d366}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,rgba(37,211,102,.14),transparent 32%),#050b0b;color:#fff;font:14px Arial}.wrap{max-width:900px;margin:auto;padding:22px 16px 50px}.brand{font-weight:900;color:var(--green);letter-spacing:.08em}.hero,.card{background:linear-gradient(180deg,#0d1b19,#091311);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:20px;margin-top:14px}.hero h1{font-size:30px;margin:10px 0 6px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.product{padding:15px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:#07100f}.price{font-size:20px;font-weight:900;color:var(--green);margin:10px 0}.btn{display:block;text-align:center;text-decoration:none;background:var(--green);color:#031008;padding:11px;border-radius:11px;font-weight:900}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:rgba(37,211,102,.1);color:var(--green);font-size:10px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="brand">DGM • DHE GENIUS MEDIA</div><div id="app"><div class="card">Loading store…</div></div></div><script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=v=>'GH₵'+Number(v||0).toFixed(2);
async function load(){const slug=new URLSearchParams(location.search).get('slug');if(!slug){$('app').innerHTML='<div class="card">Store link is missing.</div>';return}try{const r=await fetch('/api/public/agent-store/'+encodeURIComponent(slug));const d=await r.json();if(!r.ok)throw Error(d.message||'Store not found');const s=d.store,wa=String(s.whatsapp||'').replace(/\D/g,'');$('app').innerHTML='<div class="hero"><span class="tag">DGM AGENT STORE</span><h1>'+esc(s.name)+'</h1><p class="muted">'+esc(s.bio)+'</p><a class="btn" target="_blank" href="https://wa.me/233'+esc(wa.replace(/^0/,''))+'">Order on WhatsApp</a></div><div class="card"><h2>Services & Pricing</h2><div class="grid">'+(s.pricing.length?s.pricing.map(p=>'<div class="product"><b>'+esc(p.network||p.service)+'</b><div>'+esc(p.capacity)+' GB Data</div><div class="price">'+money(p.sale_price)+'</div><a class="btn" target="_blank" href="https://wa.me/233'+esc(wa.replace(/^0/,''))+'?text='+encodeURIComponent('Hello '+s.name+', I want '+p.capacity+'GB '+p.network+' data.')+'">Order</a></div>').join(''):'<div class="muted">This agent has not published pricing yet.</div>')+'</div></div><div class="card muted">Powered by DGM • Stay Connected. Stay Genius.</div>'}catch(e){$('app').innerHTML='<div class="card">Store unavailable: '+esc(e.message)+'</div>'}}load();
</script></body></html>
