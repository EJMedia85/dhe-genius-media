<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06100d">
<title>DGM Agent Store</title>
<style>
:root{--bg:#050b09;--panel:#0b1512;--line:rgba(255,255,255,.08);--muted:#91a79d;--green:#25d366;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,rgba(37,211,102,.18),transparent 34%),linear-gradient(180deg,#050b09,#020605);color:#fff;font:14px Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:22px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px 18px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.06em;color:#f2fff8;cursor:pointer}.brand:before{content:"DG";display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#25d366,#128c7e);color:#031008;font-size:15px;font-weight:1000;box-shadow:0 8px 25px rgba(37,211,102,.2)}.brand small{display:block;color:#8da49a;font-size:9px;letter-spacing:.14em;margin-top:4px}.toplinks{display:flex;gap:8px}.pill,.btn{border:1px solid var(--line);border-radius:13px;padding:11px 14px;color:#fff;text-decoration:none;font-weight:800;background:rgba(255,255,255,.045);cursor:pointer;transition:transform .18s,border-color .18s}.pill:hover,.btn:hover{transform:translateY(-1px);border-color:rgba(37,211,102,.35)}.primary{background:linear-gradient(135deg,var(--green),#1da85a);color:#031008;border:0}.hero{position:relative;overflow:hidden;margin-top:22px;padding:clamp(23px,4vw,42px);border:1px solid rgba(37,211,102,.2);border-radius:28px;background:radial-gradient(circle at 90% 10%,rgba(37,211,102,.2),transparent 32%),linear-gradient(135deg,rgba(37,211,102,.13),rgba(255,255,255,.025));display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;box-shadow:0 24px 60px rgba(0,0,0,.18)}.tag{display:inline-flex;padding:7px 10px;border-radius:99px;background:rgba(37,211,102,.1);border:1px solid rgba(37,211,102,.16);color:var(--green);font-size:10px;font-weight:900;letter-spacing:.06em}.hero h1{font-size:clamp(29px,4vw,43px);line-height:1.08;letter-spacing:-.04em;margin:14px 0 9px;overflow-wrap:anywhere}.muted{color:var(--muted);line-height:1.65}.hero-side{text-align:right;min-width:155px}.section{margin-top:17px;padding:clamp(16px,2.5vw,24px);border:1px solid var(--line);border-radius:23px;background:linear-gradient(145deg,rgba(12,25,20,.96),rgba(6,14,11,.96));box-shadow:0 14px 38px rgba(0,0,0,.12)}.section h2{margin:0 0 15px;font-size:18px;letter-spacing:-.02em}.networks{display:flex;gap:9px;flex-wrap:wrap}.network{padding:10px 15px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer;font-weight:800;color:#d7e7df;transition:all .18s}.network.active{background:rgba(37,211,102,.13);border-color:rgba(37,211,102,.42);color:var(--green);box-shadow:0 0 0 3px rgba(37,211,102,.04)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.product{position:relative;padding:18px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(155deg,#0e1e18,#07100d);cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;min-width:0}.product:hover{transform:translateY(-2px);border-color:rgba(37,211,102,.3)}.product.selected{border-color:var(--green);box-shadow:0 0 0 1px rgba(37,211,102,.25),0 12px 30px rgba(0,0,0,.16)}.gb{font-size:24px;font-weight:950;letter-spacing:-.03em}.price{font-size:20px;font-weight:950;color:var(--green);margin-top:10px}.sub{font-size:10px;color:#82978e;margin-top:5px}.product:after{content:"";position:absolute;right:13px;top:13px;width:7px;height:7px;border-radius:50%;background:rgba(37,211,102,.45)}.checkout .summary{position:sticky;top:14px;height:max-content}.footer{padding:16px 0;border-top:1px solid var(--line);letter-spacing:.04em}.status{line-height:1.55}.checkout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.form{display:grid;gap:11px}.field label{display:block;color:#9db1a8;font-size:11px;margin:0 0 6px}.field input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#07100d;color:#fff;outline:none}.field input:focus{border-color:rgba(37,211,102,.5)}.summary{padding:16px;border-radius:17px;background:#07110d;border:1px solid var(--line)}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;color:#a9bbb3}.total{font-size:24px;font-weight:900;color:#fff;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}.status{margin-top:11px;padding:12px;border-radius:12px;background:rgba(37,211,102,.08);color:#b9d9ca;display:none}.status.show{display:block}.status.error{background:rgba(255,107,107,.1);color:#ffb0b0}.help{display:flex;gap:9px;flex-wrap:wrap}.loginbox{display:none}.loginbox.show{display:block}.footer{text-align:center;color:#60766b;font-size:10px;margin-top:20px}.empty{padding:25px;text-align:center;color:var(--muted)}.store-tools{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;margin:0 0 14px}.store-tools input,.store-tools select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#07100d;color:#fff;outline:none}.promo-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;margin-top:14px;border:1px solid rgba(37,211,102,.18);border-radius:15px;background:linear-gradient(90deg,rgba(37,211,102,.12),rgba(18,140,126,.06));color:#dff7e9}.promo-banner strong{color:var(--green)}.share-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.share-row button{font-size:11px;padding:9px 11px}.@media(max-width:760px){.store-tools{grid-template-columns:1fr}.hero,.checkout{grid-template-columns:1fr}.hero-side{text-align:left;min-width:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.checkout .summary{position:static}}@media(max-width:430px){.hero h1{font-size:29px}.wrap{padding-left:11px;padding-right:11px}.top{align-items:flex-start}.brand{font-size:11px;letter-spacing:.02em}.brand:before{width:36px;height:36px;border-radius:12px}.toplinks{gap:5px}.pill{padding:9px 10px;font-size:11px}.product{padding:14px}.gb{font-size:21px}.section{border-radius:18px}}
</style></head>
<body><div class="wrap"><div class="top"><div class="brand" onclick="location.href='/dashboard.html'"><span id="brandStoreName">DGM Agent Store</span><small>STAY CONNECTED. STAY GENIUS.</small></div></div><div id="app"><div class="section empty">Loading store…</div></div></div>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));const money=v=>"GH₵"+Number(v||0).toFixed(2);let store=null,selected=null,currentNetwork="MTN";const slug=new URLSearchParams(location.search).get("slug")||"";
async function api(url,o={}){const r=await fetch(url,{credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/json",...(o.headers||{})},...o});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(d.message||"Request failed"),{status:r.status,data:d});return d}
function networks(){return [...new Set((store?.pricing||[]).map(x=>x.network))]}
function render(){const brandName=$("brandStoreName");if(brandName)brandName.textContent=store?.name||"DGM Agent Store";const ps=(store?.pricing||[]).filter(x=>x.network===currentNetwork);$("app").innerHTML="<section class=\"hero\"><div><span class=\"tag\">✦ OFFICIAL DGM AGENT STORE</span><h1>"+esc(store.name)+"</h1><p class=\"muted\">"+esc(store.bio||"Your trusted place for fast, reliable mobile data bundles.")+"</p><div class=\"help\"><a class=\"btn primary\" href=\"#buy\">Shop Data Bundles&nbsp; ↗</a>"+(store.whatsapp?"<a class=\"btn\" target=\"_blank\" rel=\"noopener\" href=\"https://wa.me/233"+esc(String(store.whatsapp).replace(/\\D/g,"").replace(/^0/,""))+"\">WhatsApp Support</a>":"")+"</div></div><div class=\"hero-side\"><div class=\"tag\">✓ DGM AGENT STORE</div><h2 style=\"margin:12px 0 4px;font-size:22px\">"+esc(store.agent_code||"Agent")+"</h2><div class=\"sub\">Secure Paystack checkout</div><div class=\"sub\">MTN • Telecel • AirtelTigo</div></div></section><section class=\"section\" id=\"buy\"><h2>Choose Your Network</h2><div class=\"networks\">"+networks().map(n=>"<button class=\"network "+(n===currentNetwork?"active":"")+"\" onclick=\"selectNetwork('"+esc(n)+"')\">"+esc(n)+"</button>").join("")+"</div></section><section class=\"section\"><h2>Available Bundles</h2><div class=\"grid\">"+(ps.length?ps.map((p,i)=>"<div class=\"product "+(selected&&selected.network===p.network&&selected.capacity===p.capacity?"selected":"")+"\" onclick=\"selectBundle("+i+")\"><div class=\"gb\">"+esc(p.capacity)+" GB</div><div class=\"muted\">"+esc(p.network)+" Data</div><div class=\"price\">"+money(p.sale_price)+"</div><div class=\"sub\">Secure customer price</div></div>").join(""):"<div class=\"empty\">No bundles published for this network yet.</div>")+"</div></section><section class=\"section\"><h2>Checkout</h2><div class=\"status show\" style=\"margin:0 0 14px\">Secure Paystack checkout: pay using the payment methods displayed by Paystack. No DGM account or wallet funding is required. Agent commission is credited only after successful data delivery.</div><div class=\"checkout\"><div class=\"form\"><div class=\"field\"><label>Recipient phone number</label><input id=\"phone\" inputmode=\"numeric\" maxlength=\"10\" placeholder=\"0241234567\"></div><div class=\"field\"><label>Email for Paystack receipt</label><input id=\"email\" type=\"email\" autocomplete=\"email\" placeholder=\"you@example.com\"></div><div class=\"field\"><label>Promo code (optional)</label><input id=\"promo\" maxlength=\"40\" placeholder=\"Enter promo code\"></div><div id=\"loginbox\" class=\"loginbox\"><div class=\"status show\">You can pay securely through Paystack without creating a DGM account.</div><div class=\"help\" style=\"margin-top:10px\"><a class=\"btn primary\" href=\"/data.html\">Return to DGM Home</a></div></div></div><div class=\"summary\"><div class=\"row\"><span>Selected bundle</span><b id=\"sumBundle\">None</b></div><div class=\"row\"><span>Network</span><b id=\"sumNetwork\">—</b></div><div class=\"row\"><span>Recipient</span><b id=\"sumPhone\">—</b></div><div class=\"row\"><span>Price</span><b id=\"sumPrice\">GH₵0.00</b></div><div class=\"total\" id=\"sumTotal\">GH₵0.00</div><button class=\"btn primary\" style=\"width:100%;margin-top:12px\" onclick=\"checkout()\">Confirm & Pay</button><div id=\"status\" class=\"status\"></div></div></div></section><section class=\"section\"><h2>How it works</h2><div class=\"muted\">Choose a bundle → enter the recipient number and receipt email → complete payment on Paystack → DGM verifies payment and submits the order. Agent commission is credited after successful delivery. Failed orders follow DGM’s refund review process.</div></section><div class=\"footer\">Powered by DHE GENIUS MEDIA • Stay Connected. Stay Genius. • 24/7</div>";updateSummary()}
function renderProducts(){const grid=$("productGrid");if(!grid)return;const q=($("bundleSearch")?.value||"").trim().toLowerCase();let rows=(store?.pricing||[]).filter(p=>p.network===currentNetwork&&((String(p.capacity)+" GB "+p.network+" "+money(p.sale_price)).toLowerCase().includes(q)));const sort=$("bundleSort")?.value||"default";if(sort==="price-asc")rows.sort((a,b)=>Number(a.sale_price)-Number(b.sale_price));else if(sort==="price-desc")rows.sort((a,b)=>Number(b.sale_price)-Number(a.sale_price));else if(sort==="size-asc")rows.sort((a,b)=>Number(a.capacity)-Number(b.capacity));else if(sort==="size-desc")rows.sort((a,b)=>Number(b.capacity)-Number(a.capacity));grid.innerHTML=rows.length?rows.map(p=>{const i=(store?.pricing||[]).filter(x=>x.network===currentNetwork).indexOf(p);return "<div class=\\"product "+(selected&&selected.network===p.network&&selected.capacity===p.capacity?"selected":"")+"\\" onclick=\\"selectBundle("+i+")\\"><div class=\\"gb\\">"+esc(p.capacity)+" GB</div><div class=\\"muted\\">"+esc(p.network)+" Data</div><div class=\\"price\\">"+money(p.sale_price)+"</div><div class=\\"sub\\">Secure customer price</div></div>"}).join(""):"<div class=\\"empty\\">No matching bundles. Try another search or network.</div>"}
function shareStore(){const url=location.href;const title=(store?.name||"DGM Agent Store")+" — Data Bundles";if(navigator.share){navigator.share({title,text:"Shop data bundles at "+title,url}).catch(()=>{})}else copyStore()}
async function copyStore(){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(location.href);else{const t=document.createElement("textarea");t.value=location.href;document.body.appendChild(t);t.select();const ok=document.execCommand("copy");t.remove();if(!ok)throw Error("Copy is not supported by this browser.")}const b=document.querySelector(".share-row button:last-child");if(b){const prev=b.textContent;b.textContent="Link Copied ✓";setTimeout(()=>b.textContent=prev,1800)}}catch(e){alert("Copy the store link from your browser address bar to share it.")}}
function selectNetwork(n){currentNetwork=n;selected=null;render()}
function selectBundle(i){const ps=(store?.pricing||[]).filter(x=>x.network===currentNetwork);selected=ps[i]||null;render();document.getElementById("buy")?.scrollIntoView({behavior:"smooth",block:"start"})}
function updateSummary(){if(!selected)return;const phone=$("phone");if($("sumBundle"))$("sumBundle").textContent=selected.capacity+" GB";if($("sumNetwork"))$("sumNetwork").textContent=selected.network;if($("sumPrice"))$("sumPrice").textContent=money(selected.sale_price);if($("sumTotal"))$("sumTotal").textContent=money(selected.sale_price);if(phone)phone.oninput=()=>{$("sumPhone").textContent=phone.value}}
function status(msg,error=false){const e=$("status");if(!e)return;e.textContent=msg;e.className="status show"+(error?" error":"")}
async function checkout(){if(!selected){status("Select a bundle first.",true);return}const phone=$("phone")?.value.trim()||"",email=$("email")?.value.trim()||"",promo=$("promo")?.value.trim()||"";if(!/^0\d{9}$/.test(phone)){status("Enter a valid Ghana recipient number.",true);return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){status("Enter a valid email for your Paystack receipt.",true);return}status("Creating secure Paystack order…");try{const d=await api("/api/public/agent-store/"+encodeURIComponent(slug)+"/guest-order",{method:"POST",body:JSON.stringify({network:selected.network,capacity:selected.capacity,phone,promo_code:promo})});const p=await api("/api/guest-payments/initialize",{method:"POST",body:JSON.stringify({orderRef:d.order.order_ref,guestToken:d.guest_token,email})});if(p.alreadyPaid){location.href="/guest-order.html#ref="+encodeURIComponent(d.order.order_ref)+"&token="+encodeURIComponent(d.guest_token);return}location.href=p.authorization_url}catch(e){status(e.message||"Could not start Paystack checkout.",true)}}
async function pollOrder(ref){for(let i=0;i<12;i++){await new Promise(r=>setTimeout(r,2500));try{const d=await api("/api/public/agent-store/"+encodeURIComponent(slug)+"/order/"+encodeURIComponent(ref));const o=d.order;if(o.status==="Completed"){status("✓ Data delivered successfully. Order "+ref);return}if(["Failed","Refunded"].includes(o.status)){status("Order failed. Your DGM Wallet has been refunded.",true);return}status("Order "+ref+" is processing…")}catch{}}}
async function load(){if(!slug){$("app").innerHTML="<div class=\"section empty\">Store link is missing.</div>";return}try{const d=await api("/api/public/agent-store/"+encodeURIComponent(slug));store=d.store;currentNetwork=networks()[0]||"MTN";render()}catch(e){$("app").innerHTML="<div class=\"section empty\">Store unavailable: "+esc(e.message)+"</div>"}}load();
</script></body></html>
