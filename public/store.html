ckout .summary{position:sticky;top:14px;height:max-content}.footer{padding:16px 0;border-top:1px solid var(--line);letter-spacing:.04em}.status{line-height:1.55}.checkout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.form{display:grid;gap:11px}.field label{display:block;color:#9db1a8;font-size:11px;margin:0 0 6px}.field input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#07100d;color:#fff;outline:none}.field input:focus{border-color:rgba(37,211,102,.5)}.summary{padding:16px;border-radius:17px;background:#07110d;border:1px solid var(--line)}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;color:#a9bbb3}.total{font-size:24px;font-weight:900;color:#fff;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}.status{margin-top:11px;padding:12px;border-radius:12px;background:rgba(37,211,102,.08);color:#b9d9ca;display:none}.status.show{display:block}.status.error{background:rgba(255,107,107,.1);color:#ffb0b0}.help{display:flex;gap:9px;flex-wrap:wrap}.loginbox{display:none}.loginbox.show{display:block}.footer{text-align:center;color:#60766b;font-size:10px;margin-top:20px}.empty{padding:25px;text-align:center;color:var(--muted)}.store-tools{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;margin:0 0 14px}.store-tools input,.store-tools select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#07100d;color:#fff;outline:none}.promo-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;margin-top:14px;border:1px solid rgba(37,211,102,.18);border-radius:15px;background:linear-gradient(90deg,rgba(37,211,102,.12),rgba(18,140,126,.06));color:#dff7e9}.promo-banner strong{color:var(--green)}.store-banner{display:block;width:100%;max-height:210px;object-fit:cover;border-radius:18px;margin:0 0 16px;border:1px solid var(--line)}.store-logo{width:54px;height:54px;object-fit:cover;border-radius:15px;border:1px solid rgba(37,211,102,.28);margin-bottom:10px}.share-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.share-row button{font-size:11px;padding:9px 11px}.@media(max-width:760px){.store-tools{grid-template-columns:1fr}.hero,.checkout{grid-template-columns:1fr}.hero-side{text-align:left;min-width:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.checkout .summary{position:static}}@media(max-width:430px){.hero h1{font-size:29px}.wrap{padding-left:11px;padding-right:11px}.top{align-items:flex-start}.brand{font-size:11px;letter-spacing:.02em}.brand:before{width:36px;height:36px;border-radius:12px}.toplinks{gap:5px}.pill{padding:9px 10px;font-size:11px}.product{padding:14px}.gb{font-size:21px}.section{border-radius:18px}}

/* Mobile: keep the desktop visual style while fitting the phone screen */
@media(max-width:760px){
  .wrap{width:100%;max-width:100%;padding:16px 12px 36px}
  .top{gap:8px}
  .brand{font-size:14px}
  .brand:before{width:40px;height:40px}
  .hero{padding:22px 18px;gap:16px}
  .hero h1{font-size:clamp(28px,7vw,36px)}
  .hero-side{text-align:left}
  .section{padding:18px 14px;border-radius:19px}
  .section h2{font-size:20px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .product{padding:16px 13px;border-radius:16px}
  .gb{font-size:24px}
  .price{font-size:clamp(17px,5vw,22px);overflow-wrap:anywhere}
  .muted{font-size:14px;line-height:1.55}
  .network{padding:11px 14px;font-size:14px}
  .field label{font-size:13px}
  .field input{font-size:16px;padding:14px}
  .btn{padding:12px 13px}
  .checkout{grid-template-columns:minmax(0,1fr);gap:12px}
  .checkout .summary{position:static}
  .store-tools{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:380px){
  .wrap{padding-left:9px;padding-right:9px}
  .hero{padding:19px 14px}
  .product{padding:14px 10px}
  .gb{font-size:22px}
  .price{font-size:17px}
}

/* Hero/header spacing polish: clearer hierarchy on desktop and mobile */
.hero>div:first-child{min-width:0}
.hero-side{min-width:190px;padding:18px;border:1px solid rgba(37,211,102,.16);border-radius:20px;background:rgba(3,12,8,.34);overflow-wrap:anywhere}
.hero-side .tag{white-space:normal;line-height:1.4}
.hero-side h2{overflow-wrap:anywhere;letter-spacing:.015em}

.help,.share-row{align-items:stretch}
.help .btn,.share-row .btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;text-align:center;line-height:1.35}
@media(max-width:760px){
  .top{align-items:center;flex-wrap:wrap;padding-bottom:14px}
  .brand{min-width:0;flex:1;font-size:13px;line-height:1.35;letter-spacing:.035em}
  .brand small{font-size:9px;line-height:1.4}

  .hero{grid-template-columns:minmax(0,1fr);gap:18px;margin-top:16px;padding:20px 16px;border-radius:22px}
  .hero h1{margin-top:12px;font-size:clamp(27px,7vw,34px);line-height:1.12}
  .hero .muted{margin:0 0 15px}
  .help{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
  .help .btn{width:100%}
  .share-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .share-row .btn{width:100%;padding:11px 8px;font-size:12px}
  .hero-side{width:100%;min-width:0;padding:15px;border-radius:16px;text-align:left}
  .hero-side h2{font-size:20px!important;margin:9px 0 5px!important}

}
@media(max-width:380px){
  .toplinks{width:100%;justify-content:flex-start}

  .hero-side{padding:13px}
}

</style><script>
/* Some shared layouts inject mobile navigation after page load; remove only the five-item DGM bar. */
(function(){
  const labels=["home","data","wallet","orders","account"];
  function hideDgmBottomNav(){
    document.querySelectorAll("body *").forEach(el=>{
      if(!el || el===document.body || el.children.length>8) return;
      const text=(el.innerText||el.textContent||"").replace(/\\s+/g," ").trim().toLowerCase();
      if(!text || text.length>180 || !labels.every(label=>new RegExp("\\b"+label+"\\b").test(text))) return;
      const r=el.getBoundingClientRect(), s=getComputedStyle(el);
      if((s.position==="fixed"||s.position==="sticky"||r.bottom>=innerHeight-12) && r.height<180 && r.width>innerWidth*.45){
        el.style.setProperty("display","none","important");
        el.style.setProperty("visibility","hidden","important");
        el.style.setProperty("pointer-events","none","important");
      }
    });
  }
  hideDgmBottomNav();
  new MutationObserver(hideDgmBottomNav).observe(document.documentElement,{childList:true,subtree:true});
  window.addEventListener("resize",hideDgmBottomNav,{passive:true});
})();
</script></head>

const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));const money=v=>"GH₵"+Number(v||0).toFixed(2);let store=null,selected=null,currentNetwork="MTN",currentOrder=null;const slug=new URLSearchParams(location.search).get("slug")||"";

function networks(){return [...new Set((store?.pricing||[]).map(x=>x.network))]}

e or price…\" oninput=\"renderProducts()\"><select id=\"bundleSort\" onchange=\"renderProducts()\" aria-label=\"Sort bundles\"><option value=\"default\">Recommended order</option><option value=\"price-asc\">Price: low to high</option><option value=\"price-desc\">Price: high to low</option><option value=\"size-asc\">Data size: low to high</option><option value=\"size-desc\">Data size: high to low</option></select></div><div id=\"productGrid\" class=\"grid\">"+(ps.length?ps.map((p,i)=>"<div class=\"product "+(selected&&selected.network===p.network&&selected.capacity===p.capacity?"selected":"")+"\" onclick=\"selectBundle("+i+")\"><div class=\"gb\">"+esc(p.capacity)+" GB</div><div class=\"muted\">"+esc(p.network)+" Data</div><div class=\"price\">"+money(p.sale_price)+"</div>"+(topSales>0&&Number(p.completed_sales||0)===topSales?"<div class=\"best-badge\">★ BEST SELLER</div>":"")+"<div class=\"sub\">Secure customer price</div></div>").join(""):"<div class=\"empty\">No bundles published for this network yet.</div>")+"</div></section><section class=\"section\"><h2>Checkout</h2><div class=\"checkout\"><div class=\"form\"><div class=\"field\"><label>Recipient phone number</label><input id=\"phone\" inputmode=\"numeric\" maxlength=\"10\" placeholder=\"0241234567\"></div><div class=\"field\"><label>Promo code (optional)</label><input id=\"promo\" maxlength=\"40\" placeholder=\"Enter promo code\"></div><div id=\"loginbox\" class=\"loginbox\"><div class=\"status show\">You can pay securely through Paystack without creating a DGM account.</div><div class=\"help\" style=\"margin-top:10px\"><a class=\"btn primary\" href=\"/data.html\">Return to DGM Home</a></div></div></div><div class=\"summary\"><div class=\"row\"><span>Selected bundle</span><b id=\"sumBundle\">None</b></div><div class=\"row\"><span>Network</span><b id=\"sumNetwork\">—</b></div><div class=\"row\"><span>Recipient</span><b id=\"sumPhone\">—</b></div><div class=\"row\"><span>Price</span><b id=\"sumPrice\">GH₵0.00</b></div><div class=\"total\" id=\"sumTotal\">GH₵0.00</div><button class=\"btn primary\" style=\"width:100%;margin-top:12px\" id=\"confirmOrderButton\" onclick=\"createStoreOrder()\">Confirm Order</button></div></div></section><section class=\"section\" id=\"paymentBox\" style=\"display:none;scroll-margin-top:16px\"><h2>Choose Payment Method</h2><p class=\"muted\">Pay securely with Paystack. Data delivery starts only after DGM verifies your payment.</p><div id=\"createdOrderInfo\" class=\"status show\"></div><div id=\"status\" class=\"status\"></div><div class=\"form\" style=\"margin-top:14px\"><div class=\"field\"><label for=\"email\">Email for Paystack receipt (Paystack checkout only)</label><input id=\"email\" type=\"email\" autocomplete=\"email\" placeholder=\"you@example.com\"></div><button id=\"paystackButton\" class=\"btn primary\" type=\"button\" onclick=\"payStoreWithPaystack()\">🔵 Pay with Paystack</button><div style=\"border-top:1px solid var(--line);margin:5px 0\"></div><div class=\"field\"><label for=\"momoPhone\">Mobile Money phone number</label><input id=\"momoPhone\" type=\"tel\" inputmode=\"numeric\" maxlength=\"10\" autocomplete=\"tel\" placeholder=\"0241234567\"></div><div class=\"field\"><label for=\"momoProvider\">Mobile Money network</label><select id=\"momoProvider\"><option value=\"mtn\">MTN MoMo</option><option value=\"atl\">AT Money (AirtelTigo)</option><option value=\"vod\">Telecel Cash</option></select></div><p class=\"muted\">Approve the payment request on your phone. If Paystack asks for an authorization code, enter it below. Never share your MoMo PIN with DGM.</p><button id=\"momoButton\" class=\"btn\" type=\"button\" onclick=\"payStoreWithMobileMoney()\">📲 Pay with Mobile Money</button><div id=\"otpWrap\" style=\"display:none\"><div class=\"field\"><label for=\"otpInput\">Paystack authorization code</label><input id=\"otpInput\" type=\"text\" inputmode=\"numeric\" autocomplete=\"one-time-code\" maxlength=\"8\" placeholder=\"Enter code\"> function renderProducts(){
 const grid=$("productGrid");if(!grid)return;
 const q=($("bundleSearch")?.value||"").trim().toLowerCase();
 let rows=(store?.pricing||[]).filter(p=>p.network===currentNetwork&&((String(p.capacity)+" GB "+p.network+" "+money(p.sale_price)).toLowerCase().includes(q)));
 const sort=$("bundleSort")?.value||"default";
 if(sort==="price-asc")rows.sort((a,b)=>Number(a.sale_price)-Number(b.sale_price));
 else if(sort==="price-desc")rows.sort((a,b)=>Number(b.sale_price)-Number(a.sale_price));
 else if(sort==="size-asc")rows.sort((a,b)=>Number(a.capacity)-Number(b.capacity));
 else if(sort==="size-desc")rows.sort((a,b)=>Number(b.capacity)-Number(a.capacity));
 const topSales=Math.max(0,...rows.map(p=>Number(p.completed_sales||0)));grid.innerHTML=rows.length?rows.map(p=>{const i=(store?.pricing||[]).filter(x=>x.network===currentNetwork).indexOf(p);return "<div class=\"product "+(selected&&selected.network===p.network&&selected.capacity===p.capacity?"selected":"")+"\" onclick=\"selectBundle("+i+")\"><div class=\"gb\">"+esc(p.capacity)+" GB</div><div class=\"muted\">"+esc(p.network)+" Data</div><div class=\"price\">"+money(p.sale_price)+"</div><div class=\"sub\">Secure customer price</div></div>"}).join(""):"<div class=\"empty\">No matching bundles. Try another search or network.</div>";
}

async function payStoreWithPaystack(){
 if(!currentOrder){status("Confirm your order first.",true);return}
 const email=$("email")?.value.trim()||"";
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){status("Enter a valid email for your Paystack receipt.",true);$("email").focus();return}
 const button=$("paystackButton");button.disabled=true;button.textContent="Opening Paystack…";
 try{
  const p=await api("/api/guest-payments/initialize",{method:"POST",body:JSON.stringify({orderRef:currentOrder.order_ref,guestToken:currentOrder.guest_token,email})});
  if(p.alreadyPaid){location.href="/guest-order.html#ref="+encodeURIComponent(currentOrder.order_ref)+"&token="+encodeURIComponent(currentOrder.guest_token);return}
  if(!p.authorization_url)throw new Error("Paystack did not return a payment link.");
  location.href=p.authorization_url;
 }catch(e){status(e.message||"Could not start Paystack checkout.",true);button.disabled=false;button.textContent="🔵 Pay with Paystack"}
}
async function payStoreWithMobileMoney(){
 if(!currentOrder){status("Confirm your order first.",true);return}
 const phone=$("momoPhone")?.value.trim().replace(/\s+/g,"")||"",provider=$("momoProvider")?.value||"";
 if(!validStorePhone(phone)){status("Enter a valid Ghana Mobile Money phone number.",true);$("momoPhone")?.focus();return}
 const button=$("momoButton");button.disabled=true;button.textContent="Sending payment request…";
 try{
  const result=await api("/api/guest-payments/mobile-money",{method:"POST",body:JSON.stringify({orderRef:currentOrder.order_ref,guestToken:currentOrder.guest_token,phone,provider})});
  if(result.alreadyPaid){location.href="/guest-order.html#ref="+encodeURIComponent(currentOrder.order_ref)+"&token="+encodeURIComponent(currentOrder.guest_token);return}
  if(!result.reference)throw new Error("Paystack did not return a Mobile Money reference.");
  currentOrder.paystack_reference=result.reference;
  if(String(result.status||"").toLowerCase()==="send_otp"){
   $("otpWrap").style.display="block";$("otpHelp").textContent=result.display_text||"Paystack is requesting an authorization code. Enter only the code provided for this payment.";$("otpInput").focus();status(result.display_text||"Paystack requires an authorization code.");button.textContent="Payment request sent ✓";return
  }
  status(result.display_text||"Approve the Mobile Money request on your phone.");location.href=storeTrackingUrl(result.reference);
 }catch(e){status(e.message||"Could not start Mobile Money payment.",true);button.disabled=false;button.textContent="📲 Pay with Mobile Money"}
}
async function submitStoreOtp(){
 if(!currentOrder?.paystack_reference){status("Payment reference is missing. Start Mobile Money payment again.",true);return}
 const otp=$("otpInput").value.trim(),button=$("otpButton");
 if(!/^\d{4,8}$/.test(otp)){status("Enter the authorization code supplied by Paystack.",true);$("otpInput").focus();return}
 button.disabled=true;button.textContent="Submitting code…";
 try{
  const result=await api("/api/guest-payments/mobile-money/otp",{method:"POST",body:JSON.stringify({orderRef:currentOrder.order_ref,guestToken:currentOrder.guest_token,reference:currentOrder.paystack_reference,otp})});
  $("otpInput").value="";
  if(String(result.status||"").toLowerCase()==="send_otp"){$("otpHelp").textContent=result.display_text||"Paystack still requires an authorization code.";status(result.display_text||"Paystack still requires an authorization code.");return}
  status(result.display_text||"Authorization submitted. Checking payment status.");location.href=storeTrackingUrl(result.reference||currentOrder.paystack_reference);
 }catch(e){status(e.message||"Could not submit the authorization code.",true)}
 finally{button.disabled=false;button.textContent="Submit authorization code"}
}
async function pollOrder(ref){for(let i=0;i<12;i++){await new Promise(r=>setTimeout(r,2500));try{const d=await api("/api/public/agent-store/"+encodeURIComponent(slug)+"/order/"+encodeURIComponent(ref));const o=d.order;if(o.status==="Completed"){status("✓ Data delivered successfully. Order "+ref);return}if(["Failed","Refunded"].includes(o.status)){status("Order failed. Your DGM Wallet has been refunded.",true);return}status("Order "+ref+" is processing…")}catch{}}}
async function load(){if(!slug){$("app").innerHTML="<div class=\"section empty\">Store link is missing.</div>";return}try{const d=await api("/api/public/agent-store/"+encodeURIComponent(slug));store=d.store;currentNetwork=networks()[0]||"MTN";render()}catch(e){$("app").innerHTML="<div class=\"section empty\">Store unavailable: "+esc(e.message)+"</div>"}}load();
