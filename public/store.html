<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06100d">
<title>DGM Agent Store</title>
<style>
:root{--bg:#050b09;--panel:#0b1512;--line:rgba(255,255,255,.08);--muted:#91a79d;--green:#25d366;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,rgba(37,211,102,.18),transparent 34%),linear-gradient(180deg,#050b09,#020605);color:#fff;font:14px Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px 16px 55px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:.09em;color:var(--green);cursor:pointer}.brand small{display:block;color:#8da49a;font-size:9px;letter-spacing:.14em;margin-top:4px}.toplinks{display:flex;gap:8px}.pill,.btn{border:1px solid var(--line);border-radius:12px;padding:10px 13px;color:#fff;text-decoration:none;font-weight:800;background:rgba(255,255,255,.045);cursor:pointer}.primary{background:linear-gradient(135deg,var(--green),#1da85a);color:#031008;border:0}.hero{margin-top:18px;padding:28px;border:1px solid rgba(37,211,102,.15);border-radius:26px;background:linear-gradient(135deg,rgba(37,211,102,.12),rgba(255,255,255,.035));display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.tag{display:inline-flex;padding:6px 9px;border-radius:99px;background:rgba(37,211,102,.1);color:var(--green);font-size:10px;font-weight:900}.hero h1{font-size:36px;margin:11px 0 7px}.muted{color:var(--muted);line-height:1.55}.hero-side{text-align:right}.section{margin-top:16px;padding:20px;border:1px solid var(--line);border-radius:22px;background:rgba(9,20,16,.82)}.section h2{margin:0 0 14px;font-size:18px}.networks{display:flex;gap:8px;flex-wrap:wrap}.network{padding:9px 13px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer;font-weight:800;color:#fff}.network.active{background:rgba(37,211,102,.14);border-color:rgba(37,211,102,.35);color:var(--green)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.product{padding:16px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#0c1915,#07100d);cursor:pointer}.product.selected{border-color:var(--green);box-shadow:0 0 0 1px rgba(37,211,102,.2)}.gb{font-size:22px;font-weight:900}.price{font-size:18px;font-weight:900;color:var(--green);margin-top:8px}.sub{font-size:10px;color:#71877e;margin-top:4px}.checkout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.form{display:grid;gap:11px}.field label{display:block;color:#9db1a8;font-size:11px;margin:0 0 6px}.field input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#07100d;color:#fff;outline:none}.field input:focus{border-color:rgba(37,211,102,.5)}.summary{padding:16px;border-radius:17px;background:#07110d;border:1px solid var(--line)}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;color:#a9bbb3}.total{font-size:24px;font-weight:900;color:#fff;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}.status{margin-top:11px;padding:12px;border-radius:12px;background:rgba(37,211,102,.08);color:#b9d9ca;display:none}.status.show{display:block}.status.error{background:rgba(255,107,107,.1);color:#ffb0b0}.help{display:flex;gap:9px;flex-wrap:wrap}.loginbox{display:none}.loginbox.show{display:block}.footer{text-align:center;color:#60766b;font-size:10px;margin-top:20px}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:760px){.hero,.checkout{grid-template-columns:1fr}.hero-side{text-align:left}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.hero h1{font-size:29px}.wrap{padding-left:11px;padding-right:11px}}
</style></head>
<body><div class="wrap"><div class="top"><div class="brand" onclick="location.href='/dashboard.html'">DGM • DHE GENIUS MEDIA<small>STAY CONNECTED. STAY GENIUS.</small></div><div class="toplinks"><a class="pill" href="/login.html">Sign In</a><a class="pill primary" href="/register.html">Create Account</a></div></div><div id="app"><div class="section empty">Loading store…</div></div></div>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));const money=v=>"GH₵"+Number(v||0).toFixed(2);let store=null,selected=null,currentNetwork="MTN";const slug=new URLSearchParams(location.search).get("slug")||"";
async function api(url,o={}){const r=await fetch(url,{credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/json",...(o.headers||{})},...o});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(d.message||"Request failed"),{status:r.status,data:d});return d}
function networks(){return [...new Set((store?.pricing||[]).map(x=>x.network))]}
function render(){const ps=(store?.pricing||[]).filter(x=>x.network===currentNetwork);$("app").innerHTML="<section class=\"hero\"><div><span class=\"tag\">DGM AGENT STORE</span><h1>"+esc(store.name)+"</h1><p class=\"muted\">"+esc(store.bio||"Reliable data bundles, powered by DHE GENIUS MEDIA.")+"</p><div class=\"help\"><a class=\"btn primary\" href=\"#buy\">Buy Data</a>"+(store.whatsapp?"<a class=\"btn\" target=\"_blank\" href=\"https://wa.me/233"+esc(String(store.whatsapp).replace(/\D/g,"").replace(/^0/,""))+"\">WhatsApp Support</a>":"")+"</div></div><div class=\"hero-side\"><div class=\"tag\">AGENT "+esc(store.agent_code||"")+"</div><div class=\"sub\">Secure DGM checkout</div></div></section><section class=\"section\" id=\"buy\"><h2>Choose Your Network</h2><div class=\"networks\">"+networks().map(n=>"<button class=\"network "+(n===currentNetwork?"active":"")+"\" onclick=\"selectNetwork('"+esc(n)+"')\">"+esc(n)+"</button>").join("")+"</div></section><section class=\"section\"><h2>Available Bundles</h2><div class=\"grid\">"+(ps.length?ps.map((p,i)=>"<div class=\"product "+(selected&&selected.network===p.network&&selected.capacity===p.capacity?"selected":"")+"\" onclick=\"selectBundle("+i+")\"><div class=\"gb\">"+esc(p.capacity)+" GB</div><div class=\"muted\">"+esc(p.network)+" Data</div><div class=\"price\">"+money(p.sale_price)+"</div><div class=\"sub\">Secure customer price</div></div>").join(""):"<div class=\"empty\">No bundles published for this network yet.</div>")+"</div></section><section class=\"section\"><h2>Checkout</h2><div class=\"checkout\"><div class=\"form\"><div class=\"field\"><label>Recipient phone number</label><input id=\"phone\" inputmode=\"numeric\" maxlength=\"10\" placeholder=\"0241234567\"></div><div class=\"field\"><label>Promo code (optional)</label><input id=\"promo\" maxlength=\"40\" placeholder=\"Enter promo code\"></div><div id=\"loginbox\" class=\"loginbox\"><div class=\"status show\">Sign in to DGM or create an account to pay securely from your DGM Wallet.</div><div class=\"help\" style=\"margin-top:10px\"><a class=\"btn primary\" href=\"/login.html\">Sign In</a><a class=\"btn\" href=\"/register.html\">Create Account</a></div></div></div><div class=\"summary\"><div class=\"row\"><span>Selected bundle</span><b id=\"sumBundle\">None</b></div><div class=\"row\"><span>Network</span><b id=\"sumNetwork\">—</b></div><div class=\"row\"><span>Recipient</span><b id=\"sumPhone\">—</b></div><div class=\"row\"><span>Price</span><b id=\"sumPrice\">GH₵0.00</b></div><div class=\"total\" id=\"sumTotal\">GH₵0.00</div><button class=\"btn primary\" style=\"width:100%;margin-top:12px\" onclick=\"checkout()\">Confirm & Pay</button><div id=\"status\" class=\"status\"></div></div></div></section><section class=\"section\"><h2>How it works</h2><div class=\"muted\">Choose a bundle → enter the recipient number → pay from your DGM Wallet → DGM delivers the data automatically. Failed deliveries are automatically refunded.</div></section><div class=\"footer\">Powered by DHE GENIUS MEDIA • Stay Connected. Stay Genius. • 24/7</div>";updateSummary()}
function selectNetwork(n){currentNetwork=n;selected=null;render()}
function selectBundle(i){const ps=(store?.pricing||[]).filter(x=>x.network===currentNetwork);selected=ps[i]||null;render();document.getElementById("buy")?.scrollIntoView({behavior:"smooth",block:"start"})}
function updateSummary(){if(!selected)return;const phone=$("phone");if($("sumBundle"))$("sumBundle").textContent=selected.capacity+" GB";if($("sumNetwork"))$("sumNetwork").textContent=selected.network;if($("sumPrice"))$("sumPrice").textContent=money(selected.sale_price);if($("sumTotal"))$("sumTotal").textContent=money(selected.sale_price);if(phone)phone.oninput=()=>{$("sumPhone").textContent=phone.value}}
function status(msg,error=false){const e=$("status");if(!e)return;e.textContent=msg;e.className="status show"+(error?" error":"")}
async function checkout(){if(!selected){status("Select a bundle first.",true);return}const phone=$("phone")?.value.trim()||"",promo=$("promo")?.value.trim()||"";if(!/^0\d{9}$/.test(phone)){status("Enter a valid Ghana recipient number.",true);return}status("Processing secure checkout…");try{const d=await api("/api/public/agent-store/"+encodeURIComponent(slug)+"/order",{method:"POST",body:JSON.stringify({network:selected.network,capacity:selected.capacity,phone,promo_code:promo})});status(d.message+" Order: "+d.order_ref);if(d.status==="Processing")pollOrder(d.order_ref)}catch(e){if(e.status===401||e.status===403){$("loginbox")?.classList.add("show");status("Please sign in to complete this checkout.",true)}else if((e.message||"").toLowerCase().includes("insufficient dgm wallet")){$("loginbox")?.classList.add("show");status(e.message+" Use Add Money in your DGM account, then return here.",true)}else status(e.message||"Checkout failed.",true)}}
async function pollOrder(ref){for(let i=0;i<12;i++){await new Promise(r=>setTimeout(r,2500));try{const d=await api("/api/public/agent-store/"+encodeURIComponent(slug)+"/order/"+encodeURIComponent(ref));const o=d.order;if(o.status==="Completed"){status("✓ Data delivered successfully. Order "+ref);return}if(["Failed","Refunded"].includes(o.status)){status("Order failed. Your DGM Wallet has been refunded.",true);return}status("Order "+ref+" is processing…")}catch{}}}
async function load(){if(!slug){$("app").innerHTML="<div class=\"section empty\">Store link is missing.</div>";return}try{const d=await api("/api/public/agent-store/"+encodeURIComponent(slug));store=d.store;currentNetwork=networks()[0]||"MTN";render()}catch(e){$("app").innerHTML="<div class=\"section empty\">Store unavailable: "+esc(e.message)+"</div>"}}load();
</script></body></html>
