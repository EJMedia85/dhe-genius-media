<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DGM Group Susu</title><style>:root{--bg:#06110d;--card:#0d1d18;--green:#25d366;--text:#f4fff8;--muted:#8ea89c;--border:rgba(255,255,255,.09);--red:#ff6b75}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,rgba(37,211,102,.1),transparent 32%),var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#25d366,#087c3a);display:grid;place-items:center;font-weight:900}.brand small,.muted{color:var(--muted)}.btn{border:1px solid var(--border);background:#10231b;color:#fff;padding:11px 14px;border-radius:12px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--green);color:#06110d}.danger{background:rgba(255,107,117,.12);color:#ff9da4}.hero,.card{border:1px solid var(--border);border-radius:20px;padding:20px;background:linear-gradient(180deg,rgba(16,37,30,.98),rgba(8,21,16,.98));margin-bottom:14px}.hero{background:linear-gradient(135deg,#158c48,#075a35)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#b9cec4;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border-radius:10px;background:#07140f;border:1px solid var(--border);color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:12px;border-radius:13px;background:rgba(255,255,255,.05)}.stat strong{display:block;font-size:19px}.tx,.member,.period{padding:12px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px}.positive{color:var(--green)}.negative{color:var(--red)}.pill{padding:4px 8px;border-radius:99px;background:rgba(37,211,102,.1);color:var(--green);font-size:10px;font-weight:900}.hide{display:none}.notice{padding:11px;border-radius:12px;background:rgba(37,211,102,.07);margin:10px 0}@media(max-width:700px){.grid,.stats{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo">DGM</div><div><b>Group Susu</b><br><small>Rotating savings</small></div></div><a class="btn" href="/savings.html">← Savings</a></div><div id="list"><div class="hero"><h1>👥 Group Susu</h1><p>Create a group or join with an invite code.</p><button class="btn primary" onclick="show('create')">Create Group</button> <button class="btn" onclick="show('join')">Join Group</button></div><div id="groups" class="grid"></div></div><div id="create" class="card hide"><h2>Create Group</h2><div class="grid"><div class="field"><label>Group name</label><input id="gn"></div><div class="field"><label>Icon</label><input id="gi" value="👥"></div><div class="field"><label>Members</label><input id="gc" type="number" min="2"></div><div class="field"><label>Contribution per member</label><input id="ga" type="number"></div><div class="field"><label>Frequency</label><select id="gf"><option>Weekly</option><option>Daily</option><option>Monthly</option></select></div><div class="field"><label>Start date</label><input id="gs" type="date"></div><div class="field"><label>End date</label><input id="ge" type="date"></div><div class="field"><label>Admin code</label><input id="gcode" type="password" maxlength="8"></div></div><button class="btn primary" onclick="createGroup()">Create</button> <button class="btn" onclick="show('list')">Cancel</button><div id="gm" class="muted"></div></div><div id="join" class="card hide"><h2>Join Group</h2><input id="invite" placeholder="DGM-SUSU-XXXXXXXX"><button class="btn primary" onclick="join()">Join</button> <button class="btn" onclick="show('list')">Cancel</button><div id="jm" class="muted"></div></div><div id="detail" class="hide"><div class="hero"><h1 id="title"></h1><p id="meta"></p><div class="stats"><div class="stat"><strong id="col"></strong><small>Collected</small></div><div class="stat"><strong id="paid"></strong><small>Members paid</small></div><div class="stat"><strong id="next"></strong><small>Next payout</small></div></div></div><div class="grid"><div class="card"><h3>Members</h3><div id="members"></div></div><div class="card"><h3>Rotation</h3><div id="periods"></div><div id="rotate"></div></div><div class="card"><h3>Contribute</h3><input id="ca" type="number" placeholder="Amount"><div class="field"><input id="cp" type="password" placeholder="DGM account password"></div><button class="btn primary" onclick="contribute()">Contribute</button><div id="cm" class="muted"></div></div><div class="card"><h3>Contribution History</h3><div id="contribs"></div></div></div></div></div><script>
const $=i=>document.getElementById(i),E=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function api(u,o={}){let r=await fetch(u,{credentials:"include",cache:"no-store",headers:{"Content-Type":"application/json"},...o}),j=await r.json().catch(()=>({success:false,message:"Server error"}));if(r.status===401)location="/login.html";if(!r.ok||j.success===false)throw Error(j.message||"Request failed");return j}function show(x){["list","create","join","detail"].forEach(i=>$(i).classList.toggle("hide",i!==x));if(x==="list")loadGroups()}async function loadGroups(){try{let j=await api("/api/susu/groups");$("groups").innerHTML=j.groups.length?j.groups.map(g=>'<div class="card"><h3>'+E(g.icon)+" "+E(g.name)+'</h3><p class="muted">'+g.member_count+" / "+g.member_limit+" members • GH₵"+Number(g.contribution_amount).toFixed(2)+" "+E(g.frequency)+'</p><p>Collected: GH₵'+Number(g.collected).toFixed(2)+'</p><button class="btn primary" onclick="openGroup('+g.id+')">Open Group</button></div>').join(""):'<div class="card">No groups yet.</div>'}catch(e){$("groups").textContent=e.message}}async function createGroup(){try{let j=await api("/api/susu/groups",{method:"POST",body:JSON.stringify({name:$("gn").value,icon:$("gi").value,member_limit:$("gc").value,contribution_amount:$("ga").value,frequency:$("gf").value,start_date:$("gs").value,end_date:$("ge").value,admin_code:$("gcode").value})});$("gm").textContent="Created. Invite code: "+j.invite_code;openGroup(j.group.id)}catch(e){$("gm").textContent=e.message}}async function join(){try{let j=await api("/api/susu/join",{method:"POST",body:JSON.stringify({invite_code:$("invite").value})});$("jm").textContent=j.message;openGroup(j.group_id)}catch(e){$("jm").textContent=e.message}}let gid=0,role="";async function openGroup(id){gid=id;show("detail");try{let j=await api("/api/susu/groups/"+id);role=j.viewer_role;$("title").textContent=j.group.icon+" "+j.group.name;$("meta").textContent=j.members.length+" / "+j.group.member_limit+" members • GH₵"+Number(j.group.contribution_amount).toFixed(2)+" "+j.group.frequency;$("col").textContent="GH₵"+Number(j.collected).toFixed(2);let paid=new Set(j.contributions.map(x=>x.customer_id));$("paid").textContent=paid.size+" / "+j.members.length;$("next").textContent=(j.periods.find(p=>p.status==="Upcoming")||{}).recipient_name||"—";$("members").innerHTML=j.members.map(m=>'<div class="member"><b>'+E(m.name)+'</b><span class="pill">'+(paid.has(m.customer_id)?"PAID":"DUE")+'</span></div>').join("");$("periods").innerHTML=j.periods.map(p=>'<div class="period"><b>Period '+p.period_no+'</b><br><span class="muted">'+E(p.recipient_name||"Awaiting rotation")+" • GH₵"+Number(p.amount).toFixed(2)+" • "+E(p.status)+'</span>'+(role==="Admin"&&p.recipient_customer_id&&p.status!=="Paid"?'<br><button class="btn primary" onclick="payout('+p.id+')">Complete Payout</button>':"")+"</div>").join("");$("rotate").innerHTML=role==="Admin"?'<button class="btn" onclick="rotate()">Assign Rotation</button>':"";$("contribs").innerHTML=j.contributions.map(c=>'<div class="tx"><span>'+E(c.member_name)+'<br><small>'+E(c.reference)+'</small></span><b class="positive">+GH₵'+Number(c.amount).toFixed(2)+'</b></div>').join("")||"<p class=muted>No contributions yet.</p>"}catch(e){alert(e.message)}}async function contribute(){try{let j=await api("/api/susu/groups/"+gid+"/contribute",{method:"POST",body:JSON.stringify({amount:$("ca").value,password:$("cp").value})});$("cm").textContent=j.message+" Ref: "+j.reference;openGroup(gid)}catch(e){$("cm").textContent=e.message}}async function rotate(){let c=prompt("Group admin code");if(!c)return;try{let j=await api("/api/susu/groups/"+gid+"/rotate",{method:"POST",body:JSON.stringify({admin_code:c})});alert(j.message);openGroup(gid)}catch(e){alert(e.message)}}async function payout(pid){let c=prompt("Group admin code");if(!c)return;try{let j=await api("/api/susu/groups/"+gid+"/payout/"+pid,{method:"POST",body:JSON.stringify({admin_code:c})});alert(j.message+" Ref: "+j.reference);openGroup(gid)}catch(e){alert(e.message)}}loadGroups();
</script></body></html>
