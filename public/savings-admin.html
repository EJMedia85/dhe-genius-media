<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DGM Savings Management</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07131f;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.muted{color:#8da5b8;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#0d2030;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px}.value{font-size:28px;font-weight:900;margin-top:6px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px 6px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left}input,select{padding:9px;border-radius:8px;border:1px solid #294052;background:#081725;color:#fff;width:100%;margin-bottom:7px}button{padding:9px 12px;border:0;border-radius:8px;font-weight:800;cursor:pointer}.credit{background:#20d889}.debit{background:#d95362;color:#fff}.back{color:#cfe0ea;text-decoration:none}@media(max-width:700px){.grid{grid-template-columns:1fr}table{font-size:10px}}</style></head>
<body><div class="wrap"><div class="top"><div><h2 style="margin:0">DHE GENIUS MEDIA • SAVINGS / SUSU</h2><div class="muted">Admin management</div></div><a class="back" href="/admin.html">← Admin Dashboard</a></div>
<div class="grid"><div class="card"><div class="muted">Active Savings Accounts</div><div class="value" id="accounts">—</div></div><div class="card"><div class="muted">Total Savings Held</div><div class="value" id="total">GH₵—</div></div></div>
<div class="card" style="margin-top:14px;overflow:auto"><div id="status" class="muted" style="margin-bottom:10px"></div><table><thead><tr><th>Customer</th><th>Phone</th><th>Balance</th><th>Plan</th><th>Admin Credit/Debit</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script>
const money=n=>"GH₵"+Number(n||0).toFixed(2);
async function load(){const r=await fetch("/api/admin/savings",{credentials:"include"});if(r.status===401){location.href="/admin-login.html";return}const j=await r.json();if(!r.ok||!j.success){document.getElementById("status").textContent=j.message||"Could not load savings.";return}document.getElementById("accounts").textContent=j.summary.accounts;document.getElementById("total").textContent=money(j.summary.totalSavings);document.getElementById("rows").innerHTML=j.accounts.map(a=>'<tr><td>'+a.name+'<br><span class="muted">'+a.email+'</span></td><td>'+a.phone+'</td><td>'+money(a.balance)+'</td><td>'+a.frequency+'<br>'+money(a.contribution_amount)+'</td><td><input id="amt-'+a.customer_id+'" type="number" min="0.01" step="0.01" placeholder="Amount"><input id="note-'+a.customer_id+'" placeholder="Note"><button class="credit" onclick="adjust('+a.customer_id+',\'credit\')">Credit</button> <button class="debit" onclick="adjust('+a.customer_id+',\'debit\')">Debit</button></td></tr>').join("")||'<tr><td colspan="5" class="muted">No savings accounts yet.</td></tr>'}
async function adjust(id,action){const amount=document.getElementById("amt-"+id).value;const note=document.getElementById("note-"+id).value;const r=await fetch("/api/admin/savings/"+id+"/adjust",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({amount,action,note})});const j=await r.json();alert(j.message||(j.success?"Savings updated.":"Could not update savings."));if(j.success)load()}
load();
</script></body></html>
