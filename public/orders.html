<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f0e">

  <title>Orders — DHE GENIUS MEDIA</title>

  <style>
    :root {
      --bg: #070b0a;
      --card: #101614;
      --card-2: #151c19;
      --border: rgba(255,255,255,.08);
      --text: #f5f7f6;
      --muted: #8f9a96;
      --green: #25d366;
      --green-dark: #128c7e;
      --yellow: #f5b942;
      --red: #ff5c5c;
      --blue: #4da3ff;
      --shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top right,
          rgba(37,211,102,.08),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);
      min-height: 100vh;
      padding-bottom: 90px;
    }

    button {
      font-family: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 18px 18px 15px;

      background: rgba(7,11,10,.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;

      border-radius: 13px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          var(--green),
          var(--green-dark)
        );

      color: #06100b;
      font-weight: 900;
      font-size: 16px;

      box-shadow:
        0 8px 25px rgba(37,211,102,.2);
    }

    .brand-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .brand-sub {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .back-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);

      width: 40px;
      height: 40px;

      border-radius: 12px;

      cursor: pointer;
      font-size: 19px;
    }

    /* =========================
       PAGE
    ========================= */

    .container {
      width: min(100% - 30px, 720px);
      margin: 0 auto;
    }

    .page-header {
      padding: 27px 0 20px;
    }

    .page-header h1 {
      font-size: 28px;
      line-height: 1.15;
      font-weight: 850;
      letter-spacing: -.7px;
    }

    .page-header p {
      color: var(--muted);
      margin-top: 7px;
      font-size: 13px;
    }

    /* =========================
       SUMMARY
    ========================= */

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;

      margin-bottom: 22px;
    }

    .summary-card {
      background: linear-gradient(
        145deg,
        rgba(255,255,255,.055),
        rgba(255,255,255,.02)
      );

      border: 1px solid var(--border);
      border-radius: 17px;

      padding: 15px 12px;

      box-shadow: var(--shadow);
    }

    .summary-number {
      font-size: 21px;
      font-weight: 850;
    }

    .summary-label {
      color: var(--muted);
      font-size: 10px;
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .summary-card.active .summary-number {
      color: var(--yellow);
    }

    .summary-card.completed .summary-number {
      color: var(--green);
    }

    /* =========================
       FILTERS
    ========================= */

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;

      padding-bottom: 4px;
      margin-bottom: 16px;

      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex: 0 0 auto;

      border: 1px solid var(--border);
      background: var(--card);

      color: var(--muted);

      padding: 9px 15px;
      border-radius: 30px;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;
    }

    .filter-btn.active {
      background: rgba(37,211,102,.12);
      color: var(--green);
      border-color: rgba(37,211,102,.28);
    }

    /* =========================
       ORDER CARD
    ========================= */

    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .order-card {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.018)
        );

      border: 1px solid var(--border);
      border-radius: 20px;

      padding: 17px;

      box-shadow: var(--shadow);

      animation: fadeIn .3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .order-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .service-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .service-icon {
      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background: rgba(37,211,102,.1);
      border: 1px solid rgba(37,211,102,.15);

      font-size: 21px;
    }

    .service-name {
      font-weight: 800;
      font-size: 14px;
    }

    .service-network {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      padding: 6px 9px;

      border-radius: 30px;

      font-size: 10px;
      font-weight: 800;

      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status.processing,
    .status.pending {
      color: var(--yellow);
      background: rgba(245,185,66,.09);
    }

    .status.completed {
      color: var(--green);
      background: rgba(37,211,102,.09);
    }

    .status.failed {
      color: var(--red);
      background: rgba(255,92,92,.09);
    }

    .status.cancelled {
      color: var(--muted);
      background: rgba(255,255,255,.06);
    }

    /* =========================
       ORDER BODY
    ========================= */

    .order-ref {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-top: 17px;

      padding: 11px 12px;

      background: rgba(0,0,0,.2);
      border-radius: 12px;

      border: 1px solid rgba(255,255,255,.045);
    }

    .ref-label {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .ref-value {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 13px;

      margin-top: 17px;
    }

    .detail-label {
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 5px;
    }

    .detail-value {
      font-size: 12px;
      font-weight: 700;
    }

    .amount {
      color: var(--green);
      font-size: 15px;
      font-weight: 850;
    }

    /* =========================
       PAYMENT LINE
    ========================= */

    .payment-line {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-top: 17px;
      padding-top: 14px;

      border-top: 1px solid var(--border);
    }

    .payment-status {
      display: flex;
      align-items: center;
      gap: 7px;

      font-size: 11px;
      font-weight: 700;
    }

    .payment-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .payment-paid {
      color: var(--green);
    }

    .payment-paid .payment-dot {
      background: var(--green);
      box-shadow: 0 0 8px rgba(37,211,102,.5);
    }

    .payment-unpaid {
      color: var(--yellow);
    }

    .payment-unpaid .payment-dot {
      background: var(--yellow);
    }

    .payment-reference {
      color: var(--muted);
      font-size: 9px;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =========================
       EMPTY STATE
    ========================= */

    .empty {
      text-align: center;
      padding: 55px 25px;

      border: 1px dashed rgba(255,255,255,.1);
      border-radius: 20px;

      background: rgba(255,255,255,.02);
    }

    .empty-icon {
      width: 62px;
      height: 62px;

      margin: 0 auto 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background: rgba(37,211,102,.08);

      font-size: 27px;
    }

    .empty h3 {
      font-size: 17px;
      margin-bottom: 7px;
    }

    .empty p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .shop-btn {
      margin-top: 18px;

      border: none;
      background: linear-gradient(
        135deg,
        var(--green),
        var(--green-dark)
      );

      color: #06100b;

      padding: 12px 19px;

      border-radius: 12px;

      font-size: 12px;
      font-weight: 850;

      cursor: pointer;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 55px 20px;

      color: var(--muted);
      font-size: 12px;
    }

    .spinner {
      width: 28px;
      height: 28px;

      border: 3px solid rgba(255,255,255,.1);
      border-top-color: var(--green);

      border-radius: 50%;

      animation: spin .8s linear infinite;

      margin-bottom: 13px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;

      z-index: 30;

      height: 72px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      background: rgba(9,13,12,.94);

      border-top: 1px solid var(--border);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .nav-item {
      border: none;
      background: transparent;

      color: var(--muted);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 5px;

      cursor: pointer;

      font-size: 10px;
      font-weight: 700;
    }

    .nav-icon {
      font-size: 18px;
    }

    .nav-item.active {
      color: var(--green);
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 700px) {
      .container {
        width: min(100% - 50px, 850px);
      }

      .page-header {
        padding-top: 35px;
      }

      .page-header h1 {
        font-size: 32px;
      }

      .summary-grid {
        gap: 14px;
      }

      .order-card {
        padding: 20px;
      }

      .bottom-nav {
        width: 600px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);

        border-radius: 20px 20px 0 0;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="topbar">

    <div class="brand">

      <div class="brand-logo">
        DGM
      </div>

      <div>
        <div class="brand-name">
          DHE GENIUS MEDIA
        </div>

        <div class="brand-sub">
          Stay Connected. Stay Genius.
        </div>
      </div>

    </div>

    <button
      class="back-btn"
      onclick="goBack()"
      aria-label="Go back"
    >
      ←
    </button>

  </header>


  <main class="container">

    <!-- PAGE HEADER -->

    <section class="page-header">

      <h1>My Orders</h1>

      <p>
        Track your purchases and service requests in one place.
      </p>

    </section>


    <!-- SUMMARY -->

    <section class="summary-grid">

      <div class="summary-card">

        <div
          class="summary-number"
          id="totalOrders"
        >
          0
        </div>

        <div class="summary-label">
          Total
        </div>

      </div>


      <div class="summary-card active">

        <div
          class="summary-number"
          id="processingOrders"
        >
          0
        </div>

        <div class="summary-label">
          Processing
        </div>

      </div>


      <div class="summary-card completed">

        <div
          class="summary-number"
          id="completedOrders"
        >
          0
        </div>

        <div class="summary-label">
          Completed
        </div>

      </div>

    </section>


    <!-- FILTERS -->

    <div class="filters">

      <button
        class="filter-btn active"
        data-filter="all"
        onclick="setFilter('all', this)"
      >
        All Orders
      </button>

      <button
        class="filter-btn"
        data-filter="processing"
        onclick="setFilter('processing', this)"
      >
        Processing
      </button>

      <button
        class="filter-btn"
        data-filter="completed"
        onclick="setFilter('completed', this)"
      >
        Completed
      </button>

      <button
        class="filter-btn"
        data-filter="failed"
        onclick="setFilter('failed', this)"
      >
        Failed
      </button>

    </div>


    <!-- ORDERS -->

    <section id="ordersContainer">

      <div class="loading">

        <div class="spinner"></div>

        Loading your orders...

      </div>

    </section>

  </main>


  <!-- BOTTOM NAV -->

  <nav class="bottom-nav">

    <button
      class="nav-item"
      onclick="location.href='/dashboard.html'"
    >
      <span class="nav-icon">⌂</span>
      Dashboard
    </button>


    <button
      class="nav-item"
      onclick="location.href='/data.html'"
    >
      <span class="nav-icon">▣</span>
      Buy Data
    </button>


    <button
      class="nav-item active"
      onclick="location.href='/orders.html'"
    >
      <span class="nav-icon">◷</span>
      Orders
    </button>


    <button
      class="nav-item"
      onclick="location.href='/account.html'"
    >
      <span class="nav-icon">◉</span>
      Account
    </button>

  </nav>


  <script>

    let orders = [];
    let currentFilter = "all";


    /* =========================
       LOAD ORDERS
    ========================= */

    async function loadOrders() {

      const container =
        document.getElementById("ordersContainer");

      try {

        const response =
          await fetch("/api/orders", {
            credentials: "include"
          });


        if (response.status === 401) {

          window.location.href = "/login.html";

          return;
        }


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Unable to load orders."
          );
        }


        /*
         Your API may return:

         [
           {...},
           {...}
         ]

         OR:

         {
           orders: [...]
         }
        */

        if (Array.isArray(data)) {

          orders = data;

        } else if (Array.isArray(data.orders)) {

          orders = data.orders;

        } else if (Array.isArray(data.data)) {

          orders = data.data;

        } else {

          orders = [];

        }


        updateSummary();

        renderOrders();

      } catch (error) {

        console.error(
          "ORDER LOAD ERROR:",
          error
        );


        container.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              ⚠️
            </div>

            <h3>
              Couldn't load orders
            </h3>

            <p>
              Please check your connection and try again.
            </p>

            <button
              class="shop-btn"
              onclick="loadOrders()"
            >
              Try Again
            </button>

          </div>

        `;

      }

    }


    /* =========================
       SUMMARY
    ========================= */

    function updateSummary() {

      document.getElementById(
        "totalOrders"
      ).textContent = orders.length;


      const processing =
        orders.filter(order => {

          const status =
            normalizeStatus(order.status);

          return (
            status === "processing" ||
            status === "pending"
          );

        }).length;


      const completed =
        orders.filter(order => {

          return (
            normalizeStatus(order.status)
            === "completed"
          );

        }).length;


      document.getElementById(
        "processingOrders"
      ).textContent = processing;


      document.getElementById(
        "completedOrders"
      ).textContent = completed;

    }


    /* =========================
       FILTER
    ========================= */

    function setFilter(
      filter,
      button
    ) {

      currentFilter = filter;


      document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {

          btn.classList.remove("active");

        });


      button.classList.add("active");


      renderOrders();

    }


    /* =========================
       RENDER
    ========================= */

    function renderOrders() {

      const container =
        document.getElementById(
          "ordersContainer"
        );


      let filtered = [...orders];


      if (currentFilter !== "all") {

        filtered =
          filtered.filter(order => {

            const status =
              normalizeStatus(
                order.status
              );

            return status === currentFilter;

          });

      }


      if (!filtered.length) {

        container.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              🧾
            </div>

            <h3>
              No orders found
            </h3>

            <p>
              Your purchases and service orders
              will appear here.
            </p>

            <button
              class="shop-btn"
              onclick="location.href='/data.html'"
            >
              Buy Data
            </button>

          </div>

        `;

        return;
      }


      /*
        Newest orders first.
      */

      filtered.sort(
        (a, b) =>
          new Date(
            b.created_at ||
            b.createdAt ||
            0
          ) -
          new Date(
            a.created_at ||
            a.createdAt ||
            0
          )
      );


      container.innerHTML = `

        <div class="orders-list">

          ${filtered
            .map(orderCard)
            .join("")}

        </div>

      `;

    }


    /* =========================
       ORDER CARD
    ========================= */

    function orderCard(order) {

      const status =
        normalizeStatus(
          order.status
        );


      const statusLabel =
        capitalize(
          status || "pending"
        );


      const service =
        order.service ||
        "Digital Service";


      const network =
        order.network ||
        "";


      const phone =
        order.phone ||
        order.recipient ||
        "—";


      const amount =
        Number(
          order.amount || 0
        );


      const reference =
        order.order_ref ||
        order.orderRef ||
        order.reference ||
        "—";


      const paymentStatus =
        normalizePayment(
          order.payment_status ||
          order.paymentStatus
        );


      const paymentReference =
        order.paystack_reference ||
        order.paystackReference ||
        "";


      const created =
        order.created_at ||
        order.createdAt;


      const date =
        formatDate(created);


      const icon =
        getServiceIcon(
          service
        );


      return `

        <article
          class="order-card"
        >

          <div class="order-top">

            <div class="service-info">

              <div class="service-icon">
                ${icon}
              </div>

              <div>

                <div class="service-name">
                  ${escapeHtml(service)}
                </div>

                <div class="service-network">
                  ${escapeHtml(network || "DGM Service")}
                </div>

              </div>

            </div>


            <span
              class="status ${statusClass(status)}"
            >
              ${escapeHtml(statusLabel)}
            </span>

          </div>


          <div class="order-ref">

            <span class="ref-label">
              Order Reference
            </span>

            <span class="ref-value">
              ${escapeHtml(reference)}
            </span>

          </div>


          <div class="details">

            <div>

              <div class="detail-label">
                Recipient
              </div>

              <div class="detail-value">
                ${escapeHtml(phone)}
              </div>

            </div>


            <div>

              <div class="detail-label">
                Amount
              </div>

              <div class="amount">
                GH₵${amount.toFixed(2)}
              </div>

            </div>


            <div>

              <div class="detail-label">
                Date
              </div>

              <div class="detail-value">
                ${escapeHtml(date)}
              </div>

            </div>


            <div>

              <div class="detail-label">
                Service
              </div>

              <div class="detail-value">
                ${escapeHtml(
                  service
                )}
              </div>

            </div>

          </div>


          <div class="payment-line">

            <div
              class="payment-status
                ${
                  paymentStatus === "paid"
                    ? "payment-paid"
                    : "payment-unpaid"
                }"
            >

              <span class="payment-dot"></span>

              ${
                paymentStatus === "paid"
                  ? "Payment confirmed"
                  : "Payment pending"
              }

            </div>


            ${
              paymentReference
                ? `
                  <div
                    class="payment-reference"
                    title="${escapeHtml(paymentReference)}"
                  >
                    ${escapeHtml(paymentReference)}
                  </div>
                `
                : `
                  <div class="payment-reference">
                    DHE GENIUS MEDIA
                  </div>
                `
            }

          </div>

        </article>

      `;

    }


    /* =========================
       STATUS HELPERS
    ========================= */

    function normalizeStatus(status) {

      const value =
        String(
          status || "Pending"
        )
        .trim()
        .toLowerCase();


      if (
        value.includes("complete") ||
        value === "success" ||
        value === "successful"
      ) {

        return "completed";

      }


      if (
        value.includes("fail") ||
        value.includes("cancel")
      ) {

        return value.includes("cancel")
          ? "cancelled"
          : "failed";

      }


      if (
        value.includes("process")
      ) {

        return "processing";

      }


      return "pending";

    }


    function normalizePayment(status) {

      const value =
        String(
          status || ""
        )
        .trim()
        .toLowerCase();


      if (
        value === "paid" ||
        value === "success" ||
        value === "successful"
      ) {

        return "paid";

      }


      return "pending";

    }


    function statusClass(status) {

      if (
        status === "completed"
      ) {

        return "completed";

      }


      if (
        status === "processing"
      ) {

        return "processing";

      }


      if (
        status === "failed"
      ) {

        return "failed";

      }


      if (
        status === "cancelled"
      ) {

        return "cancelled";

      }


      return "pending";

    }


    /* =========================
       SERVICE ICON
    ========================= */

    function getServiceIcon(service) {

      const value =
        String(service || "")
          .toLowerCase();


      if (
        value.includes("data")
      ) {

        return "📶";

      }


      if (
        value.includes("airtime")
      ) {

        return "📱";

      }


      if (
        value.includes("netflix")
      ) {

        return "🎬";

      }


      if (
        value.includes("dstv")
      ) {

        return "📺";

      }


      if (
        value.includes("music")
      ) {

        return "🎵";

      }


      if (
        value.includes("social")
      ) {

        return "🚀";

      }


      return "⚡";

    }


    /* =========================
       DATE
    ========================= */

    function formatDate(value) {

      if (!value) {
        return "—";
      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return String(value);

      }


      return date.toLocaleString(
        "en-GH",
        {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /* =========================
       SECURITY
    ========================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function capitalize(value) {

      if (!value) {
        return "";
      }


      return (
        value.charAt(0).toUpperCase() +
        value.slice(1)
      );

    }


    /* =========================
       NAVIGATION
    ========================= */

    function goBack() {

      if (
        document.referrer
      ) {

        history.back();

      } else {

        location.href =
          "/dashboard.html";

      }

    }


    /* =========================
       START
    ========================= */

    loadOrders();

  </script>
