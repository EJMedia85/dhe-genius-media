<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Account | DHE GENIUS MEDIA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top right,
          rgba(0, 153, 255, 0.25),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #06121f,
          #0b1d2e,
          #03111d
        );

      color: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 68px;
      height: 68px;

      margin: 0 auto 14px;

      border-radius: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 24px;
      font-weight: 900;

      background:
        linear-gradient(
          135deg,
          #00c6ff,
          #0072ff
        );

      box-shadow:
        0 12px 35px
        rgba(0, 136, 255, 0.35);
    }

    .brand h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .brand p {
      margin-top: 6px;
      color: #9db2c5;
      font-size: 14px;
    }

    .card {
      background:
        rgba(11, 29, 46, 0.88);

      border:
        1px solid
        rgba(255, 255, 255, 0.08);

      border-radius: 24px;

      padding: 28px;

      box-shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.35);

      backdrop-filter: blur(18px);
    }

    .card h2 {
      font-size: 22px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: #91a8ba;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      font-size: 13px;
      font-weight: 700;

      margin-bottom: 8px;

      color: #d9e7f1;
    }

    input {
      width: 100%;

      padding: 14px 15px;

      border-radius: 13px;

      border:
        1px solid
        rgba(255, 255, 255, 0.10);

      background:
        rgba(255, 255, 255, 0.055);

      color: white;

      outline: none;

      font-size: 15px;

      transition: 0.2s;
    }

    input:focus {
      border-color: #00aaff;

      box-shadow:
        0 0 0 3px
        rgba(0, 170, 255, 0.10);
    }

    input::placeholder {
      color: #71889a;
    }

    .password-note {
      margin-top: 6px;

      font-size: 11px;

      color: #7890a2;
    }

    button {
      width: 100%;

      border: none;

      padding: 15px;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #00c6ff,
          #0072ff
        );

      color: white;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      margin-top: 5px;

      box-shadow:
        0 12px 25px
        rgba(0, 114, 255, 0.25);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-bottom: 16px;

      padding: 12px 14px;

      border-radius: 12px;

      font-size: 13px;

      line-height: 1.5;
    }

    .message.error {
      display: block;

      background:
        rgba(255, 70, 70, 0.10);

      border:
        1px solid
        rgba(255, 70, 70, 0.25);

      color: #ff9c9c;
    }

    .message.success {
      display: block;

      background:
        rgba(0, 220, 130, 0.10);

      border:
        1px solid
        rgba(0, 220, 130, 0.25);

      color: #7ff0bd;
    }

    .login {
      text-align: center;

      margin-top: 20px;

      color: #91a8ba;

      font-size: 14px;
    }

    .login a {
      color: #00b7ff;

      font-weight: 800;

      text-decoration: none;
    }

    .footer {
      text-align: center;

      margin-top: 20px;

      color: #62798b;

      font-size: 11px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 22px;
        border-radius: 20px;
      }

      .brand h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="brand">

      <div class="logo">
        DGM
      </div>

      <h1>
        DHE GENIUS MEDIA
      </h1>

      <p>
        Stay Connected. Stay Genius.
      </p>

    </div>


    <section class="card">

      <h2>
        Create your account
      </h2>

      <p class="subtitle">
        Register to access the DGM customer dashboard.
      </p>


      <div
        id="message"
        class="message"
      ></div>


      <form id="registerForm">

        <div class="field">

          <label for="name">
            Full Name
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >

        </div>


        <div class="field">

          <label for="phone">
            Ghana Phone Number
          </label>

          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="0241234567"
            autocomplete="tel"
            required
          >

        </div>


        <div class="field">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            required
          >

          <div class="password-note">
            Minimum 8 characters.
          </div>

        </div>


        <div class="field">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Enter your password again"
            autocomplete="new-password"
            required
          >

        </div>


        <button
          type="submit"
          id="registerButton"
        >
          Create Account
        </button>

      </form>


      <div class="login">

        Already have an account?

        <a href="/login.html">
          Login
        </a>

      </div>

    </section>


    <div class="footer">
      © 2026 DHE GENIUS MEDIA • Accra - Spintex
    </div>

  </main>


  <script>

    const form =
      document.getElementById("registerForm");

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("registerButton");


    function showMessage(
      text,
      type
    ) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        button.disabled = true;

        button.textContent =
          "Creating account...";


        const data = {

          name:
            document
              .getElementById("name")
              .value
              .trim(),

          phone:
            document
              .getElementById("phone")
              .value
              .trim(),

          email:
            document
              .getElementById("email")
              .value
              .trim(),

          password:
            document
              .getElementById("password")
              .value,

          confirmPassword:
            document
              .getElementById("confirmPassword")
              .value

        };


        try {

          const response =
            await fetch(
              "/api/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify(data)
              }
            );


          const result =
            await response.json();


          if (!response.ok) {

            showMessage(
              result.message ||
              "Registration failed.",
              "error"
            );

            button.disabled = false;

            button.textContent =
              "Create Account";

            return;
          }


          showMessage(
            "Account created successfully. Opening your dashboard...",
            "success"
          );


          setTimeout(
            function() {

              window.location.href =
                "/dashboard.html";

            },
            1000
          );


        } catch (error) {

          console.error(error);

          showMessage(
            "Unable to connect to DGM server. Please try again.",
            "error"
          );

          button.disabled = false;

          button.textContent =
            "Create Account";
        }

      }
    );

  </script>

</body>
</html>
