    * {

    .brand h1 {

    .brand p {
      margin-top: 6px;
      color: #9db2c5;

    .card {

    .card h2 {

    }

    .subtitle {
      color: #91a8ba;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      font-size: 13px;
      font-weight: 700;

      margin-bottom: 8px;

      color: #d9e7f1;
    }

    input {
      width: 100%;

      padding: 14px 15px;

      border-radius: 13px;

      border:
        1px solid
        rgba(255, 255, 255, 0.10);

      background:
        rgba(3, 12, 19, 0.40);

      box-shadow:
        inset 0 1px 2px rgba(0, 0, 0, 0.16);

      color: white;

      outline: none;

      font-size: 15px;

      transition: 0.2s;
    }

    input:focus {
      border-color: rgba(37, 211, 102, 0.85);

      background: rgba(7, 25, 20, 0.58);

      box-shadow:
        0 0 0 3px rgba(37, 211, 102, 0.14),
        0 0 22px rgba(37, 211, 102, 0.06);
    }

    input::placeholder {
      color: #71889a;
    }

    .password-note {
      margin-top: 6px;

      font-size: 11px;

      color: #7890a2;
    }

    button {
      width: 100%;

      border: none;

      padding: 15px;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #25d366,
          #128c7e
        );

      color: white;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      margin-top: 5px;

      box-shadow:
        0 12px 25px
        rgba(18, 140, 126, 0.25);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-bottom: 16px;

      padding: 12px 14px;

      border-radius: 12px;

      font-size: 13px;

      line-height: 1.5;
    }

    .message.error {
      display: block;

      background:
        rgba(255, 70, 70, 0.10);

      border:
        1px solid
        rgba(255, 70, 70, 0.25);

      color: #ff9c9c;
    }

    .message.success {
      display: block;

      background:
        rgba(0, 220, 130, 0.10);

      border:
        1px solid
        rgba(0, 220, 130, 0.25);

      color: #7ff0bd;
    }

    .login {
      text-align: center;

      margin-top: 20px;

      color: #91a8ba;

      font-size: 14px;
    }

    .login a {
      color: #25d366;

      font-weight: 800;

      text-decoration: none;
    }

    .footer {
      text-align: center;

      margin-top: 20px;

      color: #62798b;

      font-size: 11px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 22px;
        border-radius: 20px;
      }

      .brand h1 {
        font-size: 21px;
      }
    }

<body>

  <main class="container">

    <div class="brand">

      <div class="logo">
        DGM
      </div>

      <h1>
        DHE GENIUS MEDIA
      </h1>

      <p>
        Stay Connected. Stay Genius.
      </p>

    </div>


    <section class="card">

      <h2>
        Create your account
      </h2>

      <p class="subtitle">
        Register to access the DGM customer dashboard.
      </p>


      <div
        id="message"
        class="message"
      ></div>


      <form id="registerForm">

        <div class="field">

          <label for="name">
            Full Name
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >

        </div>


        <div class="field">

          <label for="phone">
            Ghana Phone Number
          </label>

          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="0241234567"
            autocomplete="tel"
            required
          >

        </div>


        <div class="field">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="8"
            required
          >

          <div class="password-note">
            Minimum 8 characters.
          </div>

        </div>


        <div class="field">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Enter your password again"
            autocomplete="new-password"
            required
          >

        </div>


        <button
          type="submit"
          id="registerButton"
        >
          Create Account
        </button>

      </form>


      <div class="login">

        Already have an account?

        <a href="/login.html">
          Login
        </a>

      </div>

    </section>


    <div class="footer">
      © 2026 DHE GENIUS MEDIA • Accra - Spintex
    </div>

  </main>


  <script>

    const form =
      document.getElementById("registerForm");

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("registerButton");


    function showMessage(
      text,
      type
    ) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        button.disabled = true;

        button.textContent =
          "Creating account...";


        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (password.length < 8) {
          showMessage(
            "Your password must be at least 8 characters long.",
            "error"
          );
          button.disabled = false;
          button.textContent = "Create Account";
          return;
        }

        if (password !== confirmPassword) {
          showMessage(
            "Your passwords do not match.",
            "error"
          );
          button.disabled = false;
          button.textContent = "Create Account";
          return;
        }

        const data = {

          name:
            document
              .getElementById("name")
              .value
              .trim(),

          phone:
            document
              .getElementById("phone")
              .value
              .trim(),

          email:
            document
              .getElementById("email")
              .value
              .trim(),

          password: password,

          confirmPassword:
            document
              .getElementById("confirmPassword")
              .value

        };


        try {

          const response =
            await fetch(
              "/api/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify(data)
              }
            );


          const result =
            await response.json();


          if (!response.ok) {

            showMessage(
              result.message ||
              "Registration failed.",
              "error"
            );

            button.disabled = false;

            button.textContent =
              "Create Account";

            return;
          }


          showMessage(
            "Account created successfully. Taking you to sign in...",
            "success"
          );


          setTimeout(
            function() {

              window.location.href =
                "/login.html";

            },
            1000
          );


        } catch (error) {

          console.error(error);

          showMessage(
            "Unable to connect to DGM server. Please try again.",
            "error"
          );

          button.disabled = false;

          button.textContent =
            "Create Account";
        }

      }
    );

  </script>
