<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b0b"><title>DGM Social | DHE GENIUS MEDIA</title>
<style>
:root{--bg:#050b0b;--panel:#0b1515;--panel2:#102020;--line:rgba(255,255,255,.09);--text:#f4fff9;--muted:#8ca69b;--green:#25d366}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,rgba(37,211,102,.13),transparent 35%),linear-gradient(180deg,#050b0b,#07110f);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:13px max(15px,calc((100vw - 820px)/2));background:rgba(5,12,11,.95);border-bottom:1px solid var(--line)}.back{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:#fff;padding:10px 12px}.brand{flex:1}.brand b{display:block;font-size:14px;letter-spacing:.3px}.brand small{color:var(--muted);font-size:10px}.brand strong{color:var(--green)}.wrap{width:min(760px,100%);margin:auto;padding:20px 13px 60px}.hero{padding:22px 18px;border:1px solid rgba(37,211,102,.2);border-radius:22px;background:linear-gradient(130deg,rgba(37,211,102,.12),rgba(8,22,17,.9));margin-bottom:18px}.eyebrow{color:var(--green);font-size:10px;font-weight:900;letter-spacing:1.5px}.hero h1{font-size:29px;line-height:1.08;margin:9px 0}.hero p{font-size:12px;color:#b3c8bd;line-height:1.6;margin:0}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 14px}.filters button{flex:0 0 auto;border:1px solid var(--line);background:#0b1713;color:#a9bfb4;padding:9px 13px;border-radius:999px;font-size:11px;font-weight:800}.filters button.active{background:var(--green);color:#031008;border-color:var(--green)}.post{border:1px solid var(--line);background:linear-gradient(180deg,rgba(14,29,24,.98),rgba(7,17,14,.98));border-radius:19px;overflow:hidden;margin-bottom:14px;box-shadow:0 12px 35px rgba(0,0,0,.14)}.post-head{display:flex;align-items:center;gap:10px;padding:14px 15px 10px}.avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#49ef88,#0c8b56);color:#031008;font-weight:1000}.meta{flex:1;min-width:0}.meta b{font-size:12px}.meta small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:rgba(37,211,102,.1);color:var(--green);font-size:9px;font-weight:900;text-transform:uppercase}.pin{font-size:10px;color:#f6d875}.post-title{font-size:18px;line-height:1.25;padding:0 15px;margin:2px 0 8px}.post-body{white-space:pre-wrap;overflow-wrap:anywhere;color:#c4d6cd;line-height:1.65;font-size:13px;padding:0 15px 14px}.post-image{display:block;width:100%;max-height:580px;object-fit:cover;background:#06100b}.wallpaper-cta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;border-top:1px solid var(--line);color:var(--green);font-size:11px;font-weight:900}.post-stats{display:flex;justify-content:space-between;padding:11px 15px;color:var(--muted);font-size:10px;border-bottom:1px solid var(--line)}.actions{display:flex;gap:4px;padding:7px 9px}.actions button{flex:1;border:0;border-radius:10px;background:transparent;color:#a9bdb4;padding:10px 4px;font-size:11px;font-weight:850}.actions button:hover,.actions button.on{background:rgba(37,211,102,.1);color:var(--green)}.comments{padding:0 13px 13px}.comment-list{display:grid;gap:8px;margin:8px 0 12px}.comment{border-radius:11px;padding:10px;background:rgba(255,255,255,.035);font-size:11px}.comment b{display:block;margin-bottom:4px}.comment p{margin:0;color:#b6c8bf;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.comment-form{display:flex;gap:7px}.comment-form input{flex:1;min-width:0;background:#07110d;border:1px solid var(--line);border-radius:10px;color:#fff;padding:11px;font-size:11px}.comment-form button,.primary{border:0;background:var(--green);color:#031008;border-radius:10px;padding:10px 13px;font-size:11px;font-weight:900}.empty{padding:35px 15px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);font-size:12px;line-height:1.6}.notice{display:none;margin:0 0 12px;padding:12px;border-radius:12px;background:#311a12;border:1px solid #69402b;color:#ffcfad;font-size:11px}.loading{text-align:center;color:var(--muted);padding:30px;font-size:12px}
@media(min-width:700px){.wrap{padding-top:27px}.hero{padding:27px}.hero h1{font-size:35px}.post-title{font-size:21px}}
</style>
</head>
<body>
<header class="top"><button class="back" onclick="location.href='/dashboard.html'" aria-label="Back to dashboard">←</button><div class="brand"><b><strong>DGM</strong> SOCIAL</b><small>News · Memes · Wallpapers · Community</small></div><button class="back" onclick="location.href='/notifications.html'" aria-label="Notifications">♧</button></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">STAY CONNECTED. STAY GENIUS.</div><h1>Your feed.<br>Your vibe. 💚</h1><p>Catch up on DGM updates, enjoy memes, discover wallpapers and join the conversation. Content is published by DGM admins.</p></section>
<div id="notice" class="notice"></div>
<nav class="filters" aria-label="Feed categories">
<button class="active" data-category="" onclick="chooseCategory(this,'')">✨ For You</button>
<button data-category="news" onclick="chooseCategory(this,'news')">📰 News</button>
<button data-category="memes" onclick="chooseCategory(this,'memes')">😂 Memes</button>
<button data-category="wallpapers" onclick="chooseCategory(this,'wallpapers')">🖼️ Wallpapers</button>
<button data-category="announcements" onclick="chooseCategory(this,'announcements')">📢 DGM Updates</button>
<button data-category="saved" onclick="chooseCategory(this,'saved')">🔖 Saved</button>
</nav>
<section id="feed" aria-live="polite"><div class="loading">Loading DGM Social…</div></section>
</main>
<script>
const feed=document.getElementById("feed");let currentCategory="",allPosts=[];
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function prettyDate(v){try{return new Date(v).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}catch{return ""}}
function chooseCategory(button,category){document.querySelectorAll(".filters button").forEach(b=>b.classList.toggle("active",b===button));currentCategory=category;loadFeed()}
async function api(url,options={}){const response=await fetch(url,{credentials:"include",cache:"no-store",headers:{"Content-Type":"application/json",Accept:"application/json",...(options.headers||{})},...options});if(response.status===401){location.replace("/login.html");throw Error("Please sign in to use DGM Social.")}const data=await response.json().catch(()=>({}));if(!response.ok||!data.success)throw Error(data.message||"Request failed");return data}
async function loadFeed(){feed.innerHTML='<div class="loading">Loading posts…</div>';try{const data=await api("/api/social/posts?limit=50");allPosts=data.posts||[];const posts=currentCategory==="saved"?allPosts.filter(p=>p.saved):currentCategory?allPosts.filter(p=>p.category===currentCategory):allPosts;renderPosts(posts)}catch(e){feed.innerHTML='<div class="empty">We could not load the feed right now.<br>'+esc(e.message)+'</div>'}}
function renderPosts(posts){if(!posts.length){feed.innerHTML='<div class="empty"><div style="font-size:28px;margin-bottom:8px">🌱</div><b>No posts here yet.</b><br>DGM will share something soon. Check back later.</div>';return}feed.innerHTML=posts.map(p=>{const image=p.image_url?(p.media_type==="video"?'<video class="post-image" src="'+esc(p.image_url)+'" controls playsinline preload="metadata"></video>':'<img class="post-image" src="'+esc(p.image_url)+'" alt="'+esc(p.title)+'" loading="lazy" referrerpolicy="no-referrer">'):"";const wall=p.category==="wallpapers"?(p.wallpaper_url||p.image_url):"";return '<article class="post" id="post-'+Number(p.id)+'"><div class="post-head"><div class="avatar">DGM</div><div class="meta"><b>DHE GENIUS MEDIA</b><small>'+esc(prettyDate(p.created_at))+(p.pinned?' · <span class="pin">📌 PINNED</span>':'')+'</small></div><span class="badge">'+esc(p.category)+'</span></div><h2 class="post-title">'+esc(p.title)+'</h2>'+(p.body?'<div class="post-body">'+esc(p.body)+'</div>':"")+image+(wall?'<a class="wallpaper-cta" href="'+esc(wall)+'" target="_blank" rel="noopener noreferrer"><span>⬇ OPEN WALLPAPER</span><span>View full image ↗</span></a>':"")+'<div class="post-stats"><span>'+Number(p.like_count||0)+' likes · '+Number(p.comment_count||0)+' comments</span><span>'+Number(p.save_count||0)+' saves</span></div><div class="actions"><button class="'+(p.liked?'on':'')+'" onclick="toggleLike('+Number(p.id)+')">'+(p.liked?'♥ Liked':'♡ Like')+'</button><button onclick="toggleComments('+Number(p.id)+')">💬 Comment</button><button class="'+(p.saved?'on':'')+'" onclick="toggleSave('+Number(p.id)+')">'+(p.saved?'🔖 Saved':'♧ Save')+'</button><button onclick="sharePost('+Number(p.id)+')">↗ Share</button></div><div class="comments" id="comments-'+Number(p.id)+'" hidden><div class="comment-list" id="comment-list-'+Number(p.id)+'"></div><form class="comment-form" onsubmit="sendComment(event,'+Number(p.id)+')"><input id="comment-input-'+Number(p.id)+'" maxlength="600" placeholder="Write a respectful comment…" required><button type="submit">Post</button></form></div></article>'}).join("")}
function updatePost(id,changes){const p=allPosts.find(x=>Number(x.id)===Number(id));if(p)Object.assign(p,changes)}
async function toggleLike(id){try{const j=await api('/api/social/posts/'+id+'/like',{method:'POST',body:'{}'});updatePost(id,{liked:j.liked,like_count:j.like_count});refreshOne(id)}catch(e){alert(e.message)}}
async function toggleSave(id){try{const j=await api('/api/social/posts/'+id+'/save',{method:'POST',body:'{}'});updatePost(id,{saved:j.saved});refreshOne(id);if(currentCategory==="saved"&&!j.saved)loadFeed()}catch(e){alert(e.message)}}
function refreshOne(id){const card=document.getElementById('post-'+id);if(!card)return;const p=allPosts.find(x=>Number(x.id)===Number(id));if(!p)return;const buttons=card.querySelectorAll('.actions button');buttons[0].classList.toggle('on',!!p.liked);buttons[0].textContent=(p.liked?'♥ Liked':'♡ Like');buttons[2].classList.toggle('on',!!p.saved);buttons[2].textContent=(p.saved?'🔖 Saved':'♧ Save');const stats=card.querySelector('.post-stats');if(stats)stats.innerHTML='<span>'+Number(p.like_count||0)+' likes · '+Number(p.comment_count||0)+' comments</span><span>'+Number(p.save_count||0)+' saves</span>'}
async function toggleComments(id){const box=document.getElementById('comments-'+id);box.hidden=!box.hidden;if(box.hidden)return;try{const j=await api('/api/social/posts/'+id+'/comments');document.getElementById('comment-list-'+id).innerHTML=j.comments.length?j.comments.map(c=>'<div class="comment"><b>'+esc(c.customer_name)+' · <span style="color:var(--muted);font-weight:400">'+esc(prettyDate(c.created_at))+'</span></b><p>'+esc(c.body)+'</p></div>').join(""):'<div class="comment" style="color:var(--muted)">Be the first to comment.</div>'}catch(e){document.getElementById('comment-list-'+id).innerHTML='<div class="comment">'+esc(e.message)+'</div>'}}
async function sendComment(event,id){event.preventDefault();const input=document.getElementById('comment-input-'+id),body=input.value.trim();if(!body)return;const button=event.submitter;button.disabled=true;try{await api('/api/social/posts/'+id+'/comments',{method:'POST',body:JSON.stringify({body})});input.value='';const p=allPosts.find(x=>Number(x.id)===Number(id));if(p)p.comment_count=Number(p.comment_count||0)+1;await toggleComments(id);const box=document.getElementById('comments-'+id);if(box.hidden)box.hidden=false;const data=await api('/api/social/posts/'+id+'/comments');document.getElementById('comment-list-'+id).innerHTML=data.comments.map(c=>'<div class="comment"><b>'+esc(c.customer_name)+' · <span style="color:var(--muted);font-weight:400">'+esc(prettyDate(c.created_at))+'</span></b><p>'+esc(c.body)+'</p></div>').join("");refreshOne(id)}catch(e){alert(e.message)}finally{button.disabled=false}}
function sharePost(id){const p=allPosts.find(x=>Number(x.id)===Number(id));if(!p)return;const url=location.origin+'/social.html#post-'+id;const text=p.title+' — DGM Social';window.open('https://wa.me/?text='+encodeURIComponent(text+' '+url),'_blank','noopener,noreferrer')}
loadFeed();
</script>
</body></html>
