<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | DHE GENIUS MEDIA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#123b7a 0%,#07111f 42%,#02060c 100%);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:430px;padding:30px 24px;border-radius:24px;background:rgba(10,22,38,.95);border:1px solid rgba(255,255,255,.09);box-shadow:0 25px 70px rgba(0,0,0,.45)}.logo{text-align:center;font-weight:900;font-size:22px;margin-bottom:20px}.card h1{font-size:27px;margin-bottom:8px}.sub{color:#94a8bf;font-size:14px;line-height:1.5;margin-bottom:22px}.message{display:none;padding:12px 14px;margin-bottom:18px;border-radius:12px;font-size:14px;line-height:1.45}.message.show{display:block}.error{background:rgba(255,70,70,.12);border:1px solid rgba(255,70,70,.3);color:#ff9d9d}.success{background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.3);color:#72f0a0}.field{margin-bottom:18px}label{display:block;margin-bottom:8px;font-size:14px;font-weight:700}input{width:100%;height:52px;padding:0 15px;border-radius:13px;border:1px solid #263a52;outline:none;background:#081321;color:#fff;font-size:15px}button{width:100%;height:53px;border:0;border-radius:13px;background:linear-gradient(135deg,#168cff,#005eea);color:#fff;font-size:16px;font-weight:800}button:disabled{opacity:.65}.hidden{display:none}.back{text-align:center;margin-top:20px;font-size:14px}.back a{color:#4aa3ff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<section class="card">
<div class="logo">DGM</div>
<h1>Create a new password</h1>
<p class="sub" id="subtitle">Checking your reset link...</p>
<div id="message" class="message"></div>
<form id="form" class="hidden">
<div class="field"><label for="password">New Password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div>
<div class="field"><label for="confirm">Confirm New Password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></div>
<button id="button" type="submit">Reset Password</button>
</form>
<div class="back"><a href="/login.html">← Back to Login</a></div>
</section>
<script>
const token=new URLSearchParams(location.search).get("token")||"",form=document.getElementById("form"),button=document.getElementById("button"),message=document.getElementById("message"),subtitle=document.getElementById("subtitle");
function show(text,type){message.textContent=text;message.className="message show "+type}
async function verify(){
 if(!token){subtitle.textContent="This reset link is missing.";show("Invalid or expired reset link.","error");return}
 try{
  const r=await fetch("/api/reset-password/verify?token="+encodeURIComponent(token),{cache:"no-store",headers:{"Accept":"application/json"}});
  const data=await r.json().catch(()=>({}));
  if(!r.ok||!data.success) throw new Error(data.message||"Invalid or expired reset link.");
  subtitle.textContent="Choose a new password of at least 8 characters.";form.classList.remove("hidden");
 }catch(e){subtitle.textContent="This reset link cannot be used.";show(e.message,"error")}
}
form.addEventListener("submit",async e=>{
 e.preventDefault();
 const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;
 if(password.length<8){show("Password must be at least 8 characters.","error");return}
 if(password!==confirm){show("Passwords do not match.","error");return}
 button.disabled=true;button.textContent="Resetting...";
 try{
  const r=await fetch("/api/reset-password",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({token,newPassword:password,confirmPassword:confirm})});
  const data=await r.json().catch(()=>({}));
  if(!r.ok||!data.success) throw new Error(data.message||"Could not reset password.");
  show(data.message,"success");subtitle.textContent="Your password has been changed.";form.classList.add("hidden");
  setTimeout(()=>location.replace("/login.html"),1200);
 }catch(e){show(e.message||"Could not reset password.","error");button.disabled=false;button.textContent="Reset Password"}
});
verify();
</script>

<!-- DGM GLOBAL BRAND NAVIGATION -->
<script>(function(){function e(){document.querySelectorAll('.brand,.logo,.brand-name,.brand-tagline,header b,header strong').forEach(function(n){if(n.dataset.dgmNavBound==='1')return;var t=(n.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();if(!t.includes('dgm')&&!t.includes('dhe genius media')&&!t.includes('stay connected. stay genius'))return;n.dataset.dgmNavBound='1';n.style.cursor='pointer';n.setAttribute('role','link');n.setAttribute('aria-label','Go to DGM Dashboard');n.addEventListener('click',function(){window.location.href='/dashboard.html'})})}document.readyState==='loading'?document.addEventListener('DOMContentLoaded',e):e()})();</script>
</body>
</html>
