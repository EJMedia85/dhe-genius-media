<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110d"><title>DGM</title><style>
*{box-sizing:border-box}body{margin:0;background:#050b0b;color:#f7fffb;font-family:Inter,Arial,sans-serif;padding:20px 16px 90px}.wrap{max-width:1000px;margin:auto}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.back{color:#25d366;text-decoration:none;font-size:28px}.brand{font-weight:900}.muted{color:#829b93;font-size:12px}.card{background:#0b1515;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border-bottom:1px solid rgba(255,255,255,.07);padding:14px 0}.row:last-child{border-bottom:0}.amount{font-weight:900}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:rgba(37,211,102,.1);color:#25d366;font-size:10px;font-weight:800}.pill.warn{color:#f4c95d;background:rgba(244,201,93,.1)}.pill.bad{color:#ff6670;background:rgba(255,102,112,.1)}button{background:#25d366;color:#06100b;border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}input,textarea,select{width:100%;background:#07100f;color:#fff;border:1px solid #20352d;border-radius:10px;padding:12px;margin-top:7px}label{display:block;margin:12px 0;font-size:12px;color:#9ab0a8}.empty{text-align:center;color:#829b93;padding:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){body{padding:14px 12px 80px}.row{flex-direction:column}.actions{width:100%}}
</style></head><body><main class="wrap"><div class="top"><a class="back" href="/dashboard.html">‹</a><div><div class="brand">Transaction Center</div><div class="muted">Your complete DGM wallet and order history</div></div></div>
<div class="actions"><button onclick="load()">↻ Refresh</button><a href="/account.html#withdraw"><button>Withdraw to MoMo</button></a></div>
<div id="app"><div class="empty">Loading transactions...</div></div>
<script>
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function money(v){return "GH₵"+Number(v||0).toFixed(2)}
function status(v){const s=String(v||"Pending");const cls=s.toLowerCase().includes("complete")||s.toLowerCase().includes("paid")?"":s.toLowerCase().includes("fail")||s.toLowerCase().includes("reject")?"bad":"warn";return '<span class="pill '+cls+'">'+esc(s)+'</span>'}
async function load(){const box=document.getElementById("app");try{const r=await fetch("/api/transactions",{credentials:"include",cache:"no-store"});if(r.status===401){location.href="/login.html";return}const x=await r.json();if(!x.success)throw Error(x.message);let html='<div class="grid">';
html+='<section class="card"><h3>Orders</h3>'+(x.orders.length?x.orders.map(o=>'<div class="row"><div><b>'+esc(o.service)+'</b><div class="muted">'+esc(o.order_ref)+' • '+esc(o.network||"")+' '+esc(o.phone||"")+'<br>'+new Date(o.created_at).toLocaleString()+'</div></div><div class="amount">'+money(o.amount)+'<br>'+status(o.status)+'<br><a href="/receipt.html?id='+o.id+'" class="muted">Receipt</a></div></div>').join(""):'<div class="empty">No orders yet.</div>')+'</section>';
html+='<section class="card"><h3>Wallet Transactions</h3>'+(x.wallet_transactions.length?x.wallet_transactions.map(t=>'<div class="row"><div><b>'+esc(t.description||t.type)+'</b><div class="muted">'+esc(t.reference||t.transaction_ref||"")+'<br>'+new Date(t.created_at).toLocaleString()+'</div></div><div class="amount">'+(String(t.type).toLowerCase().includes("debit")||String(t.type).toLowerCase().includes("withdraw")?"-":"+")+money(t.amount)+'</div></div>').join(""):'<div class="empty">No wallet transactions yet.</div>')+'</section>';
html+='</div><section class="card"><h3>MoMo Withdrawals</h3>'+(x.withdrawals.length?x.withdrawals.map(w=>'<div class="row"><div><b>'+esc(w.momo_network)+' • '+esc(w.momo_phone)+'</b><div class="muted">'+esc(w.reference)+' • '+new Date(w.created_at).toLocaleString()+'</div></div><div class="amount">'+money(w.amount)+'<br>'+status(w.status)+'</div></div>').join(""):'<div class="empty">No withdrawals yet.</div>')+'</section>';
html+='<section class="card"><h3>Wallet Top-ups</h3>'+(x.wallet_topups.length?x.wallet_topups.map(t=>'<div class="row"><div><b>Wallet top-up</b><div class="muted">'+esc(t.reference)+' • '+new Date(t.created_at).toLocaleString()+'</div></div><div class="amount">+'+money(t.amount)+'<br>'+status(t.status)+'</div></div>').join(""):'<div class="empty">No top-ups yet.</div>')+'</section>';
box.innerHTML=html}catch(e){box.innerHTML='<div class="empty">Unable to load transactions.<br>'+esc(e.message)+'</div>'}}
load();setInterval(load,15000);
</script></main></body></html>
