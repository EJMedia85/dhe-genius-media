<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DGM Rewards</title><style>body{margin:0;background:#07110d;color:#f4fff8;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.brand{font-weight:800;color:#25d366;font-size:24px}.card{background:#0d1b15;border:1px solid #193329;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:28px;font-weight:800;color:#25d366}.muted{color:#9fb1a8}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #29463a;background:#08130e;color:white;margin-top:8px}button{background:#25d366;color:#06100b;border:0;font-weight:800}.row{display:flex;gap:10px}.row>*{flex:1}a{color:#25d366;text-decoration:none}</style></head><body><div class="wrap"><div class="brand">DGM • Rewards</div><p><a href="/dashboard.html">← Dashboard</a></p><div class="grid"><div class="card"><div class="muted">Loyalty Points</div><div id="points" class="stat">0</div></div><div class="card"><div class="muted">Cashback Balance</div><div id="cashback" class="stat">GH₵0.00</div></div><div class="card"><div class="muted">Successful Referrals</div><div id="referrals" class="stat">0</div></div></div><div class="card"><h2>Your Referral Code</h2><p id="code" class="stat">Loading…</p><p class="muted">Share this code with friends. Qualifying purchases can unlock rewards.</p><div class="row"><input id="applyCode" placeholder="Enter a friend's referral code"><button onclick="applyReferral()">Apply Referral</button></div><p id="msg"></p></div><div class="card"><h2>Rewards History</h2><div id="history" class="muted">Loading…</div></div></div><script>async function load(){const r=await fetch('/api/rewards',{credentials:'include',cache:'no-store'});if(r.status===401){location='/login.html';return}const d=await r.json();if(!d.success){document.getElementById('msg').textContent=d.message||'Could not load rewards';return}document.getElementById('code').textContent=d.referral_code||'—';document.getElementById('points').textContent=d.customer.loyalty_points||0;document.getElementById('cashback').textContent='GH₵'+Number(d.customer.cashback_balance||0).toFixed(2);document.getElementById('referrals').textContent=d.referrals.count||0;document.getElementById('history').innerHTML=d.loyalty.length?d.loyalty.map(x=>'<p><b>'+Number(x.points>0?'+':'')+x.points+' points</b> — '+esc(x.reason)+'<br><small>'+new Date(x.created_at).toLocaleString()+'</small></p>').join(''):'No rewards yet.'}async function applyReferral(){const code=document.getElementById('applyCode').value.trim();const r=await fetch('/api/rewards/apply-referral',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({code})});const d=await r.json();document.getElementById('msg').textContent=d.message||'Done';if(d.success)load()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();</script></body></html>
