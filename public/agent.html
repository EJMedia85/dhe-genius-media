<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DGM Agent Center</title>
<style>
body{margin:0;background:#06100d;color:#fff;font:14px Arial}.wrap{max-width:1000px;margin:auto;padding:20px}.panel{background:#0c1b17;border:1px solid #18352a;border-radius:16px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#091712;border:1px solid #18352a;border-radius:12px;padding:14px}.muted{color:#91aaa0}.green{color:#25d366}input,select,button{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;margin:5px 0;background:#07120f;color:#fff;border:1px solid #18352a}button{font-weight:bold;cursor:pointer}.primary{background:#25d366;color:#031008;border-color:#25d366}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #18352a}th{color:#91aaa0;font-size:11px}@media(max-width:700px){.grid,.row{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.row{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<div class="panel"><b class="green">DGM</b> / DHE GENIUS MEDIA <button onclick="location.href='/dashboard.html'">← Dashboard</button></div>
<div id="app">Loading Agent Center…</div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=v=>'GH₵'+Number(v||0).toFixed(2);
async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',...o});const d=await r.json().catch(()=>({success:false,message:'Invalid response'}));if(r.status===401){location='/login.html';throw Error('Login required.')}if(!r.ok||d.success===false)throw Error(d.message||'Request failed');return d}
async function load(){try{const d=await api('/api/agent/me');if(!d.enrolled){applyView();return}agentView(d)}catch(e){$('app').innerHTML='<div class="panel">'+esc(e.message)+'</div>'}}
function applyView(){$('app').innerHTML='<div class="panel"><h1>Become a DGM Agent</h1><p class="muted">Apply to sell DGM services and earn profit on successful sales.</p><textarea id="note" style="width:100%;height:100px;background:#07120f;color:#fff;border:1px solid #18352a;border-radius:10px" placeholder="Tell DGM about your business (optional)"></textarea><button class="primary" onclick="apply()">Apply to become an agent</button><p id="msg" class="muted"></p></div>'}
async function apply(){try{const d=await api('/api/agent/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:$('note').value})});$('msg').textContent=d.message;setTimeout(load,700)}catch(e){$('msg').textContent=e.message}}
function agentView(d){const a=d.agent,s=d.stats;$('app').innerHTML='<div class="panel"><h1>DGM Agent Center</h1><p class="muted">Agent ID: <b>'+esc(a.agent_code)+'</b> · '+esc(a.tier)+' · '+esc(a.status)+'</p><div class="grid"><div class="card"><small>Agent Wallet</small><h2>'+money(a.wallet)+'</h2></div><div class="card"><small>Commission Balance</small><h2 class="green">'+money(a.commission_balance)+'</h2></div><div class="card"><small>Completed Sales</small><h2>'+s.completed_sales+'</h2></div><div class="card"><small>Total Profit</small><h2 class="green">'+money(s.total_profit)+'</h2></div></div></div><div class="row"><div class="panel"><h2>Fund Agent Wallet</h2><p class="muted">Transfer money from your normal DGM Wallet.</p><input id="fund" type="number" min="5" step=".01" placeholder="Amount"><button class="primary" onclick="fund()">Transfer</button><p id="fundMsg" class="muted"></p></div><div class="panel"><h2>Sell Data</h2><select id="network" onchange="sizes()"><option>MTN</option><option>AirtelTigo</option><option>Telecel</option></select><select id="capacity"></select><input id="phone" placeholder="Customer phone"><input id="price" type="number" step=".01" placeholder="Customer price"><p id="hint" class="muted"></p><button class="primary" onclick="sell()">Sell & Deliver Data</button><p id="sellMsg" class="muted"></p></div></div><div class="panel"><h2>Withdraw Commission</h2><div class="row"><input id="wa" type="number" min="5" step=".01" placeholder="Amount"><select id="wn"><option>MTN</option><option>Telecel</option><option>AirtelTigo</option><option>Vodafone</option></select><input id="wp" placeholder="MoMo number"><input id="wnm" placeholder="Account name"></div><button onclick="withdraw()">Request Withdrawal</button><p id="wdMsg" class="muted"></p></div><div class="panel"><h2>Recent Sales</h2><table><thead><tr><th>Reference</th><th>Bundle</th><th>Phone</th><th>Base</th><th>Price</th><th>Profit</th><th>Status</th></tr></thead><tbody id="sales"></tbody></table></div></div>';sizes();loadSales()}
async function sizes(){try{const d=await api('/api/data-bundles'),list=d.networks[$('network').value]||[];$('capacity').innerHTML=list.map(x=>'<option value="'+esc(String(x[0]).replace('GB',''))+'" data-p="'+x[1]+'">'+esc(x[0])+' • '+money(x[1])+'</option>').join('');hint()}catch(e){}}
function hint(){const o=$('capacity').selectedOptions[0];if(o)$('hint').textContent='Base cost '+money(o.dataset.p)+'; the difference between your customer price and base becomes your profit.'}
async function fund(){try{const d=await api('/api/agent/wallet/transfer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:$('fund').value})});$('fundMsg').textContent=d.message;load()}catch(e){$('fundMsg').textContent=e.message}}
async function sell(){try{const d=await api('/api/agent/data/sell',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({network:$('network').value,capacity:$('capacity').value,phone:$('phone').value,sale_price:$('price').value})});$('sellMsg').textContent=d.message+' '+d.order_ref+' · Profit '+money(d.profit);load()}catch(e){$('sellMsg').textContent=e.message}}
async function withdraw(){try{const d=await api('/api/agent/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:$('wa').value,momo_network:$('wn').value,momo_phone:$('wp').value,momo_name:$('wnm').value})});$('wdMsg').textContent=d.message+' '+d.reference;load()}catch(e){$('wdMsg').textContent=e.message}}
async function loadSales(){try{const d=await api('/api/agent/sales');$('sales').innerHTML=d.sales.length?d.sales.map(x=>'<tr><td>'+esc(x.order_ref)+'</td><td>'+esc(x.network+' '+x.capacity+'GB')+'</td><td>'+esc(x.phone)+'</td><td>'+money(x.base_cost)+'</td><td>'+money(x.sale_price)+'</td><td class="green">'+money(x.profit)+'</td><td>'+esc(x.status)+'</td></tr>').join(''):'<tr><td colspan="7">No sales yet.</td></tr>'}catch(e){}}
load();
</script></body></html>
