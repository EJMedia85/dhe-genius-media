services:
  - type: web
    name: dhe-genius-media
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_CHANNEL_ID
        sync: false

  - type: cron
    name: dhe-genius-media-savings-cron
    runtime: node
    schedule: "0 * * * *"
    buildCommand: npm install
    startCommand: node scripts/savings-cron.js
    envVars:
      - key: BASE_URL
        value: https://dhe-genius-media.onrender.com
      - key: CRON_SECRET
        sync: false
